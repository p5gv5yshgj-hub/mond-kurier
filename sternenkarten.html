<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Sternenkarten</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0c0f22">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sternenkarten">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-sized column. Status bar on top, one screen in the middle, four tabs at the bottom.
   Every screen leads with one clear action; the upgrade tree is a pannable star map. */
:root {
  --night: #0c0f22;      /* deep lunar night, page ground */
  --deck: #171b37;       /* raised panels */
  --deck-2: #222851;     /* chips, empty bars */
  --line: #313869;       /* hairlines */
  --moon: #ece8d9;       /* moon-silver text */
  --dim: #a3a5c2;        /* secondary text */
  --gold: #f2c14e;       /* lunar gold: the one action colour */
  --gold-ink: #1b1606;
  --hp: #ff5d6c;
  --shield: #6ecbff;
  --good: #7bd88f;
  --xp: #9a88ff;
  --t-a: #ff7a59; --t-d: #59b8ff; --t-c: #c48bff; --t-k: #f2c14e;
  --r-c: #9aa3b8; --r-r: #4fb3ff; --r-e: #b77bff; --r-l: #ffb347;
  --f-display: "Chakra Petch", "Trebuchet MS", system-ui, sans-serif;
  --f-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--night); color: var(--moon);
  font-family: var(--f-body); font-size: 16px; line-height: 1.35;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  overflow: hidden; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none;
}
body::after {
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: .4;
  background-image:
    radial-gradient(1px 1px at 12% 18%, var(--moon) 50%, transparent 51%),
    radial-gradient(1px 1px at 72% 9%, var(--moon) 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 41% 63%, var(--dim) 50%, transparent 51%),
    radial-gradient(1px 1px at 88% 47%, var(--moon) 50%, transparent 51%),
    radial-gradient(1px 1px at 23% 86%, var(--dim) 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 63% 92%, var(--moon) 50%, transparent 51%);
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, [data-act]:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; letter-spacing: .02em; }
p { margin: 0; }
.muted { color: var(--dim); }

#app { position: relative; z-index: 1; max-width: 560px; height: 100%; margin: 0 auto; display: flex; flex-direction: column; }

/* ---------- Statusleiste ---------- */
#top { display: flex; align-items: center; gap: 12px; padding-block: calc(12px + env(safe-area-inset-top, 0px)) 10px; border-bottom: 1px solid var(--line); }
.lvl-badge { font-family: var(--f-display); font-weight: 700; font-size: 14px; background: var(--gold); color: var(--gold-ink); padding: 4px 9px; border-radius: 7px; white-space: nowrap; }
.xpwrap { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.bar { height: 8px; background: var(--deck-2); border-radius: 4px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--xp); border-radius: 4px; transition: width .5s ease; }
.bar.gold i { background: var(--gold); }
.xptext { font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; }
.wallet { display: flex; gap: 10px; font-weight: 700; font-variant-numeric: tabular-nums; font-size: 15px; white-space: nowrap; }
.coin::before { content: ""; display: inline-block; width: .8em; height: .8em; border-radius: 50%; background: var(--gold); box-shadow: inset -2px -2px 0 rgba(0,0,0,.25); margin-right: 5px; vertical-align: -1px; }
.sp { color: var(--good); }
.sp::before { content: "★"; margin-right: 3px; }

#main { flex: 1; overflow-y: auto; overflow-x: hidden; padding-block: 14px 24px; -webkit-overflow-scrolling: touch; display: flex; flex-direction: column; gap: 14px; min-height: 0; }
#main > * { flex-shrink: 0; }
#main.fill { overflow: hidden; padding-bottom: 8px; }
.screen-title h2 { font-size: 24px; }
.screen-title p { color: var(--dim); font-size: 14px; margin-top: 2px; }
.label { font-family: var(--f-display); text-transform: uppercase; letter-spacing: .12em; font-size: 12px; color: var(--dim); margin-top: 6px; }

#nav { display: grid; grid-template-columns: repeat(5, 1fr); border-top: 1px solid var(--line); padding-block: 6px calc(8px + env(safe-area-inset-bottom, 0px)); }
#nav button { background: none; border: 0; padding: 4px 0; display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--dim); font-size: 12px; font-weight: 600; }
#nav button svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
#nav button.on { color: var(--gold); }
#nav .badge { position: relative; }
#nav .badge b { position: absolute; top: -4px; right: -12px; min-width: 18px; height: 17px; padding: 0 4px; border-radius: 9px; background: var(--good); color: var(--night); font-size: 11px; line-height: 17px; }

.btn { border: 0; border-radius: 12px; padding: 13px 18px; font-weight: 700; font-size: 16px; background: var(--gold); color: var(--gold-ink); font-family: var(--f-display); letter-spacing: .03em; transition: transform .12s ease, opacity .2s; }
.btn:active { transform: scale(.97); }
.btn.ghost { background: var(--deck-2); color: var(--moon); }
.btn.green { background: var(--good); color: var(--night); }
.btn.danger { background: var(--hp); color: var(--night); }
.btn.big { width: 100%; font-size: 20px; padding: 16px; }
.btn.sm { padding: 8px 12px; font-size: 14px; border-radius: 9px; }
.btn.wide { width: 100%; }
.btn[disabled] { opacity: .4; pointer-events: none; }
.panel { background: var(--deck); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
.r-c { --rc: var(--r-c); } .r-r { --rc: var(--r-r); } .r-e { --rc: var(--r-e); } .r-l { --rc: var(--r-l); }
.rar { color: var(--rc); font-weight: 700; }


/* ---------- Start ---------- */
.herobar { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; background: var(--deck); border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
.portrait { width: 64px; height: 64px; border-radius: 50%; flex: none; display: grid; place-items: center; font-size: 36px;
  background: radial-gradient(circle at 35% 30%, var(--moon), #b9b39e 55%, #6f6a5b); box-shadow: 0 0 0 3px var(--hc, var(--r-c)); }
.herobar .hb { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.herobar .ht { font-size: 12px; text-transform: uppercase; letter-spacing: .12em; color: var(--hc); font-weight: 700; }
.herobar .hn { font-family: var(--f-display); font-size: 20px; font-weight: 700; }
.chev { color: var(--dim); font-size: 22px; }
.nextfight { position: relative; overflow: hidden; border-radius: 20px; padding: 18px; border: 2px solid var(--gold); background: var(--deck); display: flex; flex-direction: column; gap: 12px; }
.nextfight::before { content: ""; position: absolute; inset: 0; background: var(--zbg); opacity: .55; pointer-events: none; }
.nextfight > * { position: relative; }
.nf-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.nf-kicker { font-size: 12px; text-transform: uppercase; letter-spacing: .14em; color: var(--gold); font-weight: 700; }
.nf-title { font-family: var(--f-display); font-size: 22px; font-weight: 700; margin-top: 2px; }
.nf-foes { font-size: 44px; letter-spacing: 6px; text-align: center; line-height: 1.2; }
.nf-hint { font-size: 14px; color: var(--moon); background: color-mix(in srgb, var(--night) 55%, transparent); border-radius: 12px; padding: 10px 12px; line-height: 1.4; }
.switchrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; background: none; border: 0; padding: 0; text-align: left; font-size: 14px; color: var(--dim); }
.switchrow b { color: var(--moon); }
.sw { width: 46px; height: 28px; border-radius: 999px; background: var(--deck-2); position: relative; flex: none; transition: background .2s; border: 1px solid var(--line); }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--dim); transition: transform .2s, background .2s; }
.sw.on { background: color-mix(in srgb, var(--good) 40%, var(--deck-2)); }
.sw.on::after { transform: translateX(18px); background: var(--good); }
.todos { display: flex; flex-direction: column; gap: 8px; }
.todo { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: var(--deck); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
.todo .ti { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-size: 22px; flex: none; background: var(--deck-2); }
.todo .tt { flex: 1; min-width: 0; }
.todo .tt b { display: block; }
.todo .tt span { font-size: 13px; color: var(--dim); }
.todo.hot { border-color: var(--good); }
.todo.hot .ti { background: color-mix(in srgb, var(--good) 22%, var(--deck-2)); }
.goal { font-size: 14px; color: var(--dim); line-height: 1.5; display: flex; flex-direction: column; gap: 4px; }
.goal b { color: var(--moon); }

/* ---------- Held ---------- */
.hero-svg { display: block; overflow: visible; }
.hero-svg.idle { animation: hover 3.2s ease-in-out infinite; }
@keyframes hover { 50% { transform: translateY(-5px); } }
.herocard { position: relative; overflow: hidden; display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; border-radius: 20px; padding: 12px 14px 12px 6px;
  border: 2px solid var(--hc); background: radial-gradient(120% 120% at 15% 50%, color-mix(in srgb, var(--hc) 22%, var(--deck)), var(--deck) 65%); }
.herocard .hb { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
.herocard .ht { font-size: 12px; text-transform: uppercase; letter-spacing: .12em; color: var(--hc); font-weight: 700; }
.herocard .hn { font-family: var(--f-display); font-size: 21px; font-weight: 700; line-height: 1.1; }
.eqdots { display: flex; gap: 5px; flex-wrap: wrap; }
.eqdots span { font-size: 11px; font-weight: 700; padding: 2px 6px; border-radius: 6px; background: var(--deck-2); border: 1px solid var(--tc); color: var(--moon); white-space: nowrap; }
.stage-hero { position: relative; text-align: center; border-radius: 24px; padding: 18px 16px 16px; overflow: hidden; border: 2px solid var(--hc);
  background: radial-gradient(70% 60% at 50% 38%, color-mix(in srgb, var(--hc) 30%, transparent), transparent 70%), linear-gradient(180deg, var(--deck), var(--night)); }
.stage-hero::after { content: ""; position: absolute; left: 50%; bottom: 96px; width: 190px; height: 34px; transform: translateX(-50%); border-radius: 50%;
  background: radial-gradient(closest-side, color-mix(in srgb, var(--hc) 45%, transparent), transparent); pointer-events: none; }
.stage-hero .hero-svg { margin: 0 auto; position: relative; z-index: 1; }
.stage-hero .tt { font-size: 13px; text-transform: uppercase; letter-spacing: .16em; color: var(--hc); font-weight: 700; margin-top: 4px; }
.stage-hero h2 { font-size: 28px; }
.stage-hero .lvline { font-family: var(--f-display); color: var(--dim); font-size: 16px; margin-bottom: 10px; }
.stats4 { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 6px; }
.stats4 div { background: var(--deck); border: 1px solid var(--line); border-radius: 12px; padding: 10px 2px; text-align: center; }
.stats4 b { display: block; font-family: var(--f-display); font-size: 18px; font-variant-numeric: tabular-nums; }
.stats4 span { font-size: 10.5px; color: var(--dim); text-transform: uppercase; letter-spacing: .06em; }
.eqgrid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px; }
.eq { display: flex; flex-direction: column; gap: 6px; padding: 12px; border-radius: 16px; background: var(--deck); border: 2px solid var(--tc); min-width: 0; }
.eq .eh { display: flex; gap: 8px; align-items: center; }
.eq .ei { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-size: 22px; flex: none; background: color-mix(in srgb, var(--tc) 22%, var(--deck-2)); }
.eq .en { font-weight: 700; font-size: 14px; line-height: 1.15; }
.eq .ek { font-size: 12px; color: var(--dim); }
.eq .ed { font-size: 13px; color: var(--dim); line-height: 1.35; flex: 1; }
.eq .btn { width: 100%; }
.forms { display: grid; grid-template-columns: repeat(6, minmax(0,1fr)); gap: 4px; }
.forms div { text-align: center; border-radius: 12px; padding: 6px 0 4px; border: 1px solid var(--line); opacity: .4; min-width: 0; }
.forms div.on { opacity: 1; border-color: var(--hc); background: color-mix(in srgb, var(--hc) 14%, transparent); }
.forms div.done { opacity: .8; }
.forms .hero-svg { margin: 0 auto; }
.forms span { display: block; font-size: 10px; color: var(--dim); font-weight: 700; }
.ultbox { display: flex; gap: 12px; align-items: center; }
.ultbox .uicon { width: 52px; height: 52px; border-radius: 50%; flex: none; display: grid; place-items: center; font-size: 26px;
  background: radial-gradient(circle, color-mix(in srgb, var(--gold) 50%, transparent), var(--deck-2)); border: 2px solid var(--gold); }

/* ---------- Spielmodi ---------- */
.modes { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
.mode { position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; text-align: left; padding: 14px; border-radius: 18px; min-width: 0;
  border: 2px solid var(--mc); background: radial-gradient(120% 90% at 100% 0%, color-mix(in srgb, var(--mc) 26%, transparent), transparent 60%), var(--deck); }
.mode .mi { font-size: 34px; line-height: 1.1; }
.mode .mn { font-family: var(--f-display); font-weight: 700; font-size: 17px; }
.mode .md { font-size: 12.5px; color: var(--dim); line-height: 1.3; }
.mode .mb { font-size: 12px; color: var(--moon); font-weight: 600; margin-top: auto; padding-top: 4px; }
.mode .daily { position: absolute; top: 10px; right: 10px; font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 6px; background: var(--good); color: var(--night); }
.mode.locked { filter: grayscale(.8); opacity: .55; }
/* Minispiele */
.mg .b-top { align-items: center; }
.mgscore { font-family: var(--f-display); font-weight: 700; font-size: 26px; color: var(--gold); font-variant-numeric: tabular-nums; }
.mgarea { position: relative; flex: 1; min-height: 0; border-radius: 18px; overflow: hidden; border: 1px solid var(--line); background: color-mix(in srgb, var(--night) 70%, transparent); touch-action: manipulation; }
.mgarea canvas { display: block; width: 100%; height: 100%; }
.mghint { text-align: center; font-size: 14px; color: var(--dim); padding-block: 8px 14px; min-height: 40px; }
.mgtime { height: 6px; background: var(--deck-2); border-radius: 3px; overflow: hidden; margin-top: 4px; width: 120px; }
.mgtime i { display: block; height: 100%; background: var(--gold); transition: width .2s linear; }
.memgrid { position: absolute; inset: 10px; display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); grid-template-rows: repeat(var(--rows, 4), minmax(0,1fr)); gap: 7px; }
.memgrid.r6 .mem { font-size: 26px; }
.pwr { position: absolute; top: 34px; right: 12px; font-size: 13px; font-weight: 700; color: var(--shield); text-align: right; }
.met.big { font-size: 60px; width: 76px; height: 76px; margin: -38px 0 0 -38px; }
.met.big.hit1 { filter: brightness(1.3) saturate(.6); } .met.big.hit2 { filter: brightness(1.7) saturate(.2); }
.frosted .met { filter: hue-rotate(160deg) brightness(1.2); }
.weak { position: absolute; width: 64px; height: 64px; margin: -32px 0 0 -32px; border-radius: 50%; border: 0; font-size: 40px; background: radial-gradient(circle, color-mix(in srgb, var(--gold) 45%, transparent), transparent 70%); animation: pop .3s ease; z-index: 3; touch-action: manipulation; }
.crystal { position: absolute; left: 50%; top: 18%; transform: translateX(-50%); border: 2px solid var(--shield); border-radius: 16px; background: color-mix(in srgb, var(--shield) 22%, var(--deck)); font-size: 34px; padding: 6px 14px; z-index: 3; touch-action: manipulation; }
.crystal span { display: block; font-size: 12px; font-weight: 700; color: var(--shield); }
.bossbtn.shielded { filter: drop-shadow(0 0 18px var(--shield)) saturate(.5); }
.bossstage { font-family: var(--f-display); font-weight: 700; color: var(--gold); font-size: 14px; }
.mem { border: 0; border-radius: 14px; background: linear-gradient(150deg, var(--r-e), var(--r-r) 60%, var(--deck-2)); font-size: 34px; display: grid; place-items: center; transition: transform .25s; color: transparent; }
.mem::after { content: "✦"; color: var(--moon); font-size: 22px; opacity: .8; }
.mem.up { background: var(--deck); border: 2px solid var(--moon); color: inherit; transform: rotateY(180deg) scaleX(-1); }
.mem.up::after, .mem.done::after { content: none; }
.mem.done { background: color-mix(in srgb, var(--good) 22%, var(--deck)); border: 2px solid var(--good); color: inherit; opacity: .8; }
.mem.bad { animation: shake .3s; }
.met { position: absolute; left: 0; top: 0; width: 58px; height: 58px; margin: -29px 0 0 -29px; display: grid; place-items: center; font-size: 40px; border: 0; background: none; padding: 0; touch-action: manipulation; }
.met.pop { animation: metpop .25s ease-out forwards; pointer-events: none; }
@keyframes metpop { to { transform: scale(1.8); opacity: 0; } }
.base { position: absolute; left: 0; right: 0; bottom: 0; height: 46px; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 22px;
  background: linear-gradient(0deg, #6f6a5b, #b9b39e); border-top: 3px solid var(--moon); }
.base.hit { animation: shake .3s; }
.lives { position: absolute; top: 8px; left: 10px; font-size: 18px; letter-spacing: 2px; }
.combo { position: absolute; top: 8px; right: 12px; font-family: var(--f-display); font-weight: 700; color: var(--gold); font-size: 18px; }
.bosszone { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 12px; }
.bossbtn { border: 0; background: none; font-size: 120px; line-height: 1; padding: 0; transition: transform .06s; filter: drop-shadow(0 10px 20px rgba(0,0,0,.6)); touch-action: manipulation; }
.bossbtn:active { transform: scale(.93); }
.bossbtn.hurt { animation: shake .2s; }
.bosshp { width: 90%; height: 14px; background: var(--deck-2); border-radius: 7px; overflow: hidden; border: 1px solid var(--line); position: relative; }
.bosshp i { display: block; height: 100%; background: linear-gradient(90deg, var(--hp), #ff9a7a); transition: width .15s; }
.bosshp b { position: absolute; top: 0; height: 100%; width: 2px; background: var(--moon); opacity: .6; }
.bossinfo { font-size: 13px; color: var(--dim); text-align: center; font-variant-numeric: tabular-nums; }
.ultbtn { width: 90%; }
.ultbtn.ready { animation: charged .6s ease-in-out infinite; }

/* ---------- Etappen ---------- */

/* ---------- Team ---------- */
.lineup { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 8px; }
.slot { min-height: 116px; border-radius: 14px; border: 1px dashed var(--line); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-align: center; padding: 8px 3px; font-size: 12px; color: var(--dim); background: none; min-width: 0; }
.slot.full { border: 2px solid var(--rc); background: var(--deck); color: var(--moon); }
.slot.hero { border: 2px solid var(--gold); background: color-mix(in srgb, var(--gold) 10%, var(--deck)); color: var(--moon); }
.slot .se { font-size: 32px; line-height: 1.15; }
.slot .sn { font-weight: 700; font-size: 12px; line-height: 1.15; max-width: 100%; overflow-wrap: anywhere; }
.slot .sl { font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums; }
.slot.empty { border-color: var(--good); color: var(--good); }
.slot.locked { opacity: .5; }
.clist { display: flex; flex-direction: column; gap: 8px; }
.crow { display: flex; gap: 12px; align-items: center; padding: 12px; background: var(--deck); border: 1px solid var(--line); border-left: 4px solid var(--rc); border-radius: 14px; text-align: left; width: 100%; }
.crow .ce { font-size: 34px; width: 44px; text-align: center; flex: none; }
.crow .ci { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.crow .cn { font-weight: 700; font-size: 16px; }
.crow .cm { font-size: 13px; color: var(--dim); }
.crow .clv { font-family: var(--f-display); font-weight: 700; font-size: 16px; text-align: right; white-space: nowrap; }
.crow.future { opacity: .55; border-style: dashed; border-left-style: solid; }
.crow.future .ce { filter: grayscale(1) brightness(.6); }
.flag { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 6px; background: var(--gold); color: var(--gold-ink); margin-top: 3px; }

/* ---------- Modal ---------- */
.modal-bg { position: fixed; inset: 0; z-index: 50; background: color-mix(in srgb, var(--night) 86%, transparent); display: flex; align-items: center; justify-content: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); animation: fade .2s ease; }
.modal { width: 100%; max-width: 420px; max-height: 100%; overflow-y: auto; background: var(--deck); border: 1px solid var(--line); border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.modal h2 { font-size: 22px; }
.modal p { color: var(--dim); line-height: 1.45; }
.modal .row { display: flex; gap: 8px; flex-wrap: wrap; }
.modal .row .btn { flex: 1; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.mhead { display: flex; gap: 14px; align-items: center; }
.mhead .me { font-size: 50px; line-height: 1; width: 72px; height: 72px; border-radius: 18px; display: grid; place-items: center; background: var(--deck-2); border: 2px solid var(--rc); flex: none; }
.mhead .mt { min-width: 0; }
.mhead .mt p { font-size: 14px; }
.box { background: var(--deck-2); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.box .bt { font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--dim); font-weight: 700; }
.box .bb { font-size: 15px; line-height: 1.4; }
.box .bb b { color: var(--gold); }
.stats3 { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; }
.stats3 div { background: var(--deck-2); border-radius: 12px; padding: 10px 4px; text-align: center; }
.stats3 b { display: block; font-family: var(--f-display); font-size: 20px; font-variant-numeric: tabular-nums; }
.stats3 span { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: .08em; }
.evorow { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 6px; }
.evorow div { text-align: center; border-radius: 12px; padding: 8px 4px; border: 1px solid var(--line); opacity: .45; }
.evorow div.on { opacity: 1; border-color: var(--rc); background: color-mix(in srgb, var(--rc) 12%, transparent); }
.evorow .ee { font-size: 28px; line-height: 1.2; }
.evorow .en { font-size: 12px; font-weight: 700; line-height: 1.15; }
.evorow .el { font-size: 11px; color: var(--dim); }
.ablist { display: flex; flex-direction: column; gap: 8px; }
.abrow { display: flex; gap: 12px; align-items: flex-start; padding: 10px 12px; background: var(--deck-2); border-radius: 12px; }
.abrow .lvtag { font-family: var(--f-display); font-weight: 700; font-size: 12px; min-width: 50px; text-align: center; padding: 3px 0; border-radius: 6px; background: var(--gold); color: var(--gold-ink); flex: none; }
.abrow.locked { opacity: .5; }
.abrow.locked .lvtag { background: var(--line); color: var(--dim); }
.abrow .an { font-weight: 700; }
.abrow .ad { font-size: 13px; color: var(--dim); line-height: 1.35; }
.steps { display: flex; flex-direction: column; gap: 10px; }
.steps div { display: flex; gap: 12px; align-items: flex-start; }
.steps i { font-style: normal; font-family: var(--f-display); font-weight: 700; width: 28px; height: 28px; border-radius: 50%; background: var(--gold); color: var(--gold-ink); display: grid; place-items: center; flex: none; }
.steps p { color: var(--moon); }
.codebox { width: 100%; resize: none; background: var(--night); color: var(--moon); border: 1px solid var(--line); border-radius: 10px; padding: 10px; font: 12px/1.3 ui-monospace, Menlo, monospace; word-break: break-all; user-select: text; -webkit-user-select: text; }
.steps span { color: var(--dim); font-size: 14px; display: block; }

/* ---------- Upgrade-Baum ---------- */
.treebar { display: flex; gap: 6px; align-items: center; }
.treebar .bjump { flex: 1; min-width: 0; border: 0; border-radius: 10px; padding: 8px 2px; background: var(--deck-2); color: var(--bc); font-weight: 700; font-size: 13px; }
.treebar .zoom { flex: none; border: 1px solid var(--line); background: var(--deck); border-radius: 10px; padding: 8px 10px; font-size: 13px; font-weight: 700; color: var(--moon); }
#main > .treewrap { flex: 1 1 0; min-height: 0; flex-shrink: 1; }
.treewrap { position: relative; overflow: auto; border: 1px solid var(--line); border-radius: 16px; background:
  radial-gradient(ellipse at 50% 0%, color-mix(in srgb, var(--xp) 14%, transparent), transparent 60%), var(--night); -webkit-overflow-scrolling: touch; touch-action: pan-x pan-y; }
.treesize { position: relative; }
.tree { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.tree svg { position: absolute; left: 0; top: 0; overflow: visible; }
.tree svg line { stroke: var(--line); stroke-width: 3; stroke-linecap: round; }
.tree svg line.own { stroke: var(--bc); stroke-width: 4; }
.tree svg line.next { stroke: color-mix(in srgb, var(--good) 55%, var(--line)); stroke-dasharray: 6 6; }
.tnode { position: absolute; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%; border: 2px solid var(--line); background: var(--deck);
  display: grid; place-items: center; font-size: 24px; padding: 0; transition: transform .15s; }
.tnode:active { transform: scale(.94); }
.tnode .tl { position: absolute; top: 60px; left: 50%; transform: translateX(-50%); width: 80px; font-size: 10.5px; font-weight: 600; line-height: 1.15; color: var(--dim); text-align: center; pointer-events: none; }
.tnode .tc { position: absolute; top: -6px; right: -8px; min-width: 22px; height: 20px; border-radius: 10px; font-size: 11px; font-weight: 700; line-height: 18px; padding: 0 5px; background: var(--deck-2); border: 1px solid var(--line); color: var(--dim); font-family: var(--f-body); }
.tnode.locked { opacity: .45; filter: grayscale(.7); }
.tnode.open { border-color: var(--good); border-style: dashed; }
.tnode.open .tl { color: var(--moon); }
.tnode.buy { border: 3px solid var(--good); box-shadow: 0 0 0 4px color-mix(in srgb, var(--good) 22%, transparent); animation: glow 1.8s ease-in-out infinite; }
.tnode.buy .tc { background: var(--good); color: var(--night); border-color: var(--good); }
.tnode.own { background: color-mix(in srgb, var(--bc) 30%, var(--deck)); border: 3px solid var(--bc); }
.tnode.own .tl { color: var(--moon); }
.tnode.own .tc { display: none; }
.tnode.flagship { width: 64px; height: 64px; margin: -32px 0 0 -32px; border-radius: 18px; font-size: 28px; }
.tnode.flagship .tl { top: 68px; }
.tnode.root { width: 84px; height: 84px; margin: -42px 0 0 -42px; border: 3px solid var(--gold); background: radial-gradient(circle, color-mix(in srgb, var(--gold) 30%, var(--deck)), var(--deck)); cursor: default; overflow: hidden; }
.bhead { position: absolute; transform: translate(-50%, -50%); padding: 5px 14px; border-radius: 999px; font-family: var(--f-display); font-weight: 700; font-size: 14px; letter-spacing: .06em; text-transform: uppercase; color: var(--night); background: var(--bc); white-space: nowrap; }
@keyframes glow { 50% { box-shadow: 0 0 0 8px color-mix(in srgb, var(--good) 10%, transparent); } }
.legendrow { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--dim); }
.legendrow span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; border: 2px solid var(--c); background: var(--f, transparent); }

/* ---------- Kampf ---------- */
#battle { position: fixed; inset: 0; z-index: 20; background: var(--night); display: flex; justify-content: center;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }
#battle::before { content: ""; position: absolute; inset: 0; background: var(--zbg); opacity: .45; pointer-events: none; }
.bwrap { position: relative; width: 100%; max-width: 520px; height: 100%; display: flex; flex-direction: column; gap: 6px; }
.b-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-block: 10px 0; }
.b-top .bz { font-size: 13px; color: var(--dim); }
.b-top .round { font-family: var(--f-display); font-weight: 700; font-size: 18px; }
.sidelabel { font-family: var(--f-display); text-transform: uppercase; letter-spacing: .14em; font-size: 12px; font-weight: 700; text-align: center; }
.sidelabel.foe { color: var(--hp); } .sidelabel.own { color: var(--good); }
.side { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.b-enemies { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }
.b-log { text-align: center; font-size: 15px; font-weight: 600; min-height: 46px; padding: 8px 12px; background: color-mix(in srgb, var(--deck) 85%, transparent); border: 1px solid var(--line); border-radius: 12px; display: grid; place-items: center; }
.b-team { padding-bottom: 10px; display: flex; flex-direction: column; gap: 6px; }
.b-team .side { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 6px; }
.unit { position: relative; border-radius: 12px; background: var(--deck); border: 1px solid var(--line); padding: 5px 4px 6px; text-align: center; display: flex; flex-direction: column; gap: 2px; transition: transform .15s ease, opacity .3s, filter .3s; min-width: 0; }
.b-enemies .unit { width: 104px; padding: 8px 6px; border-color: color-mix(in srgb, var(--hp) 40%, var(--line)); }
.unit .ue { font-size: 26px; line-height: 1.15; }
.b-enemies .unit .ue { font-size: 46px; }
.b-enemies .unit.boss { width: 136px; border-color: var(--r-l); }
.b-enemies .unit.boss .ue { font-size: 64px; }
.unit.hero { border: 2px solid var(--gold); }
.unit.herobig { flex-direction: row; align-items: center; gap: 10px; padding: 6px 12px 6px 4px; text-align: left;
  background: radial-gradient(90% 140% at 10% 50%, color-mix(in srgb, var(--gold) 18%, var(--deck)), var(--deck) 70%); }
.unit.herobig .hbx { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.unit.herobig .un { font-size: 14px; font-family: var(--f-display); font-weight: 700; }
.unit.herobig .uhp { height: 10px; }
.unit.herobig .uv { font-size: 12px; }
.uen { height: 8px; background: var(--deck-2); border-radius: 4px; overflow: hidden; position: relative; }
.uen i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--gold), #fff3c4); transition: width .25s ease; }
.uen.full i { animation: charged .6s ease-in-out infinite; }
@keyframes charged { 50% { filter: brightness(1.6); } }
.enlabel { font-size: 11px; color: var(--gold); font-weight: 700; display: flex; justify-content: space-between; }
.ultflash::after { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 50% 70%, color-mix(in srgb, var(--gold) 45%, transparent), transparent 70%); animation: ult .7s ease-out forwards; pointer-events: none; z-index: 4; }
@keyframes ult { from { opacity: 1; } to { opacity: 0; } }
.ultname { position: absolute; left: 50%; top: 38%; transform: translate(-50%, -50%); z-index: 5; font-family: var(--f-display); font-weight: 700; font-size: 28px; color: var(--gold); text-shadow: 0 2px 14px rgba(0,0,0,.9); white-space: nowrap; animation: ultname 1.1s ease forwards; pointer-events: none; }
@keyframes ultname { 0% { opacity: 0; scale: .6; } 20% { opacity: 1; scale: 1.1; } 80% { opacity: 1; } 100% { opacity: 0; } }
.unit .un { font-size: 10.5px; font-weight: 600; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.unit .uhp { height: 7px; background: var(--deck-2); border-radius: 4px; overflow: hidden; position: relative; }
.unit .uhp i { display: block; height: 100%; background: var(--hp); transition: width .25s ease; }
.unit .ush { position: absolute; left: 0; top: 0; bottom: 0; background: color-mix(in srgb, var(--shield) 80%, transparent); transition: width .25s; width: 0; }
.unit .uv { font-size: 10.5px; color: var(--moon); font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.unit .ust { position: absolute; top: 2px; right: 4px; font-size: 12px; }
.unit.act { transform: translateY(-6px) scale(1.06); border-color: var(--moon); box-shadow: 0 0 0 2px var(--moon); z-index: 2; }
.b-enemies .unit.act { transform: translateY(8px) scale(1.06); }
.unit.hurt { animation: shake .3s; }
.unit.dead { opacity: .25; filter: grayscale(1); }
.unit.revive { animation: pop .5s; }
@keyframes shake { 0%,100% { translate: 0; } 25% { translate: -6px 0; } 50% { translate: 5px 0; } 75% { translate: -3px 0; } }
@keyframes pop { 0% { transform: scale(.6); } 70% { transform: scale(1.15); } }
#fx { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.float { position: absolute; font-family: var(--f-display); font-weight: 700; font-size: 19px; text-shadow: 0 2px 5px rgba(0,0,0,.85); animation: floatup .9s ease-out forwards; transform: translateX(-50%); white-space: nowrap; z-index: 3; }
.float.dmg { color: var(--moon); } .float.crit { color: var(--gold); font-size: 25px; } .float.heal { color: var(--good); } .float.sh { color: var(--shield); } .float.miss { color: var(--dim); font-size: 14px; } .float.dot { color: var(--good); font-size: 16px; } .float.info { color: var(--gold); font-size: 14px; }
@keyframes floatup { from { opacity: 1; margin-top: 0; } to { opacity: 0; margin-top: -46px; } }
.burst { position: absolute; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%; border: 3px solid var(--moon); animation: burst .35s ease-out forwards; z-index: 2; }
.burst.crit { border-color: var(--gold); width: 80px; height: 80px; margin: -40px 0 0 -40px; }
.burst.heal { border-color: var(--good); }
@keyframes burst { from { transform: scale(.3); opacity: 1; } to { transform: scale(1.2); opacity: 0; } }
.beam { position: absolute; height: 3px; transform-origin: 0 50%; background: linear-gradient(90deg, transparent, var(--gold)); border-radius: 2px; animation: beam .28s ease-out forwards; z-index: 1; }
.beam.foe { background: linear-gradient(90deg, transparent, var(--hp)); }
@keyframes beam { from { opacity: 1; } to { opacity: 0; } }
.techbar { display: flex; gap: 6px; }
.tech { flex: 1; min-width: 0; border: 2px solid var(--line); border-radius: 12px; background: var(--deck); padding: 6px 2px; display: flex; flex-direction: column; align-items: center; gap: 1px; color: var(--moon); transition: transform .1s; }
.tech .ti { font-size: 22px; line-height: 1.1; }
.tech .tn { font-size: 11px; font-weight: 700; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.tech .tc { font-size: 10.5px; color: var(--dim); font-variant-numeric: tabular-nums; }
.tech.ready { border-color: var(--good); background: color-mix(in srgb, var(--good) 14%, var(--deck)); }
.tech.ready .tc { color: var(--good); font-weight: 700; }
.tech.ultb.ready { border-color: var(--gold); background: color-mix(in srgb, var(--gold) 20%, var(--deck)); animation: charged .6s ease-in-out infinite; }
.tech.ultb.ready .tc { color: var(--gold); }
.tech:active { transform: scale(.95); }
.tech[disabled] { opacity: .55; }
.tech.ready[disabled] { opacity: 1; }
.autobtn { border: 1px solid var(--line); background: var(--deck-2); color: var(--dim); border-radius: 9px; padding: 7px 12px; font-weight: 700; font-size: 13px; }
.autobtn.on { background: var(--good); color: var(--night); border-color: var(--good); }
.autobtn[disabled] { opacity: .7; }
.b-enemies .unit { cursor: pointer; }
.unit.focused { box-shadow: 0 0 0 3px var(--gold); }
.unit.focused::before { content: "🎯"; position: absolute; top: -12px; left: 50%; transform: translateX(-50%); font-size: 18px; }
.unit.elite { border-color: var(--r-e); }
.unit.elite .un { color: var(--r-e); }
.unit.charging { animation: chargewarn .5s ease-in-out infinite; border-color: var(--hp); }
@keyframes chargewarn { 50% { box-shadow: 0 0 0 4px var(--hp), 0 0 24px var(--hp); } }
.techflash::after { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 50% 80%, color-mix(in srgb, var(--good) 35%, transparent), transparent 70%); animation: ult .6s ease-out forwards; pointer-events: none; z-index: 4; }
.legend { display: flex; justify-content: center; gap: 12px; font-size: 11px; color: var(--dim); flex-wrap: wrap; }
.legend i { display: inline-block; width: 10px; height: 6px; border-radius: 3px; margin-right: 4px; vertical-align: 1px; }

/* Ergebnis */
.result-head { text-align: center; display: flex; flex-direction: column; gap: 6px; }
.result-head h2 { font-size: 30px; }
.result-head.win h2 { color: var(--gold); } .result-head.lose h2 { color: var(--hp); }
.gains { display: flex; gap: 16px; justify-content: center; font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; flex-wrap: wrap; }
.gains .x { color: var(--xp); }
.lvup { text-align: center; background: color-mix(in srgb, var(--gold) 14%, var(--deck)); border: 1px solid var(--gold); border-radius: 14px; padding: 12px; animation: pop .5s ease; }
.lvup b { font-family: var(--f-display); font-size: 21px; color: var(--gold); display: block; }
.lvup span { font-size: 14px; color: var(--moon); display: block; margin-top: 3px; }
.cg { display: grid; grid-template-columns: 30px minmax(0,1fr) auto; align-items: center; gap: 4px 10px; font-size: 14px; }
.cg .ge { font-size: 24px; grid-row: span 2; text-align: center; }
.cg .gn { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cg .gl { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; }
.cg .gl.up { color: var(--good); }
.cg .bar { grid-column: 2 / 4; height: 6px; }
.drop { text-align: center; border: 2px solid var(--rc); border-radius: 16px; padding: 12px; animation: pop .5s ease; }
.drop .de { font-size: 46px; }
.drop .dn { font-family: var(--f-display); font-weight: 700; font-size: 18px; }
.drop .dm { font-size: 13px; color: var(--dim); }
.autoline { text-align: center; font-size: 14px; color: var(--good); }

#toasts { position: fixed; z-index: 80; left: 0; right: 0; top: calc(env(safe-area-inset-top, 0px) + 10px); display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; padding: 0 16px; }
.toast { background: var(--moon); color: var(--night); font-weight: 700; font-size: 15px; padding: 10px 16px; border-radius: 12px; box-shadow: 0 6px 20px rgba(0,0,0,.4); animation: tin .3s ease, tout .3s ease 2.4s forwards; max-width: 420px; text-align: center; }
@keyframes tin { from { transform: translateY(-20px); opacity: 0; } }
@keyframes tout { to { transform: translateY(-20px); opacity: 0; } }

/* ---------- Trophäen, Arenen, Deck ---------- */
.trw::before { content: "🏆"; margin-right: 3px; }
.trbig { font-family: var(--f-display); font-weight: 700; font-size: 24px; color: var(--gold); white-space: nowrap; font-variant-numeric: tabular-nums; }
.trbig::before { content: "🏆 "; font-size: 20px; }
.nextfight .daily { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 6px; background: var(--good); color: var(--night); margin-left: 6px; vertical-align: 2px; }
.deckrow { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 8px; }
.dchip { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; padding: 6px 4px 7px; border-radius: 12px; border: 2px solid var(--rc); background: color-mix(in srgb, var(--night) 55%, transparent); color: var(--moon); }
.dchip .de { font-size: 28px; line-height: 1.15; }
.dchip .dn { font-size: 11px; font-weight: 700; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dchip .dl { font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums; }
.dchip .bar, .slot .bar { width: 82%; height: 5px; margin-top: 2px; }
.lineup.five .slot .sn { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 11px; }
.flag.bo { background: var(--good); color: var(--night); }
.bolist { display: flex; flex-direction: column; gap: 4px; }
.borow { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; padding: 7px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--deck); color: var(--moon); font-size: 13.5px; }
.borow.big { border-color: color-mix(in srgb, var(--gold) 55%, var(--line)); }
.borow.new { border-color: var(--good); }
.borow .bl { font-family: var(--f-display); font-weight: 700; font-size: 12px; color: var(--dim); width: 44px; flex: none; }
.borow .bi { width: 20px; text-align: center; flex: none; }
.borow .bx { flex: 1; min-width: 0; }
.borow .bc { font-size: 11px; font-weight: 700; color: var(--dim); }
.borow.new .bc { color: var(--good); }
.boopts { display: flex; flex-direction: column; gap: 8px; }
.boopt { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 14px; border-radius: 14px; border: 2px solid var(--line); background: var(--deck-2); color: var(--moon); font-size: 15px; font-weight: 600; }
.boopt .bi { font-size: 24px; flex: none; }
.boopt .bx { flex: 1; }
.boopt.on { border-color: var(--gold); background: color-mix(in srgb, var(--gold) 16%, var(--deck-2)); }
.slot.indeck { box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--gold) 55%, transparent); }
.flag.rk { background: var(--good); color: var(--night); }
.swapgrid { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 8px; }
.msrow { display: flex; flex-wrap: wrap; gap: 4px; }
.msrow span { font-size: 11.5px; padding: 3px 7px; border-radius: 7px; background: var(--deck); color: var(--dim); }
.msrow span.on { color: var(--good); background: color-mix(in srgb, var(--good) 15%, var(--deck)); }
.arenas { display: flex; flex-direction: column; gap: 8px; }
.arow { position: relative; overflow: hidden; display: flex; gap: 12px; padding: 12px; border-radius: 16px; border: 1px solid var(--line); background: var(--deck); }
.arow::before { content: ""; position: absolute; inset: 0; background: var(--zbg); opacity: .35; pointer-events: none; }
.arow > * { position: relative; }
.arow.now { border: 2px solid var(--gold); }
.arow.locked { opacity: .6; }
.arow.done .arn b { color: var(--good); }
.arn { width: 52px; flex: none; text-align: center; display: flex; flex-direction: column; }

.arn small { font-size: 11px; color: var(--dim); white-space: nowrap; }

.art { font-family: var(--f-display); font-weight: 700; font-size: 17px; }

.arc { font-size: 28px; line-height: 1; flex: none; }
.arw { min-width: 0; }
.arw b { display: block; font-size: 14px; }
.arw small { display: block; font-size: 12px; color: var(--dim); }

/* ---------- Kampf: Gegner, Planung ---------- */
.foeside { display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap: 6px; width: 100%; }
.b-enemies .unit { width: auto; padding: 6px 3px; }

.unit.foehero .uen { height: 5px; }
.unit.mine { cursor: pointer; }
.usp { font-size: 10px; font-weight: 700; line-height: 1.2; padding: 2px 3px; border-radius: 6px; background: var(--deck-2); color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.usp:empty { display: none; }
.unit.spready { border-color: var(--gold); }
.unit.spready .usp { background: color-mix(in srgb, var(--gold) 25%, var(--deck-2)); color: var(--gold); }
.unit.spsel { border: 2px solid var(--gold); background: color-mix(in srgb, var(--gold) 18%, var(--deck)); box-shadow: 0 0 12px color-mix(in srgb, var(--gold) 45%, transparent); }

.gostart { flex: 1; padding: 12px 10px; }
.float.sp { color: var(--gold); font-size: 17px; }
.float.foesp { color: var(--hp); font-size: 17px; }

/* ---------- Ergebnis ---------- */

.trline.plus { color: var(--gold); } .trline.minus { color: var(--hp); }

<script>
"use strict";
/* =========================================================
   GRUNDWERTE
   ========================================================= */
const G = 1.07;                 // Wachstum der Kampfwerte pro Level

const MAX_ROUNDS = 30;

const TROPHY = 30, ARENA_STEP = 300, DECK_SIZE = 4;
const EN_START = 4, EN_ROUND = 3, EN_MAX = 10;   // Sternenenergie für Sonderattacken
const HP_MUL = 1.5;             // Leben im Kampf, damit Kämpfe mehrere Runden dauern
const hpLv = L => HP_MUL * (.75 + Math.min(L, 200) / 40);   // mit dem Level etwas mehr, sonst werden späte Kämpfe zu kurz
const STORM = 8;                // ab dieser Runde zieht ein Sternensturm auf: jeder Treffer wird stärker, damit Kämpfe nicht ewig dauern
const heroNeed = L => Math.round(12 * Math.pow(1.1, L - 1) * (3 + .35 * Math.min(L, 60) + .1 * Math.max(0, L - 60)));
const cardNeed = L => Math.round(20 * Math.pow(1.1, L - 1) * (1 + .25 * Math.min(L, 60) + .08 * Math.max(0, L - 60)));
const ptsFor = L => 3 + Math.floor(L / 15);   // Sternenpunkte beim Erreichen von Level L
const rankCost = r => 2 + Math.floor(r / 2);   // Sternenpunkte für den nächsten Rang einer Karte
const RANK_BONUS = .06;
const pct = v => Math.round(v * 100) + " %";
// Große Zahlen lesbar machen
function fmt(n) {
  n = Math.round(n);
  if (Math.abs(n) < 100000) return n.toLocaleString("de-DE");
  if (Math.abs(n) >= 1e18) return n.toExponential(1).replace(".", ",");
  for (const [v, u] of [[1e15, "Brd."], [1e12, "Bio."], [1e9, "Mrd."], [1e6, "Mio."], [1e3, "Tsd."]])
    if (Math.abs(n) >= v) return (n / v).toLocaleString("de-DE", { maximumFractionDigits:1 }) + " " + u;
  return String(n);
}
function roman(n) {
  const R = [[10,"X"],[9,"IX"],[5,"V"],[4,"IV"],[1,"I"]]; let o = "";
  for (const [v, r] of R) while (n >= v) { o += r; n -= v; }
  return o;
}

const STAGE_MUL = [1, 1.3, 1.7];
const ROLES = {

// Fähigkeiten: v = Wert je Entwicklungsform
const AB = {
  taunt:     { n:"Spott",          v:[.15,.25,.35], d:v => `Lockt die Gegner an und nimmt ${pct(v)} weniger Schaden.` },
  shieldTeam:{ n:"Schutzfeld",     v:[.2,.32,.45],  d:v => `Zu Kampfbeginn bekommt das ganze Team einen Schild von ${pct(v)} seiner Lebenspunkte.` },
  heal:      { n:"Reparatur",      v:[1.6,2.2,3],   d:v => `Heilt das schwächste Teammitglied, sobald jemand verletzt ist (${pct(v)} des Angriffs).` },
  aoe:       { n:"Kettenblitz",    v:[.9,1.2,1.6],  d:v => `Jede 3. Runde trifft sie alle Gegner gleichzeitig (${pct(v)} des Angriffs).` },

  burn:      { n:"Plasmabrand",    v:[.35,.5,.7],   d:v => `Setzt zu Kampfbeginn alle Gegner 4 Runden lang in Brand (${pct(v)} des Angriffs pro Runde).` },
  luck:      { n:"Goldnase",       v:[.15,.25,.4],  d:v => `Nach jedem Sieg ${pct(v)} mehr Münzen.` },
  wisdom:    { n:"Weisheit",       v:[.1,.16,.25],  d:v => `Nach jedem Kampf ${pct(v)} mehr EP für Held und Team.` },
  martyr:    { n:"Explosion",      v:[2,3,4.5],     d:v => `Explodiert beim Fallen und trifft alle Gegner (${pct(v)} des Angriffs).` },

  berserk:   { n:"Raserei",        v:[.8,1.2,1.7],  d:v => `Je weniger Leben sie hat, desto härter schlägt sie zu (bis zu ${pct(v)} mehr Schaden).` },
  drain:     { n:"Kraftraub",      v:[.05,.07,.1],  d:v => `Jeder Treffer schwächt das Ziel: Es macht ${pct(v)} weniger Schaden (stapelbar).` },

  laststand: { n:"Letztes Gefecht",v:[.5,.7,.9],    d:v => `Fällt er unter 30 % Leben, bekommt er einmal einen Schild von ${pct(v)} seiner Lebenspunkte.` },

// Die 16 Karten. ar = Arena, in der sie freigeschaltet wird (0 = von Anfang an dabei).
// sp = Sonderattacke: e = Sternenenergie, cd = Abklingzeit in Runden, v = Grundwert, x = Zusatzeffekt ab Kartenlevel 15
const COMP = [
  { id:"kiesel",  ar:0,  r:"c", m:1,    role:"tank",     ab:"taunt",     f:[["Kieselgolem","🪨"],["Felsgolem","🗿"],["Monolith","🏛️"]],
    sp:{ n:"Felswall",        k:"shield", e:3, cd:3, v:.22, x:"heal" } },
  { id:"funkel",  ar:0,  r:"c", m:1,    role:"schuetze", ab:"crit",      f:[["Funkelkäfer","🐞"],["Leuchtkäfer","🪲"],["Sternkäfer","🌟"]],

  { id:"sani",    ar:0,  r:"c", m:1,    role:"heiler",   ab:"heal",      f:[["Sanibot","🤖"],["Medibot","🩺"],["Lebensbaum","🌳"]],

  { id:"krabbe",  ar:0,  r:"c", m:1,    role:"tank",     ab:"thorns",    f:[["Kraterkrabbe","🦀"],["Panzerkrebs","🦞"],["Muschelfestung","🐚"]],

  { id:"fuchs",   ar:1,  r:"c", m:1,    role:"krieger",  ab:"dodge",     f:[["Kometenfuchs","🦊"],["Sternenwolf","🐺"],["Polarlichtfuchs","🌠"]],

    sp:{ n:"Sporenwolke",     k:"burn",   e:3, cd:3, v:.7,  x:"shred" } },
  { id:"fleder",  ar:4,  r:"r", m:1.08, role:"krieger",  ab:"lifesteal", f:[["Mondfledermaus","🦇"],["Nachtjäger","🧛"],["Blutmond","🌑"]],

  { id:"eule",    ar:8,  r:"e", m:1.1,  role:"support",  ab:"mark",      f:[["Sterneneule","🦉"],["Sternwarte","🔭"],["Planetenhüter","🪐"]],
    sp:{ n:"Sternendeutung",  k:"snipe",  e:3, cd:2, v:2.8, x:"shred" } },
  { id:"ninja",   ar:9,  r:"e", m:1.12, role:"schuetze", ab:"double",    f:[["Kurierninja","🥷"],["Schattenklinge","🗡️"],["Phantom","👤"]],
    sp:{ n:"Schattenwirbel",  k:"multi",  e:4, cd:2, v:1.2, x:"stun" } },
  { id:"phoenix", ar:10, r:"l", m:1.14, role:"heiler",   ab:"revive",    f:[["Glutküken","🐤"],["Feuervogel","🦅"],["Phönix","🔥"]],
    sp:{ n:"Flammenruf",      k:"revive", e:5, cd:4, v:.5,  x:"heal" } },

const RAR_N = { c:"Gewöhnlich", r:"Selten", e:"Episch", l:"Legendär" };
const CC = Object.fromEntries(COMP.map(c => [c.id, c]));

// Sonderattacken: was sie tun (v ist schon mit dem Kartenlevel verrechnet)
const SPK = {
  strike: v => `Trifft das Ziel mit ${pct(v)} Angriff.`,
  aoe:    v => `Trifft alle Gegner mit ${pct(v)} Angriff.`,

const spPow = L => (1 + .01 * Math.min(L - 1, 150)) * (L >= 5 ? 1.25 : 1) * (L >= 25 ? 1.25 : 1) * (1 + .2 * [35, 45, 60, 80, 100].filter(x => L >= x).length);
const spCost = (id, L) => Math.max(1, CC[id].sp.e - (L >= 10 ? 1 : 0));
const spCd = (id, L) => Math.max(1, CC[id].sp.cd - (L >= 20 ? 1 : 0));
const spVal = (id, L) => CC[id].sp.v * spPow(L);
const spDesc = (id, L) => SPK[CC[id].sp.k](spVal(id, L)) + (L >= 15 ? ` Außerdem ${SPX[CC[id].sp.x]}.` : "");

// Normale Level bieten Steigerungen, jedes 5. Level einen besonderen Effekt. Ohne Wahl gilt die erste Möglichkeit.

  { k:"hp",    v:.03, i:"❤️", t:v => `+${pct(v)} Leben` },
  { k:"atk",   v:.03, i:"⚔️", t:v => `+${pct(v)} Angriff` },
  { k:"sp",    v:.04, i:"✦",  t:v => `+${pct(v)} Sonderattacke` },
  { k:"crit",  v:.02, i:"🎯", t:v => `+${pct(v)} Krit-Chance` },

const TREE = [], TN = {};
(function buildTree() {
  const root = { id:"root", root:true, x:0, y:PADY, parents:[], icon:"🧑‍🚀", n:"Mondkurier" };
  TREE.push(root); TN.root = root;
  TREE_DEF.forEach((br, bi) => {
    const laneX = l => PADX + (bi * 3 + l) * CW + bi * BGAP + CW / 2;
    const lastInLane = [null, null, null];
    br.rows.forEach((row, ri) => {
      const r = ri + 1, prevMid = ri === 0 ? "root" : `${br.k}${ri}m`;
      row.forEach(([lane, icon, n, key, v, flag]) => {
        const id = `${br.k}${r}${"lmr"[lane]}`;
        const parents = lane === 1 ? [prevMid] : [prevMid].concat(lastInLane[lane] ? [lastInLane[lane]] : []);
        const node = { id, b:br.k, bc:br.c, lane, row:r, icon, n, key, v, flag:!!flag, cost:1 + Math.floor(r / 3) + (flag ? 2 : 0),
          parents, x:laneX(lane), y:PADY + 40 + r * RH };
        TREE.push(node); TN[id] = node; lastInLane[lane] = id;
      });
    });
    br.x = laneX(1);
  });
  const W = PADX * 2 + 12 * CW + 3 * BGAP;
  root.x = W / 2;
  TREE.W = W; TREE.H = PADY + 40 + 15 * RH;
})();

    const fc = ctl[u.side].focus;
    if (fc) { const f = fs.find(x => x.uid === fc); if (f) return f; }
    if (u.ab && u.ab.k === "snipe") return fs.reduce((m, f) => f.hp < m.hp ? f : m);
    const tz = fs.filter(f => f.ab && f.ab.k === "taunt");
    if (tz.length && Math.random() < .75) return rnd(tz);
    return rnd(fs);
  }
  const gainEn = (u, v) => { if (!u.alive) return; const b = u.en; u.en = Math.min(100, u.en + v * u.charge); if (Math.round(u.en) !== Math.round(b)) ev.push({ t:"en", u:u.uid, v:Math.round(u.en) }); };
  const aoeAll = (u, mult, name) => { ev.push({ t:"skill", a:u.uid, msg:name }); foes(u).forEach(f => hit(u, f, mult, true)); };
  const lowest = u => mates(u).reduce((m, f) => f.hp / f.max < m.hp / m.max ? f : m);

  // Normaler Zug einer Karte: Grundangriff plus ihre feste Fähigkeit
  function act(u) {
    const k = u.ab && u.ab.k, v = u.ab && u.ab.v;
    if (k === "timebomb" && round === 4) return aoeAll(u, v, AB.timebomb.n);
    if (k === "aoe" && round % 3 === 0) return aoeAll(u, v, AB.aoe.n);
    if (k === "dragon" && round % 3 === 0) { aoeAll(u, v, AB.dragon.n); foes(u).forEach(f => f.dots.push({ d:u.atk * .4 * dotMul(u), r:3, src:u })); return; }
    if (k === "divine") { ev.push({ t:"skill", a:u.uid, msg:AB.divine.n, quiet:1 }); mates(u).forEach(f => heal(f, u.atk * v, u)); return; }
    if (k === "heal") { const lo = lowest(u); if (lo.hp / lo.max < .75) { ev.push({ t:"skill", a:u.uid, msg:AB.heal.n, quiet:1 }); heal(lo, u.atk * v, u); return; } }
    if (k === "barrier" && round % 2 === 0) { ev.push({ t:"skill", a:u.uid, msg:AB.barrier.n, quiet:1 }); addShield(lowest(u), u.atk * v, u); return; }
    let mult = 1 + (k === "snipe" ? v : 0);
    if (k === "charge") { u.cnt++; if (u.cnt % 3 === 0) { mult *= v; ev.push({ t:"skill", a:u.uid, msg:AB.charge.n, quiet:1 }); } }
    hit(u, target(u), mult);
    if (k === "rage") u.rage += v;
    if (k === "double" && u.alive && Math.random() < v) hit(u, target(u), 1);
    if (isP(u) && T.multi && u.alive && Math.random() < T.multi) hit(u, target(u), 1);
  }
  // Sonderattacke einer Karte (Energie wurde beim Planen bezahlt)
  function special(u) {
    const s = u.sp, v = s.v, tg = target(u), wide = ["aoe", "nuke", "burn", "multi"].includes(s.k);
    u.spCd = s.cd; u.st.sp++;
    ev.push({ t:"special", a:u.uid, msg:s.n, side:u.side });
    switch (s.k) {
      case "strike": hit(u, tg, v, false, true); break;
      case "stun": hit(u, tg, v, false, true); stunIt(tg); break;
      case "drain": heal(u, hit(u, tg, v, false, true) * .5, u); break;
      case "snipe": { const fs = foes(u); if (fs.length) { const t = fs.reduce((m, f) => f.hp / f.max < m.hp / m.max ? f : m); hit(u, t, v * (t.hp / t.max < .35 ? 2 : 1), false, true); } break; }
      case "multi": for (let i = 0; i < 3; i++) { const fs = foes(u); if (!fs.length) break; hit(u, rnd(fs), v, true); } break;
      case "aoe": foes(u).forEach(f => hit(u, f, v, true)); break;
      case "nuke": foes(u).forEach(f => { f.shield = 0; hit(u, f, v, true); }); break;
      case "burn": foes(u).forEach(f => { f.dots.push({ d:u.atk * v * dotMul(u), r:3, src:u }); ev.push({ t:"tag", u:f.uid, txt:"🔥 Brand", cls:"dot" }); }); break;
      case "heal": mates(u).forEach(f => heal(f, f.max * v, u)); break;
      case "shield": mates(u).forEach(f => addShield(f, f.max * v, u)); break;
      case "rally": mates(u).forEach(f => { f.buff = Math.max(f.buff, v); f.buffR = 2; ev.push({ t:"tag", u:f.uid, txt:`⚔️ +${pct(v)}`, cls:"heal" }); }); break;
      case "revive": {
        const dead = (isP(u) ? P : E).find(x => !x.alive && !x.hero);
        if (dead) { dead.alive = true; dead.hp = dead.max * v; dead.dots = []; u.st.sup += dead.hp; ev.push({ t:"revive", ...snap(dead), msg:`${u.n} holt ${dead.n} zurück!` }); }
        else { const lo = lowest(u); heal(lo, lo.max * v, u); }
        break;
      }
    }
    const live = foes(u), tgs = wide ? live : [tg].filter(x => x && x.alive);
    if (s.x === "stun" && live.length) stunIt(tg && tg.alive ? tg : rnd(live));
    if (s.x === "shred") tgs.forEach(f => { f.shred += .15; ev.push({ t:"tag", u:f.uid, txt:"verwundbar", cls:"info" }); });
    if (s.x === "burn") tgs.forEach(f => f.dots.push({ d:u.atk * .4 * dotMul(u), r:3, src:u }));
    if (s.x === "heal") mates(u).forEach(f => heal(f, f.max * .1, u));
    if (s.x === "shield") mates(u).forEach(f => addShield(f, f.max * .1, u));
  }
  // Held: eine Aktion pro Runde
  const techReady = (side, k) => { const h = heroOf(side); return !!h && h.alive && TK[k].lv <= h.lv && (k === "ult" ? h.en >= 100 : !(ctl[side].cd[k] > 0)); };
  function heroAct(h) {
    const c = ctl[h.side], k = (c.plan && c.plan.hero) || "atk";
    if (k === "ult" && h.en >= 100) {
      const U = h.ult; h.en = 0;
      ev.push({ t:"ult", a:h.uid, msg:U.n, side:h.side }); ev.push({ t:"en", u:h.uid, v:0 });
      foes(h).forEach(f => hit(h, f, U.mult * h.ultMul, true));
      if (U.burn) foes(h).forEach(f => f.dots.push({ d:h.atk * U.burn * dotMul(h), r:3, src:h }));
      if (U.heal) mates(h).forEach(f => heal(f, f.max * U.heal, h));
      return;
    }
    if (["wall", "heal", "stop"].includes(k) && techReady(h.side, k)) {
      c.cd[k] = TK[k].cd + 1;
      ev.push({ t:"tech", k, msg:TK[k].n, a:h.uid, side:h.side });
      if (k === "wall") mates(h).forEach(f => addShield(f, f.max * .25, h));
      if (k === "heal") mates(h).forEach(f => heal(f, f.max * .25, h));
      if (k === "stop") foes(h).forEach(stunIt);
      gainEn(h, 25);
      return;
    }
    gainEn(h, 25);
    if (h.habs.includes("hNova") && round % 6 === 0) return aoeAll(h, 3, "Supernova");
    if (isP(h) && T.fall && round % 3 === 0) return aoeAll(h, 1, "Sternenfall");
    if (h.habs.includes("hStun") && round % 5 === 0) { ev.push({ t:"skill", a:h.uid, msg:"Gravitationswelle" }); foes(h).forEach(stunIt); }
    hit(h, target(h), 1.2);
  }
  // Computer plant eine Runde (auch für den Spieler, wenn Auto an ist)
  function aiPlan(side) {
    const c = ctl[side], h = heroOf(side), team = (side === "p" ? P : E).filter(x => x.alive), fl = (side === "p" ? E : P).filter(x => x.alive);
    const avg = team.reduce((a, u) => a + u.hp / u.max, 0) / team.length, low = team.some(u => u.hp / u.max < .35);
    const dead = (side === "p" ? P : E).some(x => !x.alive && !x.hero);
    const pl = { hero:"atk", sp:[] };
    if (techReady(side, "ult")) pl.hero = "ult";
    else if ((avg < .55 || low) && techReady(side, "heal")) pl.hero = "heal";
    else if (avg < .65 && techReady(side, "wall")) pl.hero = "wall";
    else if (techReady(side, "stop") && fl.filter(f => f.sp && f.spCd <= 0).length >= 2 && Math.random() < .5) pl.hero = "stop";
    if (h && h.alive && h.lv >= TK.focus.lv && fl.length) c.focus = fl.reduce((m, f) => f.hp / f.max < m.hp / m.max ? f : m).uid;
    let en = c.en;
    team.filter(u => !u.hero && u.sp && u.spCd <= 0).map(u => {
      const k = u.sp.k;
      const w = k === "revive" ? (dead ? 3 : (1 - avg) * 3) : k === "heal" ? (1 - avg) * 4 : k === "shield" ? (1 - avg) * 3 + .4 : k === "rally" ? 1.2 : 1 + (["aoe", "nuke", "burn", "multi"].includes(k) ? fl.length * .3 : .4);
      return { u, w:w + Math.random() * .5 };
    }).sort((a, b) => b.w - a.w).forEach(x => { if (x.w > .7 && x.u.sp.cost <= en) { en -= x.u.sp.cost; pl.sp.push(x.u.uid); } });
    return pl;
  }
  function applyPlan(side) {
    const c = ctl[side], pl = c.plan || { hero:"atk", sp:[] }, ok = [];
    if (pl.hero !== "atk" && !techReady(side, pl.hero)) pl.hero = "atk";
    (pl.sp || []).forEach(uid => { const u = byUid[uid]; if (u && u.side === side && u.alive && u.sp && u.spCd <= 0 && u.sp.cost <= c.en && !ok.includes(uid)) { c.en -= u.sp.cost; ok.push(uid); } });
    pl.sp = ok; c.plan = pl;
    ev.push({ t:"energy", side, v:c.en });
  }

  // Kampfbeginn
  for (const u of all) {
    const k = u.ab && u.ab.k;
    if (k === "shieldTeam") mates(u).forEach(f => addShield(f, f.max * u.ab.v, u));
    if (k === "burn") foes(u).forEach(f => f.dots.push({ d:u.atk * u.ab.v * dotMul(u), r:4, src:u }));
    if (u.hero && u.habs.includes("hShield")) mates(u).forEach(f => addShield(f, u.max * .12));
    if (u.fx.shield) addShield(u, u.max * u.fx.shield, u);
    if (u.fx.energy) ctl[u.side].en = Math.min(EN_MAX, ctl[u.side].en + u.fx.energy);
  }
  if (T.shield) P.forEach(f => addShield(f, f.max * T.shield));
  yield flush();

  while (round < MAX_ROUNDS && !over()) {
    round++;
    ["p", "e"].forEach(sd => { const c = ctl[sd]; if (round > 1) c.en = Math.min(EN_MAX, c.en + EN_ROUND); Object.keys(c.cd).forEach(k => c.cd[k] = Math.max(0, c.cd[k] - 1)); c.plan = null; });
    all.forEach(u => { u.spCd = Math.max(0, u.spCd - 1); });
    ev.push({ t:"round", n:round }); ev.push({ t:"energy", side:"p", v:ctl.p.en });
    if (round === STORM + 1) ev.push({ t:"banner", msg:"🌠 Sternensturm! Ab jetzt wird jeder Treffer stärker." });
    ctl.e.plan = aiPlan("e");
    if (ctl.p.ai) ctl.p.plan = aiPlan("p");
    else { ev.push({ t:"plan", n:round }); yield flush(); if (!ctl.p.plan && ctl.p.ai) ctl.p.plan = aiPlan("p"); }   // hier wartet das Spiel, bis der Spieler die Runde startet
    applyPlan("p"); applyPlan("e");
    yield flush();
    const order = all.filter(u => u.alive).sort((a, b) => b.spd - a.spd || Math.random() - .5);
    for (const u of order) {
      if (!u.alive || over()) { yield flush(); continue; }
      if (u.stun > 0) { u.stun--; ev.push({ t:"frozen", u:u.uid }); yield flush(); continue; }
      ev.push({ t:"act", u:u.uid });
      if (u.hero) heroAct(u);
      else if (ctl[u.side].plan.sp.includes(u.uid)) special(u);
      else act(u);
      yield flush();
    }
    if (over()) break;
    for (const u of all) {
      if (!u.alive) continue;
      if (u.dots.length) {
        let d = 0;
        u.dots.forEach(x => { const v = Math.max(1, Math.round(x.d)); d += v; if (x.src) x.src.st.dmg += v; x.r--; if (x.src) u.last = x.src; });
        u.hp -= d; u.dots = u.dots.filter(x => x.r > 0);
        ev.push({ t:"dot", ...snap(u), v:d }); kill(u);
      }
      if (!u.alive) continue;
      if (u.hero && u.habs.includes("hRegen")) heal(u, u.max * .04);
      if (u.fx.regen) heal(u, u.max * u.fx.regen, u);
      if (isP(u) && T.regen) heal(u, u.max * T.regen);
      if (u.buffR > 0 && --u.buffR === 0) u.buff = 0;
      u.st.alive++;
    }
    if (over()) break;
  }
  yield flush();
  // Nach 30 Runden gewinnt, wer anteilig mehr Leben übrig hat
  const left = U => U.reduce((a, u) => a + Math.max(0, u.hp), 0) / U.reduce((a, u) => a + u.max, 0);
  const timeout = !over(), win = timeout ? left(P) > left(E) : !E.some(x => x.alive);
  return { win, rounds:round, timeout };
}

function addHeroXP(n) {
  const out = { lv:[], abs:[], pts:0 };
  if (S.lv >= MAX_LV) return out;
  S.xp += n;
  while (S.lv < MAX_LV && S.xp >= heroNeed(S.lv)) {
    S.xp -= heroNeed(S.lv); S.lv++; out.lv.push(S.lv);
    const p = ptsFor(S.lv) + (S.lv % 5 === 0 ? treeFx().ptsLv : 0);
    S.sp += p; out.pts += p;
    HERO_AB.filter(a => a.lv === S.lv).forEach(a => out.abs.push(a.n));
    TECH.filter(t => t.lv === S.lv && t.lv > 1).forEach(t => out.abs.push(`Technik ${t.i} ${t.n}`));
    ULTS.filter(u => u.lv === S.lv && u.lv > 1).forEach(u => out.abs.push("Ultimative " + u.n));
  }
  if (S.lv >= MAX_LV) S.xp = 0;
  return out;
}
function addCardXP(id, n) {
  const c = S.cards[id], out = { from:c.lv, up:0, forms:[], ms:[] };
  c.xp += n;
  while (c.lv < MAX_LV && c.xp >= cardNeed(c.lv)) {
    c.xp -= cardNeed(c.lv); c.lv++; out.up++;
    if (FORM_LV.includes(c.lv)) out.forms.push(c.lv);
    SP_MS.filter(m => m.lv === c.lv).forEach(m => out.ms.push(m.lv === 15 ? `Zusatzeffekt: ${SPX[CC[id].sp.x]}` : m.t));
  }
  return out;
}
// Karten-EP nach Leistung: Schaden, Heilung und Schilde, eingesteckter Schaden, Überleben, Sonderattacken, erledigte Gegner
const XP_PART = { dmg:"Schaden", sup:"Heilung/Schild", tank:"Eingesteckt", live:"Überlebt", sp:"Sonderattacken", kills:"Erledigt" };
function cardXpSplit(units, rounds) {
  const cs = units.filter(u => u.side === "p" && !u.hero), N = cs.length;
  const sum = k => cs.reduce((a, u) => a + u.st[k], 0);
  const share = (u, k) => { const t = sum(k); return t > 0 ? u.st[k] / t * N : 0; };
  return cs.map(u => {
    const parts = { dmg:.45 * share(u, "dmg"), sup:.25 * share(u, "sup"), tank:.15 * share(u, "tank"),
      live:.2 * u.st.alive / Math.max(1, rounds), sp:Math.min(.5, .12 * u.st.sp), kills:.1 * u.st.kills };
    return { id:u.cid, perf:.25 + Object.values(parts).reduce((a, b) => a + b, 0), parts };
  });
}
const newCardLv = () => Math.max(1, Math.floor(avgDeckLv() * .75));
function grantRewards(win, M) {
  const T = treeFx(), rl = S.lv;
  const daily = win && dailyFree("arena"); if (daily) useDaily("arena");
  const before = S.tr, floor = S.arMax * ARENA_STEP;   // kein Abstieg unter die höchste erreichte Arena
  S.tr = Math.max(floor, S.tr + (win ? TROPHY : -TROPHY)); S.trBest = Math.max(S.trBest || 0, S.tr);
  // verdeckte Gegnerstärke: nach Siegen etwas stärker, nach Niederlagen deutlich schwächer (pendelt sich bei rund 70 % Siegen ein)
  S.mm = Math.min(3, Math.max(.3, S.mm * (win ? 1.03 : .93)));
  if (win) { S.stats.wins++; S.stats.streak = Math.max(0, S.stats.streak || 0) + 1; } else { S.stats.losses++; S.stats.streak = 0; }
  let hb = 12 * Math.pow(1.1, rl - 1) * (win ? 1 : .35 * (1 + T.lossXp)) * (daily ? 2 : 1);
  const hx = Math.round(hb * (1 + T.xp));
  const co = win ? Math.round(9 * Math.pow(1.09, rl - 1) * (daily ? 2 : 1) * (1 + T.coins)) : 0;
  S.co += co;
  // EP richten sich nach dem eigenen Kartenlevel. Karten weit unter dem Deckschnitt holen schneller auf,
  // Karten weit darüber werden gebremst, damit nicht eine Karte allein davonzieht.
  const dl = avgDeckLv(), mul = (win ? 1 : .4) * (daily ? 2 : 1) * (1 + T.bossXp);
  const cards = cardXpSplit(M.units, M.rounds).map(x => {
    const own = cardLv(x.id), cl = Math.max(own, Math.round(dl * .8)), damp = Math.pow(.8, Math.max(0, own - dl - 3) / 3);
    const n = Math.max(1, Math.round(cardNeed(cl) * (.06 + .3 / cl) * mul * x.perf * damp));
    return { ...x, n, ...addCardXP(x.id, n) };
  });
  const newAr = [];
  while (arenaIdx(S.tr) > S.arMax) {
    S.arMax++;
    const A = arenaAt(S.arMax), rw = arenaReward(S.arMax);
    let aco = Math.round(rw.co * (1 + T.firstCo)), card = null;
    if (A.card && !S.cards[A.card.id]) { card = A.card.id; const nl = newCardLv(); S.cards[card] = { lv:nl, xp:0, seen:nl, bo:{} }; S.unseen = true; } else aco *= 2;
    S.co += aco; S.sp += rw.sp; newAr.push({ i:S.arMax, co:aco, sp:rw.sp, card });
  }
  const hero = addHeroXP(hx);

  return { win, dTr:S.tr - before, hx, co, hero, cards, newAr, daily, timeout:M.timeout, rounds:M.rounds };
}

function heroSVG(L, eq, size = 120, anim = true) {

    st.obs.forEach(o => {

      else if (o.k === "drone") { ctx.globalAlpha = o.hit ? .3 : 1; ctx.fillText("🛸", o.x + o.w / 2, o.y); ctx.globalAlpha = 1; }

/* ---------- Sternen-Memory ---------- */
function startMemory() {
  const m = MM.memory; miniShell(m, '<div class="memgrid" id="memGrid"></div>');
  const comp = COMP.map(c => form(c.id)[1]), extra = ["🌙", "🪐", "🚀", "🌍", "👽", "☄️"];
  const START = 45, st = { t:START, board:0, score:0, pairs:0, combo:0, moves:0, open:[], lock:false, deck:[], left:0 };
  MG = { k:"memory" };
  const grid = $("#memGrid");
  function deal() {
    st.board++;
    const nPairs = st.board === 1 ? 8 : st.board === 2 ? 10 : 12;
    const pool = comp.concat(extra).sort(() => Math.random() - .5);
    let icons = pool.slice(0, nPairs - (st.board > 1 ? 1 : 0));
    if (st.board > 1) icons.push("⏱️");
    const cards = icons.concat(icons).map(e => ({ e }));
    if (st.board > 1) cards.push({ e:"👁️", eye:true });   // einzelnes Späherauge ohne Partner
    st.deck = cards.sort(() => Math.random() - .5);
    st.left = icons.length;
    const rows = Math.ceil(st.deck.length / 4);
    grid.style.setProperty("--rows", rows); grid.classList.toggle("r6", rows >= 6);
    grid.innerHTML = st.deck.map((c, i) => `<button class="mem" data-mem="${i}" aria-label="Karte ${i + 1}">${c.e}</button>`).join("");
    $("#mgHint").textContent = `Brett ${st.board}: finde ${icons.length} Paare.`;
  }
  const peek = () => {
    st.lock = true;
    grid.querySelectorAll(".mem:not(.done)").forEach(b => b.classList.add("up"));
    MG.to = setTimeout(() => { grid.querySelectorAll(".mem:not(.done)").forEach(b => b.classList.remove("up")); st.open = []; st.lock = false; }, 1300);
  };
  const onClick = e => {
    const b = e.target.closest("[data-mem]"); if (!b || st.lock || b.classList.contains("up") || b.classList.contains("done")) return;
    const card = st.deck[+b.dataset.mem];
    if (card.eye) { b.classList.add("done"); b.classList.add("up"); mgFloat(b.offsetLeft + b.offsetWidth / 2, b.offsetTop, "Späherauge!", "info"); st.open.forEach(x => x.classList.remove("up")); st.open = []; peek(); return; }
    b.classList.add("up"); st.open.push(b);
    if (st.open.length < 2) return;
    st.moves++; const [a, c] = st.open, x = c.offsetLeft + c.offsetWidth / 2, y = c.offsetTop;
    if (st.deck[+a.dataset.mem].e === st.deck[+c.dataset.mem].e) {
      a.classList.add("done"); c.classList.add("done"); st.open = []; st.pairs++; st.left--; st.combo++;
      const pts = 10 * Math.min(10, st.combo); st.score += pts; st.t += 2;
      const isClock = st.deck[+a.dataset.mem].e === "⏱️";
      if (isClock) { st.t += 8; mgFloat(x, y - 22, "+10 s", "info"); } else mgFloat(x, y, `+${pts}  +2 s`, "heal");
      mgSet(st.score, st.t, START);
      if (st.left === 0) { st.t += 15; st.lock = true; mgFloat(grid.clientWidth / 2, grid.clientHeight / 2, `Brett geschafft! +15 s`, "crit"); MG.to = setTimeout(() => { st.lock = false; deal(); }, 900); }
    } else {
      st.lock = true; st.combo = 0; st.t -= 1; a.classList.add("bad"); c.classList.add("bad"); mgFloat(x, y, "−1 s", "dmg");
      MG.to = setTimeout(() => { a.classList.remove("up", "bad"); c.classList.remove("up", "bad"); st.open = []; st.lock = false; }, 650);
    }
  };
  grid.addEventListener("click", onClick);
  MG.cleanup = () => grid.removeEventListener("click", onClick);
  MG.iv = setInterval(() => {
    st.el = (st.el || 0) + .2; st.t -= .2 * (1 + st.el / 120); mgSet(st.score, st.t, START);
    if (st.t <= 0) finishMini("memory", st.score, .3 + st.score * .006, `<b>${st.score} Punkte</b>: ${st.pairs} Paare auf ${st.board} ${st.board === 1 ? "Brett" : "Brettern"}, ${st.moves} Züge.`);

}

function startMeteor() {
  const m = MM.meteor; miniShell(m, '<div class="lives" id="lives"></div><div class="combo" id="combo"></div><div class="pwr" id="pwr"></div><div class="base" id="base">🏠 🛰️ 🌕 📡 🏠</div>');

    const o = { el, k, x, y, v, hp:k === "big" ? 3 : 1, dx:(Math.random() - .5) * 30 };

  }
  function spawn() {
    const e = st.el, r = Math.random() * 100;
    const table = [["met", 58], ["big", e > 10 ? 9 : 0], ["star", 7], ["sat", 12 + Math.min(10, e / 6)], ["heart", st.lives < 5 ? 2 : 0], ["frost", e > 8 ? 3 : 0], ["bomb", e > 8 ? 3 : 0], ["zap", e > 8 ? 3 : 0]];

  }
  function gain(o, pts, secs) {

    mgFloat(o.x, o.y - 24, `+${p}${secs ? `  +${secs} s` : ""}`, pts > 1 ? "crit" : "heal");
  }
  function kill(o) { o.gone = true; o.el.classList.add("pop"); setTimeout(() => o.el.remove(), 260); }
  function tap(o) {

      }
    });

    mgSet(st.score, st.t, START);

      `<b>${st.score} Punkte</b>, ${st.caught} Meteore abgefangen in ${Math.round(st.el)} Sekunden. ${st.lives > 0 ? "Die Zeit ist abgelaufen." : "Die Mondbasis ist gefallen."}`);

  }

      `<b>${st.beaten} ${st.beaten === 1 ? "Koloss" : "Kolosse"}</b> besiegt und den nächsten zu ${Math.round(frac * 100)} % geschafft. ${fmt(st.dmg)} Schaden mit ${st.taps} Schlägen.`);
  }
  MG.iv = setInterval(() => {
    if (!st.started || MG.dead) return;
    st.t -= .25;
    if (Math.round(st.t * 4) % 2 === 0) deal(Math.round(auto * .5 * (st.shield > 0 ? .1 : 1)), area.clientWidth * (.25 + Math.random() * .5), area.clientHeight * .45, "dot");
    if (st.shield > 0) { st.shield -= .25; if (st.shield <= 0) endShield(); }
    else if ((st.nextShield -= .25) <= 0) { startShield(); st.nextShield = 7 + Math.random() * 4; }
    if ((st.nextWeak -= .25) <= 0) { weak(); st.nextWeak = 2 + Math.random() * 2.5; }
    if (st.t <= 0) end();
  }, 250);
  nextBoss(); mgSet(0, START, START);
}

        <button class="btn wide" data-act="codeCopy">Code kopieren</button>
        <textarea id="codeIn" class="codebox" rows="3" placeholder="Code hier einfügen"></textarea>
        <div class="row"><button class="btn ghost" data-act="close">Schließen</button><button class="btn green" data-act="codeLoad">Code laden</button></div>`); break;
    case "codeCopy": {
      const t = $("#codeOut"); t.select();
      (navigator.clipboard?.writeText(t.value) ?? Promise.reject()).then(() => toast("Code kopiert"), () => { document.execCommand("copy"); toast("Code kopiert"); });
      break;
    }
    case "codeLoad": {
      const n = codeToSave($("#codeIn").value || "");
      if (!n) { toast("Der Code passt nicht."); return; }
      S = n; save(); modal(""); render(); toast(`Spielstand geladen: Level ${S.lv}`); break;
    }
    case "resetAsk":
      modal(`<h2>Neu starten?</h2><p>Level, Karten, Baum und Münzen gehen verloren. Das lässt sich nicht rückgängig machen.</p>
        <div class="row"><button class="btn ghost" data-act="close">Abbrechen</button><button class="btn danger" data-act="reset">Alles löschen</button></div>`); break;
    case "reset": S = defSave(); S.seen = true; save(); modal(""); UI.tab = "home"; render(); toast("Neues Spiel gestartet"); break;
  }
}
document.addEventListener("click", ev => { const el = ev.target.closest("[data-act]"); if (el) act(el, ev); });

/* =========================================================
   ALS APP
   ========================================================= */
const IS_APP = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const IS_IOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
function installModal() {
  if (IS_APP) { modal(`<h2>Läuft als App</h2><p>Sternenkarten ist auf deinem Home-Bildschirm installiert und läuft auch ohne Internet.</p><button class="btn" data-act="close">Gut</button>`); return; }
  modal(`<h2>Als App installieren</h2>
    <div class="steps">
      ${IS_IOS ? "" : `<div><i>!</i><p>iPhone und iPad<span>Öffne diese Seite dort in Safari. Auf anderen Geräten nutze im Browser-Menü „App installieren“.</span></p></div>`}
      <div><i>1</i><p>Teilen antippen<span>Das Symbol mit dem Pfeil nach oben, in Safari unten in der Leiste.</span></p></div>
      <div><i>2</i><p>„Zum Home-Bildschirm“<span>Etwas nach unten scrollen, falls du es nicht gleich siehst.</span></p></div>
      <div><i>3</i><p>„Hinzufügen“<span>Danach startest du Sternenkarten über das Icon, im Vollbild und auch offline.</span></p></div>
    </div>
    <p class="muted" style="font-size:14px">Die App hat einen eigenen Spielstand. Nimm deinen bisherigen mit „Spielstand übertragen“ mit.</p>
    <button class="btn" data-act="close">Verstanden</button>`);
}
// Offline-Speicher; schlägt im Artifact-Vorschaurahmen still fehl
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost") && window.top === window) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
  navigator.storage?.persist?.().catch(() => {});
}

/* =========================================================
   START
   ========================================================= */
function start(data) {
  S = (data && data.S && data.S.v === 4) ? data.S : load();
  render();
  if (!S.seen) { S.seen = true; save(); helpModal(); }
  else if (IS_IOS && !IS_APP && window.top === window && !sessionStorageGet("installHint")) { sessionStorageSet("installHint"); installModal(); }
}
function sessionStorageGet(k) { try { return sessionStorage.getItem(k); } catch (e) { return "1"; } }
function sessionStorageSet(k) { try { sessionStorage.setItem(k, "1"); } catch (e) {} }
window.claude?.hot?.snapshot?.(() => ({ S }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
</body>
</html>
