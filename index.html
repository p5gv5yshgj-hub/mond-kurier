<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Mondkurier</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: #0b0e1a;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, "SF Pro Display", "Segoe UI", sans-serif;
    overflow: hidden;
  }
  #wrap {
    position: relative;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    border-radius: 12px;
    overflow: hidden;
  }
  canvas {
    display: block;
    background: #0b0e1a;
  }
  #hud {
    position: absolute;
    top: 0; left: 0; right: 0;
    padding: 14px 20px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: none;
    color: #f4f1de;
    text-shadow: 0 2px 6px rgba(0,0,0,0.6);
  }
  #score {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }
  #timerBox {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
  }
  #timerLabel {
    font-size: 11px;
    opacity: 0.7;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  #timer {
    font-size: 26px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
  }
  #timer.low { color: #ff6b6b; }
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(11,14,26,0.82);
    color: #f4f1de;
    text-align: center;
    padding: 20px;
  }
  #overlay.hidden { display: none; }
  #overlay h1 {
    font-size: 34px;
    margin-bottom: 8px;
    letter-spacing: 0.5px;
  }
  #overlay p {
    font-size: 15px;
    opacity: 0.8;
    margin-bottom: 4px;
    max-width: 360px;
    line-height: 1.5;
  }
  #bigScore {
    font-size: 46px;
    font-weight: 800;
    margin: 14px 0 6px;
    color: #ffd166;
  }
  #best {
    font-size: 13px;
    opacity: 0.65;
    margin-bottom: 20px;
  }
  button {
    background: #ffd166;
    color: #0b0e1a;
    border: none;
    padding: 12px 28px;
    font-size: 16px;
    font-weight: 700;
    border-radius: 999px;
    cursor: pointer;
    transition: transform 0.15s ease;
  }
  button:hover { transform: scale(1.05); }
  button:active { transform: scale(0.97); }
  #hint {
    position: absolute;
    bottom: 12px;
    left: 0; right: 0;
    text-align: center;
    color: #f4f1de;
    opacity: 0.55;
    font-size: 12px;
    letter-spacing: 0.5px;
    pointer-events: none;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="800" height="450"></canvas>
  <div id="hud">
    <div id="score">PAKETE: 0</div>
    <div id="timerBox">
      <div id="timerLabel">Zeit</div>
      <div id="timer">30.0</div>
    </div>
  </div>
  <div id="hint">LEERTASTE / KLICK zum Springen &nbsp;·&nbsp; nochmal drücken für Doppelsprung</div>
  <div id="overlay">
    <h1>🌙 MONDKURIER</h1>
    <p>Spring über die Schornsteine und Lücken der Dächer, bevor der Mond untergeht.
       Jedes zugestellte Paket gibt dir wertvolle Sekunden zurück!</p>
    <div id="bigScore" style="display:none"></div>
    <div id="best"></div>
    <button id="startBtn">Start</button>
  </div>
</div>

<script>
(function(){
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const GROUND_Y = H - 90;

  const scoreEl = document.getElementById('score');
  const timerEl = document.getElementById('timer');
  const overlay = document.getElementById('overlay');
  const startBtn = document.getElementById('startBtn');
  const bigScoreEl = document.getElementById('bigScore');
  const bestEl = document.getElementById('best');
  const overlayTitle = overlay.querySelector('h1');
  const overlayText = overlay.querySelector('p');

  let audioCtx = null;
  function beep(freq, dur, vol, type) {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = type || 'sine';
      o.frequency.value = freq;
      g.gain.value = vol || 0.08;
      o.connect(g); g.connect(audioCtx.destination);
      o.start();
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      o.stop(audioCtx.currentTime + dur);
    } catch(e) {}
  }

  const BEST_KEY = 'mondkurier_best';
  let best = parseInt(localStorage.getItem(BEST_KEY) || '0', 10);

  let state = 'idle'; // idle | playing | over
  let score = 0;
  let timeLeft = 30;
  let speed = 6.2;
  let elapsed = 0;
  let obstacles = [];
  let particles = [];
  let stars = [];
  let spawnTimer = 0;
  let nextSpawnGap = 0;

  const cat = {
    x: 120, y: GROUND_Y, w: 46, h: 46,
    vy: 0, onGround: true, jumps: 0, maxJumps: 2,
    squash: 1, legPhase: 0
  };
  const GRAVITY = 0.62;
  const JUMP_V = -12.2;
  const JUMP_V2 = -10.6;

  for (let i = 0; i < 80; i++) {
    stars.push({
      x: Math.random() * W,
      y: Math.random() * (GROUND_Y - 40),
      r: Math.random() * 1.6 + 0.3,
      tw: Math.random() * Math.PI * 2
    });
  }

  function resetGame() {
    score = 0;
    timeLeft = 30;
    speed = 6.2;
    elapsed = 0;
    obstacles = [];
    particles = [];
    cat.y = GROUND_Y; cat.vy = 0; cat.onGround = true; cat.jumps = 0;
    spawnTimer = 0;
    nextSpawnGap = 60;
    scoreEl.textContent = 'PAKETE: 0';
    timerEl.textContent = '30.0';
    timerEl.classList.remove('low');
  }

  function jump() {
    if (state !== 'playing') return;
    if (cat.jumps < cat.maxJumps) {
      cat.vy = cat.jumps === 0 ? JUMP_V : JUMP_V2;
      cat.onGround = false;
      cat.jumps++;
      cat.squash = 1.35;
      beep(cat.jumps === 1 ? 520 : 700, 0.09, 0.06, 'square');
      for (let i = 0; i < 6; i++) {
        particles.push({
          x: cat.x + cat.w/2, y: cat.y + cat.h,
          vx: (Math.random()-0.5)*3, vy: Math.random()*-1.5,
          life: 20, color: '#ffd166', r: 2 + Math.random()*2
        });
      }
    }
  }

  function makeObstacle() {
    const r = Math.random();
    if (r < 0.55) {
      const h = 34 + Math.random() * 40;
      obstacles.push({ type: 'chimney', x: W + 20, y: GROUND_Y - h, w: 28, h: h, passed: false });
    } else if (r < 0.8) {
      const gap = 70 + Math.random() * 40;
      obstacles.push({ type: 'gap', x: W + 20, w: gap, passed: false });
    } else {
      const h = 30 + Math.random() * 20;
      obstacles.push({ type: 'bird', x: W + 20, y: GROUND_Y - h - 60 - Math.random()*40, w: 34, h: 20, passed: false, bob: Math.random()*Math.PI*2 });
    }
  }

  function collides(a) {
    const cx1 = cat.x + 6, cy1 = cat.y + 6, cx2 = cat.x + cat.w - 6, cy2 = cat.y + cat.h - 4;
    if (a.type === 'chimney') {
      const ax1 = a.x, ay1 = a.y, ax2 = a.x + a.w, ay2 = GROUND_Y + 40;
      return cx1 < ax2 && cx2 > ax1 && cy1 < ay2 && cy2 > ay1;
    }
    if (a.type === 'bird') {
      const ax1 = a.x, ay1 = a.y, ax2 = a.x + a.w, ay2 = a.y + a.h;
      return cx1 < ax2 && cx2 > ax1 && cy1 < ay2 && cy2 > ay1;
    }
    return false;
  }

  function fellInGap(a) {
    if (a.type !== 'gap') return false;
    const catCenter = cat.x + cat.w/2;
    const inSpan = catCenter > a.x && catCenter < a.x + a.w;
    return inSpan && cat.onGround;
  }

  function addTime(sec) {
    timeLeft = Math.min(timeLeft + sec, 45);
  }

  function endGame(reason) {
    state = 'over';
    beep(180, 0.35, 0.09, 'sawtooth');
    if (score > best) {
      best = score;
      localStorage.setItem(BEST_KEY, String(best));
    }
    overlayTitle.textContent = reason === 'time' ? '⏳ ZEIT ABGELAUFEN' : '💥 ABSTURZ!';
    overlayText.textContent = reason === 'time'
      ? 'Der Mond ist untergegangen, bevor du fertig warst.'
      : 'Da war wohl ein Schornstein im Weg...';
    bigScoreEl.style.display = 'block';
    bigScoreEl.textContent = score + ' Pakete';
    bestEl.textContent = 'Bestleistung: ' + best + ' Pakete';
    startBtn.textContent = 'Nochmal';
    overlay.classList.remove('hidden');
  }

  function startGame() {
    resetGame();
    state = 'playing';
    overlay.classList.add('hidden');
  }

  startBtn.addEventListener('click', startGame);
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'ArrowUp') {
      e.preventDefault();
      if (state === 'idle' || state === 'over') startGame();
      else jump();
    }
  });
  canvas.addEventListener('mousedown', () => {
    if (state === 'idle' || state === 'over') startGame();
    else jump();
  });

  function update(dt) {
    if (state !== 'playing') return;
    elapsed += dt;
    speed = 6.2 + Math.min(elapsed / 12, 5.5);
    timeLeft -= dt;
    if (timeLeft <= 0) { timeLeft = 0; timerEl.textContent = '0.0'; endGame('time'); return; }
    timerEl.textContent = timeLeft.toFixed(1);
    timerEl.classList.toggle('low', timeLeft < 8);

    cat.vy += GRAVITY;
    cat.y += cat.vy;
    if (cat.y >= GROUND_Y) {
      cat.y = GROUND_Y;
      if (!cat.onGround) {
        cat.squash = 0.75;
      }
      cat.vy = 0;
      cat.onGround = true;
      cat.jumps = 0;
    }
    cat.squash += (1 - cat.squash) * 0.2;
    if (cat.onGround) cat.legPhase += 0.35 * (speed/6.2);

    spawnTimer += dt * 60;
    if (spawnTimer > nextSpawnGap) {
      makeObstacle();
      spawnTimer = 0;
      nextSpawnGap = 55 - Math.min(elapsed, 25) + Math.random() * 35;
    }

    for (let i = obstacles.length - 1; i >= 0; i--) {
      const o = obstacles[i];
      o.x -= speed;
      if (o.type === 'bird') o.y += Math.sin((elapsed*3 + o.bob)) * 0.4;

      if (!o.passed && o.x + (o.w||0) < cat.x) {
        o.passed = true;
        score += 1;
        addTime(1.4);
        scoreEl.textContent = 'PAKETE: ' + score;
        beep(880, 0.08, 0.05, 'triangle');
        for (let k = 0; k < 10; k++) {
          particles.push({
            x: cat.x + cat.w/2, y: cat.y + 10,
            vx: (Math.random()-0.5)*4, vy: (Math.random()-1)*3,
            life: 26, color: '#8ecae6', r: 2 + Math.random()*2
          });
        }
      }

      if (o.type !== 'gap' && collides(o)) { endGame('crash'); return; }
      if (fellInGap(o)) { endGame('crash'); return; }

      const cutoff = o.type === 'gap' ? -(o.w + 40) : -60;
      if (o.x < cutoff) obstacles.splice(i, 1);
    }

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.life--;
      if (p.life <= 0) particles.splice(i, 1);
    }
  }

  function drawSkyline() {
    ctx.fillStyle = '#131a2e';
    const buildings = 9;
    for (let i = 0; i < buildings; i++) {
      const bw = W / buildings + 10;
      const bh = 60 + ((i * 37) % 90);
      const bx = i * (W / buildings) - 20 - ((elapsed*8) % (W/buildings));
      ctx.fillRect(bx, GROUND_Y - bh + 40, bw, bh);
    }
  }

  function drawMoon() {
    ctx.save();
    ctx.fillStyle = '#f4f1de';
    ctx.shadowColor = 'rgba(244,241,222,0.5)';
    ctx.shadowBlur = 30;
    ctx.beginPath();
    ctx.arc(W - 90, 70, 34, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
    ctx.fillStyle = '#0b0e1a';
    ctx.globalAlpha = 0.9;
    ctx.beginPath();
    ctx.arc(W - 78, 60, 30, 0, Math.PI*2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  function drawStars() {
    for (const s of stars) {
      const a = 0.4 + 0.6 * Math.abs(Math.sin(elapsed*1.5 + s.tw));
      ctx.fillStyle = 'rgba(244,241,222,' + a.toFixed(2) + ')';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
      ctx.fill();
    }
  }

  function drawRoof() {
    ctx.fillStyle = '#1c2340';
    ctx.fillRect(0, GROUND_Y + 46, W, H - GROUND_Y - 46);
    ctx.fillStyle = '#232b52';
    ctx.fillRect(0, GROUND_Y + 46, W, 6);
    for (const o of obstacles) {
      if (o.type === 'gap') {
        ctx.clearRect(o.x, GROUND_Y + 46, o.w, H - GROUND_Y - 46);
        ctx.fillStyle = '#0b0e1a';
        ctx.fillRect(o.x, GROUND_Y + 46, o.w, H - GROUND_Y - 46);
      }
    }
  }

  function drawObstacles() {
    for (const o of obstacles) {
      if (o.type === 'chimney') {
        ctx.fillStyle = '#3d2b56';
        ctx.fillRect(o.x, o.y, o.w, o.h + 50);
        ctx.fillStyle = '#5a3f7a';
        ctx.fillRect(o.x - 4, o.y, o.w + 8, 10);
        ctx.fillStyle = 'rgba(255,209,102,0.25)';
        ctx.fillRect(o.x + 6, o.y + 16, 6, 6);
      } else if (o.type === 'bird') {
        ctx.strokeStyle = '#f4f1de';
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
        const flap = Math.sin(elapsed*12) * 6;
        ctx.beginPath();
        ctx.moveTo(o.x, o.y + 10);
        ctx.quadraticCurveTo(o.x + 12, o.y + 10 - flap, o.x + 24, o.y + 10);
        ctx.moveTo(o.x + 24, o.y + 10);
        ctx.quadraticCurveTo(o.x + 12, o.y + 10 - flap, o.x, o.y + 10);
        ctx.stroke();
      }
    }
  }

  function drawParticles() {
    for (const p of particles) {
      ctx.globalAlpha = Math.max(p.life / 26, 0);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawCat() {
    ctx.save();
    const cx = cat.x + cat.w/2;
    const cy = cat.y + cat.h;
    ctx.translate(cx, cy);
    ctx.scale(1, cat.squash);
    ctx.translate(-cat.w/2, -cat.h);

    ctx.fillStyle = '#ffb703';
    ctx.beginPath();
    ctx.ellipse(cat.w/2, cat.h*0.55, cat.w*0.42, cat.h*0.42, 0, 0, Math.PI*2);
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(cat.w*0.15, cat.h*0.25);
    ctx.lineTo(cat.w*0.05, cat.h*0.02);
    ctx.lineTo(cat.w*0.32, cat.h*0.18);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(cat.w*0.85, cat.h*0.25);
    ctx.lineTo(cat.w*0.95, cat.h*0.02);
    ctx.lineTo(cat.w*0.68, cat.h*0.18);
    ctx.closePath();
    ctx.fill();

    if (cat.onGround) {
      const swing = Math.sin(cat.legPhase) * 8;
      ctx.strokeStyle = '#ffb703';
      ctx.lineWidth = 7;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(cat.w*0.32, cat.h*0.85);
      ctx.lineTo(cat.w*0.32 + swing, cat.h*1.05);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(cat.w*0.68, cat.h*0.85);
      ctx.lineTo(cat.w*0.68 - swing, cat.h*1.05);
      ctx.stroke();
    } else {
      ctx.strokeStyle = '#ffb703';
      ctx.lineWidth = 7;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(cat.w*0.32, cat.h*0.85);
      ctx.lineTo(cat.w*0.22, cat.h*1.02);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(cat.w*0.68, cat.h*0.85);
      ctx.lineTo(cat.w*0.78, cat.h*1.02);
      ctx.stroke();
    }

    ctx.fillStyle = '#0b0e1a';
    ctx.beginPath();
    ctx.arc(cat.w*0.36, cat.h*0.45, 3, 0, Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(cat.w*0.6, cat.h*0.45, 3, 0, Math.PI*2);
    ctx.fill();

    ctx.fillStyle = '#e63946';
    ctx.beginPath();
    ctx.moveTo(-4, cat.h*0.6);
    ctx.quadraticCurveTo(-16, cat.h*0.4 - Math.sin(elapsed*4)*4, -8, cat.h*0.2);
    ctx.quadraticCurveTo(-2, cat.h*0.4, 4, cat.h*0.62);
    ctx.fill();

    ctx.restore();
  }

  function render() {
    ctx.clearRect(0, 0, W, H);
    const grad = ctx.createLinearGradient(0, 0, 0, GROUND_Y + 60);
    grad.addColorStop(0, '#0b0e1a');
    grad.addColorStop(1, '#1a2340');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    drawStars();
    drawMoon();
    drawSkyline();
    drawRoof();
    drawObstacles();
    drawParticles();
    drawCat();
  }

  let last = performance.now();
  function loop(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    update(dt);
    render();
    requestAnimationFrame(loop);
  }

  bestEl.textContent = best > 0 ? ('Bestleistung: ' + best + ' Pakete') : '';
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
