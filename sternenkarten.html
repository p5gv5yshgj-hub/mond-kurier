<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Sternenkarten</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-sized column — status bar, scrolling screen, tab bar; the auto-battle takes over the whole column. */
:root {
  --night: #0c0f22;      /* deep lunar night, page ground */
  --deck: #161a35;       /* raised panels */
  --deck-2: #20254a;     /* chips, empty bars */
  --line: #2f3566;       /* hairlines */
  --moon: #ece8d9;       /* moon-silver text */
  --dim: #9a9cba;        /* secondary text */
  --gold: #f2c14e;       /* lunar gold accent */
  --gold-ink: #1b1606;
  --hp: #ff5d6c;
  --shield: #6ecbff;
  --venom: #7bd88f;
  --xp: #8f7bff;
  --t-a: #ff7a59;  /* Talentzweig Angriff */
  --t-d: #59b8ff;  /* Talentzweig Abwehr */
  --t-k: #f2c14e;  /* Talentzweig Kurier */
  --r-c: #9aa3b8; --r-r: #4fb3ff; --r-e: #b77bff; --r-l: #ffb347;
  --f-display: "Chakra Petch", "Trebuchet MS", system-ui, sans-serif;
  --f-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--night); color: var(--moon);
  font-family: var(--f-body); font-size: 15px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  overflow: hidden; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none;
}
body::after {
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: .5;
  background-image:
    radial-gradient(1px 1px at 12% 18%, var(--moon) 50%, transparent 51%),
    radial-gradient(1px 1px at 72% 9%, var(--moon) 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 41% 63%, var(--dim) 50%, transparent 51%),
    radial-gradient(1px 1px at 88% 47%, var(--moon) 50%, transparent 51%),
    radial-gradient(1px 1px at 23% 86%, var(--dim) 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 63% 92%, var(--moon) 50%, transparent 51%),
    radial-gradient(1px 1px at 5% 52%, var(--moon) 50%, transparent 51%),
    radial-gradient(1px 1px at 95% 75%, var(--dim) 50%, transparent 51%);
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, [data-act]:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; letter-spacing: .02em; }
.num { font-variant-numeric: tabular-nums; }

#app { position: relative; z-index: 1; max-width: 520px; height: 100%; margin: 0 auto; display: flex; flex-direction: column; }

/* ---------- Statusleiste ---------- */
#top { display: flex; align-items: center; gap: 10px; padding-block: 10px 8px; }
.lvl-badge { font-family: var(--f-display); font-weight: 700; font-size: 13px; background: var(--gold); color: var(--gold-ink); padding: 3px 8px; border-radius: 6px; white-space: nowrap; }
.xpwrap { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.bar { height: 7px; background: var(--deck-2); border-radius: 4px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--xp); border-radius: 4px; transition: width .5s ease; }
.bar.full i { background: var(--gold); }
.xptext { font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums; }
.res { display: flex; gap: 10px; font-weight: 700; font-variant-numeric: tabular-nums; font-size: 14px; }
.coin::before { content: ""; display: inline-block; width: .8em; height: .8em; border-radius: 50%; background: var(--gold); box-shadow: inset -2px -2px 0 rgba(0,0,0,.25); margin-right: 4px; vertical-align: -1px; }
.dust { color: var(--shield); }
.dust::before { content: "✧"; margin-right: 3px; }
.tp { color: var(--venom); }

#main { flex: 1; overflow-y: auto; overflow-x: hidden; padding-block: 4px 20px; -webkit-overflow-scrolling: touch; }
.screen-title { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin: 6px 0 12px; flex-wrap: wrap; }
.screen-title h2 { font-size: 22px; }
.screen-title small { color: var(--dim); font-size: 13px; }
.section-label { font-family: var(--f-display); text-transform: uppercase; letter-spacing: .12em; font-size: 11px; color: var(--dim); margin: 18px 0 8px; }

#nav { display: grid; grid-template-columns: repeat(5, 1fr); border-top: 1px solid var(--line); padding-block: 6px; }
#nav button { background: none; border: 0; padding: 4px 0; display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--dim); font-size: 11px; font-weight: 600; }
#nav button svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
#nav button.on { color: var(--gold); }
#nav .dot { position: relative; }
#nav .dot::after { content: ""; position: absolute; top: -1px; right: -4px; width: 7px; height: 7px; border-radius: 50%; background: var(--venom); }

.btn { border: 0; border-radius: 10px; padding: 11px 16px; font-weight: 700; background: var(--gold); color: var(--gold-ink); font-family: var(--f-display); letter-spacing: .03em; transition: transform .12s ease, opacity .2s; }
.btn:active { transform: scale(.96); }
.btn.ghost { background: var(--deck-2); color: var(--moon); }
.btn.green { background: var(--venom); color: var(--night); }
.btn.danger { background: var(--hp); color: var(--night); }
.btn[disabled] { opacity: .4; pointer-events: none; }
.btn.sm { padding: 7px 11px; font-size: 13px; border-radius: 8px; }
.panel { background: var(--deck); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { background: var(--deck-2); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; color: var(--dim); }
.chip.on { background: var(--moon); color: var(--night); border-color: var(--moon); }
.chip.lock { opacity: .45; }
.r-c { --rc: var(--r-c); } .r-r { --rc: var(--r-r); } .r-e { --rc: var(--r-e); } .r-l { --rc: var(--r-l); }
.stars { color: var(--gold); letter-spacing: 1px; font-size: 12px; }
.stars s { color: var(--line); text-decoration: none; }

/* ---------- Heldenkarte ---------- */
.herocard {
  position: relative; border-radius: 20px; padding: 16px; overflow: hidden;
  background: linear-gradient(160deg, var(--deck-2), var(--deck) 55%);
  border: 2px solid var(--hc, var(--r-c));
  box-shadow: 0 0 28px color-mix(in srgb, var(--hc, var(--r-c)) 25%, transparent);
}
.herocard::before { content: ""; position: absolute; width: 220px; height: 220px; right: -70px; top: -80px; border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, var(--moon), #b9b39e 55%, #6f6a5b); opacity: .12; }
.hc-head { position: relative; display: flex; gap: 14px; align-items: center; }
.hc-portrait { width: 76px; height: 76px; border-radius: 50%; flex: none; display: grid; place-items: center; font-size: 42px;
  background: radial-gradient(circle at 35% 30%, var(--moon), #b9b39e 55%, #6f6a5b); box-shadow: 0 0 0 3px var(--hc, var(--r-c)); }
.hc-title { font-size: 12px; text-transform: uppercase; letter-spacing: .14em; color: var(--hc, var(--dim)); font-weight: 700; }
.hc-name { font-family: var(--f-display); font-size: 22px; font-weight: 700; }
.hc-lv { font-family: var(--f-display); font-size: 15px; color: var(--dim); }
.hc-xp { position: relative; margin-top: 14px; }
.hc-xp .bar { height: 10px; }
.hc-xp .xptext { margin-top: 4px; display: flex; justify-content: space-between; }
.statrow { position: relative; display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 8px; margin-top: 14px; }
.statrow div { background: color-mix(in srgb, var(--night) 60%, transparent); border-radius: 10px; padding: 8px 4px; text-align: center; }
.statrow b { display: block; font-family: var(--f-display); font-size: 18px; font-variant-numeric: tabular-nums; }
.statrow span { font-size: 10.5px; color: var(--dim); text-transform: uppercase; letter-spacing: .08em; }
.ablist { display: flex; flex-direction: column; gap: 8px; }
.abrow { display: flex; gap: 12px; align-items: flex-start; padding: 10px 12px; background: var(--deck); border: 1px solid var(--line); border-radius: 12px; }
.abrow .lvtag { font-family: var(--f-display); font-weight: 700; font-size: 12px; min-width: 46px; text-align: center; padding: 3px 0; border-radius: 6px; background: var(--gold); color: var(--gold-ink); }
.abrow.locked { opacity: .55; }
.abrow.locked .lvtag { background: var(--deck-2); color: var(--dim); }
.abrow .an { font-weight: 700; }
.abrow .ad { font-size: 13px; color: var(--dim); line-height: 1.35; }
.milestone { margin-top: 10px; font-size: 13px; color: var(--dim); }
.milestone b { color: var(--moon); }

/* ---------- Team ---------- */
.slots { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; }
.slot { min-height: 92px; border-radius: 12px; border: 1px dashed var(--line); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-align: center; padding: 6px; font-size: 12px; color: var(--dim); background: none; }
.slot.full { border: 2px solid var(--rc); background: var(--deck); color: var(--moon); }
.slot .se { font-size: 30px; line-height: 1.1; }
.slot .sn { font-weight: 700; font-size: 12px; line-height: 1.15; }
.slot .sl { font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums; }
.slot.locked { opacity: .5; }
.powerline { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; font-size: 13px; color: var(--dim); }
.powerline b { color: var(--moon); font-family: var(--f-display); font-size: 16px; }
.clist { display: flex; flex-direction: column; gap: 8px; }
.crow { display: flex; gap: 12px; align-items: center; padding: 10px 12px; background: var(--deck); border: 1px solid var(--line); border-left: 4px solid var(--rc); border-radius: 12px; text-align: left; width: 100%; }
.crow.inteam { background: color-mix(in srgb, var(--deck-2) 70%, var(--deck)); }
.crow .ce { font-size: 32px; width: 42px; text-align: center; flex: none; }
.crow .ci { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.crow .cn { font-weight: 700; display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
.crow .cm { font-size: 12px; color: var(--dim); }
.crow .ctag { font-size: 10px; font-weight: 700; color: var(--venom); text-transform: uppercase; letter-spacing: .08em; }
.crow .clv { font-family: var(--f-display); font-weight: 700; font-size: 15px; text-align: right; white-space: nowrap; }
.crow .ready { color: var(--gold); font-size: 10px; display: block; text-transform: uppercase; letter-spacing: .06em; }
.crow.unknown .ce { filter: grayscale(1) brightness(.4); }
.crow.unknown .cn { color: var(--dim); }

/* ---------- Modal ---------- */
.modal-bg { position: fixed; inset: 0; z-index: 50; background: color-mix(in srgb, var(--night) 84%, transparent); display: flex; align-items: center; justify-content: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); animation: fade .2s ease; }
.modal { width: 100%; max-width: 420px; max-height: 100%; overflow-y: auto; background: var(--deck); border: 1px solid var(--line); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.modal h2 { font-size: 21px; }
.modal p { margin: 0; color: var(--dim); line-height: 1.45; }
.modal .row { display: flex; gap: 8px; flex-wrap: wrap; }
.modal .row .btn { flex: 1; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.bigc { border: 2px solid var(--rc); border-radius: 16px; padding: 14px; text-align: center; background: linear-gradient(170deg, var(--deck-2), var(--deck) 70%); display: flex; flex-direction: column; gap: 6px; }
.bigc .be { font-size: 60px; line-height: 1.1; }
.bigc .bn { font-family: var(--f-display); font-size: 20px; font-weight: 700; }
.bigc .bm { font-size: 12px; color: var(--rc); font-weight: 700; text-transform: uppercase; letter-spacing: .1em; }
.bigc .statrow { margin-top: 4px; grid-template-columns: repeat(3, minmax(0,1fr)); }
.abbox { background: var(--deck-2); border-radius: 12px; padding: 10px 12px; text-align: left; font-size: 13px; line-height: 1.4; }
.abbox b { color: var(--moon); }
.abbox .nx { color: var(--venom); }
.evo { display: flex; justify-content: center; align-items: center; gap: 8px; font-size: 26px; }
.evo span { opacity: .35; } .evo span.on { opacity: 1; }
.evo i { font-style: normal; font-size: 14px; color: var(--dim); }

/* ---------- Kampf-Auswahl ---------- */
.zonehead { position: relative; border-radius: 16px; padding: 14px; overflow: hidden; border: 1px solid var(--line); background: var(--deck); margin-top: 10px; }
.zonehead::before { content: ""; position: absolute; inset: 0; background: var(--zbg); opacity: .6; }
.zonehead > * { position: relative; }
.zonehead h3 { font-size: 20px; }
.zonehead p { margin: 4px 0 0; color: var(--dim); font-size: 13px; }
.stages { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
.stage { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--deck); border: 1px solid var(--line); border-radius: 12px; text-align: left; width: 100%; }
.stage .sn { font-family: var(--f-display); font-weight: 700; width: 30px; text-align: center; font-size: 17px; flex: none; }
.stage .si { flex: 1; min-width: 0; }
.stage .sfoes { font-size: 20px; letter-spacing: 2px; }
.stage .sm { font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; }
.stage .ss { font-size: 12px; font-weight: 700; text-align: right; white-space: nowrap; }
.stage.boss { border-color: var(--r-l); }
.stage.cleared .ss { color: var(--venom); }
.stage.locked { opacity: .4; }
.stage.next { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold) inset; }
.odds { display: inline-block; padding: 2px 7px; border-radius: 999px; font-size: 11px; font-weight: 700; margin-top: 3px; }
.odds.easy { background: color-mix(in srgb, var(--venom) 22%, transparent); color: var(--venom); }
.odds.even { background: color-mix(in srgb, var(--gold) 22%, transparent); color: var(--gold); }
.odds.hard { background: color-mix(in srgb, var(--hp) 22%, transparent); color: var(--hp); }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; background: var(--deck); border: 1px solid var(--line); border-radius: 12px; width: 100%; text-align: left; }
.toggle .tt { font-weight: 700; } .toggle .td { font-size: 12px; color: var(--dim); }
.sw { width: 44px; height: 26px; border-radius: 999px; background: var(--deck-2); position: relative; flex: none; transition: background .2s; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--dim); transition: transform .2s, background .2s; }
.sw.on { background: color-mix(in srgb, var(--venom) 45%, var(--deck-2)); }
.sw.on::after { transform: translateX(18px); background: var(--venom); }

/* ---------- Talente ---------- */
.tree { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; }
.branch { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.branch h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .1em; color: var(--bc); text-align: center; padding-bottom: 4px; border-bottom: 2px solid var(--bc); }
.branch .bp { font-size: 11px; color: var(--dim); text-align: center; font-variant-numeric: tabular-nums; }
.tier-lbl { font-size: 10px; color: var(--dim); text-align: center; text-transform: uppercase; letter-spacing: .08em; margin-top: 4px; }
.tnode { border: 1px solid var(--line); background: var(--deck); border-radius: 10px; padding: 8px 6px; text-align: center; display: flex; flex-direction: column; gap: 3px; min-height: 62px; justify-content: center; }
.tnode .tn { font-size: 12px; font-weight: 700; line-height: 1.15; overflow-wrap: anywhere; }
.tnode .tr { font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums; }
.tnode.some { border-color: var(--bc); }
.tnode.max { background: color-mix(in srgb, var(--bc) 18%, var(--deck)); border-color: var(--bc); }
.tnode.max .tr { color: var(--bc); }
.tnode.locked { opacity: .4; }
.tnode.cap { border-width: 2px; border-style: dashed; }
.tnode.can { box-shadow: 0 0 0 1px var(--venom); }

/* ---------- Shop ---------- */
.offer { display: flex; align-items: center; gap: 14px; }
.offer + .offer { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
.packart { width: 60px; height: 80px; border-radius: 10px; flex: none; display: grid; place-items: center; font-size: 22px; color: var(--moon); border: 2px solid var(--moon); background: linear-gradient(150deg, var(--r-e), var(--r-r) 60%, var(--night)); }
.packart.big { background: linear-gradient(150deg, var(--r-l), var(--r-e) 55%, var(--night)); }
.packart.dustart { background: linear-gradient(150deg, var(--shield), var(--deck-2) 70%); }
.offer .oi { flex: 1; min-width: 0; }
.offer h3 { font-size: 16px; }
.offer p { margin: 2px 0 8px; color: var(--dim); font-size: 13px; line-height: 1.35; }

/* ---------- Kampf ---------- */
#battle { position: fixed; inset: 0; z-index: 20; background: var(--night); display: flex; justify-content: center;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }
#battle::before { content: ""; position: absolute; inset: 0; background: var(--zbg); opacity: .45; pointer-events: none; }
.bwrap { position: relative; width: 100%; max-width: 520px; height: 100%; display: flex; flex-direction: column; }
.b-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-block: 10px 4px; }
.b-top .bz { font-family: var(--f-display); text-transform: uppercase; letter-spacing: .1em; font-size: 12px; color: var(--dim); }
.b-top .round { font-family: var(--f-display); font-weight: 700; font-size: 15px; }
.speeds { display: flex; gap: 4px; }
.speeds button { background: var(--deck-2); border: 1px solid var(--line); border-radius: 8px; padding: 5px 9px; font-weight: 700; font-size: 12px; color: var(--dim); }
.speeds button.on { background: var(--moon); color: var(--night); }
.side { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.b-enemies { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
.b-mid { text-align: center; font-size: 13px; color: var(--dim); min-height: 22px; padding-block: 6px; }
.b-team { padding-bottom: 12px; }
.b-team .side { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); }
.unit { position: relative; border-radius: 12px; background: var(--deck); border: 1px solid var(--line); padding: 6px 5px 7px; text-align: center; display: flex; flex-direction: column; gap: 3px; transition: transform .15s ease, opacity .3s, filter .3s; min-width: 0; }
.b-enemies .unit { width: 100px; padding: 8px 6px; }
.unit .ue { font-size: 30px; line-height: 1.15; }
.b-enemies .unit .ue { font-size: 46px; }
.b-enemies .unit.boss { width: 132px; border-color: var(--r-l); }
.b-enemies .unit.boss .ue { font-size: 64px; }
.unit.hero { border: 2px solid var(--gold); }
.unit .un { font-size: 10.5px; font-weight: 600; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.unit .uhp { height: 6px; background: var(--deck-2); border-radius: 3px; overflow: hidden; position: relative; }
.unit .uhp i { display: block; height: 100%; background: var(--hp); transition: width .25s ease; }
.unit .ush { position: absolute; left: 0; top: 0; bottom: 0; background: color-mix(in srgb, var(--shield) 75%, transparent); transition: width .25s; width: 0; }
.unit .uv { font-size: 10px; color: var(--dim); font-variant-numeric: tabular-nums; }
.unit .ust { position: absolute; top: 2px; right: 4px; font-size: 11px; }
.unit.act { transform: translateY(-6px) scale(1.06); border-color: var(--moon); }
.b-enemies .unit.act { transform: translateY(6px) scale(1.06); }
.unit.hurt { animation: shake .3s; }
.unit.dead { opacity: .25; filter: grayscale(1); }
.unit.revive { animation: pop .5s; }
@keyframes shake { 0%,100% { translate: 0; } 25% { translate: -6px 0; } 50% { translate: 5px 0; } 75% { translate: -3px 0; } }
@keyframes pop { 0% { transform: scale(.6); } 70% { transform: scale(1.15); } }
#fx { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.float { position: absolute; font-family: var(--f-display); font-weight: 700; font-size: 18px; text-shadow: 0 2px 5px rgba(0,0,0,.85); animation: floatup .9s ease-out forwards; transform: translateX(-50%); white-space: nowrap; }
.float.dmg { color: var(--moon); } .float.crit { color: var(--gold); font-size: 24px; } .float.heal { color: var(--venom); } .float.sh { color: var(--shield); } .float.miss { color: var(--dim); font-size: 14px; } .float.dot { color: var(--venom); font-size: 15px; } .float.info { color: var(--gold); font-size: 14px; }
@keyframes floatup { from { opacity: 1; margin-top: 0; } to { opacity: 0; margin-top: -46px; } }
.banner { position: absolute; left: 50%; top: 42%; transform: translate(-50%,-50%); font-family: var(--f-display); font-weight: 700; font-size: 18px; color: var(--gold); text-shadow: 0 2px 10px rgba(0,0,0,.9); animation: bannerin 1.1s ease forwards; white-space: nowrap; pointer-events: none; }
@keyframes bannerin { 0% { opacity: 0; scale: .7; } 20% { opacity: 1; scale: 1.05; } 80% { opacity: 1; } 100% { opacity: 0; } }

/* Ergebnis */
.result-head { text-align: center; display: flex; flex-direction: column; gap: 6px; }
.result-head h2 { font-size: 28px; }
.result-head.win h2 { color: var(--gold); } .result-head.lose h2 { color: var(--hp); }
.gains { display: flex; gap: 14px; justify-content: center; font-weight: 700; font-size: 16px; font-variant-numeric: tabular-nums; flex-wrap: wrap; }
.gains .x { color: var(--xp); }
.lvup { text-align: center; background: color-mix(in srgb, var(--gold) 14%, var(--deck)); border: 1px solid var(--gold); border-radius: 12px; padding: 10px; animation: pop .5s ease; }
.lvup b { font-family: var(--f-display); font-size: 19px; color: var(--gold); display: block; }
.lvup span { font-size: 13px; color: var(--moon); display: block; margin-top: 2px; }
.cgain { display: flex; flex-direction: column; gap: 6px; }
.cg { display: flex; align-items: center; gap: 10px; font-size: 13px; }
.cg .ge { font-size: 22px; width: 28px; text-align: center; }
.cg .gb { flex: 1; min-width: 0; }
.cg .gl { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.cg .gl.up { color: var(--venom); }
.drop { text-align: center; border: 2px solid var(--rc); border-radius: 14px; padding: 12px; animation: pop .5s ease; }
.drop .de { font-size: 46px; }
.drop .dn { font-family: var(--f-display); font-weight: 700; font-size: 17px; }
.drop .dm { font-size: 12px; color: var(--dim); }
.autoline { text-align: center; font-size: 13px; color: var(--venom); }

#toasts { position: fixed; z-index: 80; left: 0; right: 0; top: calc(env(safe-area-inset-top, 0px) + 10px); display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; padding: 0 16px; }
.toast { background: var(--moon); color: var(--night); font-weight: 700; font-size: 14px; padding: 9px 14px; border-radius: 12px; box-shadow: 0 6px 20px rgba(0,0,0,.4); animation: tin .3s ease, tout .3s ease 2.4s forwards; max-width: 420px; text-align: center; }
@keyframes tin { from { transform: translateY(-20px); opacity: 0; } }
@keyframes tout { to { transform: translateY(-20px); opacity: 0; } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; transition-duration: .01ms !important; }
}
@media (max-width: 360px) {
  .b-enemies .unit { width: 86px; }
  .tree { gap: 5px; }
  .tnode .tn { font-size: 11px; }
}

const rnd = a => a[Math.floor(Math.random() * a.length)];
const $ = s => document.querySelector(s);
function talentFx(st = S) {
  const t = id => st.tal[id] || 0;
  return {
    atk:t("a1")*.04, crit:t("a2")*.03, critDmg:t("a3")*.15, first:t("a4")*.1, heroAtk:t("a5")*.08, boss:t("a6")*.06, fall:t("a7"),
    hp:t("d1")*.05, shield:t("d2")*.04, regen:t("d3")*.015, dodge:t("d4")*.02, heroDr:t("d5")*.05, thorns:t("d6")*.05, unb:t("d7"),
    xp:t("k1")*.06 + t("k7")*.25, cardXp:t("k2")*.08 + t("k7")*.25, coins:t("k3")*.1, dust:t("k4")*.1, drop:t("k5")*.02, mentor:t("k6")*.1
  };
}
const heroHas = (k, L = S.lv) => HERO_AB.some(a => a.k === k && a.lv <= L);
function heroStats(st = S) {
  const L = st.lv, T = talentFx(st), m = Math.pow(G, L - 1), hc = heroHas("hCrit", L);
  return { hp:Math.round(150 * m * (1 + T.hp)), atk:Math.round(13 * m * (1 + T.heroAtk)), spd:5,
    crit:.05 + T.crit + (hc ? .25 : 0), critDmg:(hc ? 2.5 : 2) + T.critDmg };
}
function cardStats(id, l, stg) {
  const c = CC[id], R = ROLES[c.role], m = RAR[c.r].m * STAGE_MUL[stg] * Math.pow(G, l - 1);
  return { hp:Math.round(R.hp * m), atk:Math.round(R.atk * m), spd:R.spd };
}
const cardCap = (c, st = S) => Math.min(st.lv, STAGE_CAP[c.st]);
const form = (id, stg) => CC[id].f[stg];
const evoCost = (id, toStage) => Math.round(EVO_COST[toStage] * RAR[CC[id].r].cost);
const packPrice = () => Math.round(100 * Math.pow(1.08, S.lv - 1));
const dustOffer = () => Math.round(60 * Math.pow(1.09, S.lv - 1));
const resetPrice = () => Math.round(200 * Math.pow(1.06, S.lv - 1));
const unitPower = u => Math.sqrt(u.max * u.atk) * (1 + (u.ab ? .15 : 0));

let UID = 1;
function mkUnit(o) {
  return Object.assign({ uid:UID++, shield:0, dots:[], stun:0, rage:0, shred:0, alive:true, dr:0, dodge:0, crit:.05, critDmg:2, thorns:0, habs:[] }, o);
}
function buildTeam(st = S) {
  const T = talentFx(st), h = heroStats(st), L = st.lv;
  const P = [mkUnit({ side:"p", hero:true, n:"Mondkurier", e:"🧑‍🚀", hp:h.hp, max:h.hp, atk:h.atk, spd:h.spd, crit:h.crit, critDmg:h.critDmg,
    dodge:T.dodge, dr:T.heroDr, thorns:T.thorns, habs:HERO_AB.filter(a => a.k && a.lv <= L).map(a => a.k) })];
  st.team.slice(0, slotsAt(L)).forEach(id => {
    const c = st.cards[id]; if (!c) return;
    const s = cardStats(id, c.l, c.st), def = CC[id], ab = { k:def.ab, v:AB[def.ab].v[c.st] }, f = form(id, c.st);
    const hp = Math.round(s.hp * (1 + T.hp));
    P.push(mkUnit({ side:"p", cid:id, n:f[0], e:f[1], hp, max:hp, atk:s.atk, spd:s.spd, ab,
      crit:.05 + T.crit + (ab.k === "crit" ? ab.v : 0), critDmg:2 + T.critDmg,
      dodge:T.dodge + (ab.k === "dodge" ? ab.v : 0), dr:ab.k === "taunt" ? ab.v : 0, thorns:T.thorns + (ab.k === "thorns" ? ab.v : 0) }));
  });
  const aura = T.atk + (heroHas("hAura", L) ? .15 : 0) + P.reduce((a, u) => a + (u.ab && u.ab.k === "aura" ? u.ab.v : 0), 0);
  P.forEach(u => u.atk = Math.round(u.atk * (1 + aura)));
  return P;
}
function waveIds(s) {
  const Z = ZONES[zoneOf(s)], st = stageNo(s);
  if (st === 10) return [Z.en[0], Z.boss, Z.en[3]];
  return Array.from({ length:WAVE[st - 1] }, (_, i) => Z.en[(st + i * 2) % 4]);
}
function makeWave(s) {
  const Z = ZONES[zoneOf(s)], E = recLv(s), m = Math.pow(G, E - 1) * EK[s - 1];
  const W = waveIds(s).map(d => {
    const R = ROLES[d[2]], boss = d === Z.boss, ab = d[3] ? { k:d[3], v:AB[d[3]].v[d[4]] } : null;
    const hp = Math.round(R.hp * m * (boss ? 3.4 : 1)), atk = Math.round(R.atk * m * (boss ? 1.5 : 1));
    return mkUnit({ side:"e", boss, n:d[0], e:d[1], hp, max:hp, atk, spd:R.spd, ab,
      crit:.05 + (ab && ab.k === "crit" ? ab.v : 0), dodge:ab && ab.k === "dodge" ? ab.v : 0,
      dr:ab && ab.k === "taunt" ? ab.v : 0, thorns:ab && ab.k === "thorns" ? ab.v : 0 });
  });
  const aura = W.reduce((a, u) => a + (u.ab && u.ab.k === "aura" ? u.ab.v : 0), 0);
  W.forEach(u => u.atk = Math.round(u.atk * (1 + aura)));
  return W;
}
const sidePower = U => Math.round(U.reduce((a, u) => a + unitPower(u), 0));

function simulate(P, E, T) {
  const ev = [], all = P.concat(E);
  const foes = u => (u.side === "p" ? E : P).filter(x => x.alive);
  const mates = u => (u.side === "p" ? P : E).filter(x => x.alive);
  const snap = u => ({ u:u.uid, hp:Math.max(0, Math.round(u.hp)), sh:Math.round(u.shield) });
  const over = () => !E.some(x => x.alive) || !P.some(x => x.alive);
  let round = 0;

  const addShield = (u, v) => { u.shield += v; ev.push({ t:"sh", ...snap(u), v:Math.round(v) }); };
  const heal = (u, v) => { if (!u.alive) return; const b = u.hp; u.hp = Math.min(u.max, u.hp + v); const g = Math.round(u.hp - b); if (g > 0) ev.push({ t:"heal", ...snap(u), v:g }); };
  function kill(u) {
    if (u.hp > 0 || !u.alive) return;
    if (u.hero && T.unb && !u.unbUsed) { u.unbUsed = true; u.hp = 1; u.shield += u.max * .3; ev.push({ t:"save", ...snap(u), msg:"Unbeugsam!" }); return; }
    if (u.hero && u.habs.includes("hRevive") && !u.revUsed) { u.revUsed = true; u.hp = u.max * .4; ev.push({ t:"revive", ...snap(u), msg:"Zweiter Atem!" }); return; }
    u.alive = false; u.hp = 0; u.dots = []; u.stun = 0; u.shield = 0;
    ev.push({ t:"die", u:u.uid });
    if (u.ab && u.ab.k === "martyr") {
      ev.push({ t:"banner", msg:`${u.n} explodiert!` });
      foes(u).forEach(f => directDmg(u, f, u.atk * u.ab.v));
    }
    const ph = mates(u).find(f => f.ab && f.ab.k === "revive" && !f.revGiven);
    if (ph) { ph.revGiven = true; u.alive = true; u.hp = u.max * ph.ab.v; ev.push({ t:"revive", ...snap(u), msg:`${ph.n}: Wiedergeburt!` }); }
  }
  function directDmg(src, t, d) {
    if (!t.alive) return;
    d = Math.max(1, Math.round(d * (1 - t.dr)));
    const abs = Math.min(t.shield, d); t.shield -= abs; t.hp -= d - abs;
    ev.push({ t:"hit", a:src.uid, ...snap(t), v:d, aoe:true });
    kill(t);
  }
  function hit(a, t, mult, aoe) {
    if (!t || !t.alive) return 0;
    if (Math.random() < t.dodge) { ev.push({ t:"miss", a:a.uid, u:t.uid, aoe }); return 0; }
    const k = a.ab && a.ab.k, v = a.ab && a.ab.v;
    let d = a.atk * (1 + a.rage) * mult * (.9 + Math.random() * .2);
    if (a.side === "p" && round <= 2) d *= 1 + T.first;
    if (a.side === "p" && t.boss) d *= 1 + T.boss;
    if (k === "execute" && t.hp / t.max < .35) d *= 1 + v;
    const crit = Math.random() < a.crit; if (crit) d *= a.critDmg;
    d *= (1 + t.shred) * (1 - t.dr);
    d = Math.max(1, Math.round(d));
    const abs = Math.min(t.shield, d); t.shield -= abs; t.hp -= d - abs;
    ev.push({ t:"hit", a:a.uid, ...snap(t), v:d, crit, aoe });
    if (k === "poison") t.dots.push({ d:a.atk * v, r:3 });
    if (k === "shred") t.shred += v;
    if (k === "stun" && t.hp > 0 && Math.random() < v) { t.stun = 1; ev.push({ t:"stun", u:t.uid }); }
    if (k === "lifesteal") heal(a, d * v);
    if (t.thorns > 0 && a.alive) {
      const r = Math.max(1, Math.round(d * t.thorns)); a.hp -= r; ev.push({ t:"hit", a:t.uid, ...snap(a), v:r, thorns:true }); kill(a);
    }
    kill(t);
    return d;
  }
  function target(u) {
    const fs = foes(u); if (!fs.length) return null;
    if (u.ab && u.ab.k === "snipe") return fs.reduce((m, f) => f.hp < m.hp ? f : m);
    const tz = fs.filter(f => f.ab && f.ab.k === "taunt");
    if (tz.length && Math.random() < .75) return rnd(tz);
    return rnd(fs);
  }
  const aoeAll = (u, mult, name) => { ev.push({ t:"skill", a:u.uid, msg:name }); foes(u).forEach(f => hit(u, f, mult, true)); };
  const lowest = u => mates(u).reduce((m, f) => f.hp / f.max < m.hp / m.max ? f : m);

  function act(u) {
    const k = u.ab && u.ab.k, v = u.ab && u.ab.v;
    if (u.hero) {
      if (u.habs.includes("hNova") && round % 6 === 0) return aoeAll(u, 3, "Supernova");
      if (u.habs.includes("hRain") && round % 4 === 0) return aoeAll(u, 1.3, "Sternenregen");
      if (T.fall && round % 3 === 0) return aoeAll(u, 1, "Sternenfall");
      if (u.habs.includes("hStun") && round % 5 === 0) { ev.push({ t:"skill", a:u.uid, msg:"Gravitationswelle" }); foes(u).forEach(f => { f.stun = 1; ev.push({ t:"stun", u:f.uid }); }); }
    }
    if (k === "aoe" && round % 3 === 0) return aoeAll(u, v, AB.aoe.n);
    if (k === "dragon" && round % 3 === 0) { aoeAll(u, v, AB.dragon.n); foes(u).forEach(f => f.dots.push({ d:u.atk * .4, r:3 })); return; }
    if (k === "divine") { ev.push({ t:"skill", a:u.uid, msg:AB.divine.n, quiet:1 }); mates(u).forEach(f => heal(f, u.atk * v)); return; }
    if (k === "heal") { const lo = lowest(u); if (lo.hp / lo.max < .75) { ev.push({ t:"skill", a:u.uid, msg:AB.heal.n, quiet:1 }); heal(lo, u.atk * v); return; } }
    if (k === "barrier" && round % 2 === 0) { ev.push({ t:"skill", a:u.uid, msg:AB.barrier.n, quiet:1 }); addShield(lowest(u), u.atk * v); return; }
    hit(u, target(u), 1 + (k === "snipe" ? v : 0));
    if (k === "rage") u.rage += v;
    if (k === "double" && u.alive && Math.random() < v) hit(u, target(u), 1);
  }

  // Kampfbeginn
  for (const u of all) {
    const k = u.ab && u.ab.k;
    if (k === "shieldTeam") mates(u).forEach(f => addShield(f, f.max * u.ab.v));
    if (k === "burn") foes(u).forEach(f => f.dots.push({ d:u.atk * u.ab.v, r:4 }));
    if (u.hero && u.habs.includes("hShield")) P.forEach(f => addShield(f, u.max * .12));
  }
  if (T.shield) P.forEach(f => addShield(f, f.max * T.shield));

  while (round < MAX_ROUNDS && !over()) {
    round++;
    ev.push({ t:"round", n:round });
    const order = all.filter(u => u.alive).sort((a, b) => b.spd - a.spd || Math.random() - .5);
    for (const u of order) {
      if (!u.alive || over()) continue;
      if (u.stun > 0) { u.stun--; ev.push({ t:"frozen", u:u.uid }); continue; }
      ev.push({ t:"act", u:u.uid });
      act(u);
    }
    if (over()) break;
    for (const u of all) {
      if (!u.alive) continue;
      if (u.dots.length) {
        const d = Math.max(1, Math.round(u.dots.reduce((a, x) => a + x.d, 0)));
        u.hp -= d; u.dots.forEach(x => x.r--); u.dots = u.dots.filter(x => x.r > 0);
        ev.push({ t:"dot", ...snap(u), v:d }); kill(u);
      }
      if (!u.alive) continue;
      if (u.hero && u.habs.includes("hRegen")) heal(u, u.max * .04);
      if (u.side === "p" && T.regen) heal(u, u.max * T.regen);
    }
    if (over()) break;
  }
  const win = !E.some(x => x.alive) && P.some(x => x.alive);
  return { ev, win, rounds:round, timeout:!over() };
}

/* =========================================================
   FORTSCHRITT
   ========================================================= */
function addCardXP(id, n) {
  const c = S.cards[id], before = c.l, cap = cardCap(c);
  c.xp += n;
  while (c.l < cap && c.xp >= cardNeed(c.l)) { c.xp -= cardNeed(c.l); c.l++; }
  if (c.l >= cap) c.xp = Math.min(c.xp, cardNeed(c.l));
  return c.l - before;
}
function addHeroXP(n) {
  const out = { lv:[], abs:[], slots:[] };
  if (S.lv >= MAX_LV) return out;
  S.xp += n;
  while (S.lv < MAX_LV && S.xp >= heroNeed(S.lv)) {
    S.xp -= heroNeed(S.lv); S.lv++; S.tp++; out.lv.push(S.lv);
    HERO_AB.filter(a => a.lv === S.lv).forEach(a => out.abs.push(a.n));
    if (SLOT_LV.includes(S.lv)) out.slots.push(S.lv);
  }
  if (S.lv >= MAX_LV) S.xp = 0;
  if (out.lv.length) Object.keys(S.cards).forEach(id => addCardXP(id, 0));
  return out;
}
function pickRarity(w) {
  const tot = Object.values(w).reduce((a, b) => a + b, 0); let r = Math.random() * tot;
  for (const k in w) { r -= w[k]; if (r <= 0) return k; }
  return "c";
}
function rollCard(w) {
  const r = pickRarity(w), pool = COMP.filter(c => c.r === r);
  return rnd(pool.length ? pool : COMP).id;
}
// Neue Karte oder Duplikat gutschreiben
function grantCard(id) {
  if (S.cards[id]) {
    const c = S.cards[id], dust = Math.round(25 * Math.pow(1.08, S.lv - 1) * RAR[CC[id].r].cost);
    S.dust += dust;
    const up = addCardXP(id, cardNeed(c.l));
    return { id, dup:true, dust, up };
  }
  const l = Math.min(STAGE_CAP[0], Math.max(1, Math.floor(S.lv * .6)));
  S.cards[id] = { l, xp:0, st:0 };
  if (S.team.length < slotsAt(S.lv)) S.team.push(id);
  return { id, dup:false, l };
}
function teamBonus(k) {
  return S.team.slice(0, slotsAt(S.lv)).reduce((a, id) => { const c = S.cards[id]; return a + (c && CC[id].ab === k ? AB[k].v[c.st] : 0); }, 0);
}
function grantRewards(win, s) {
  const E = recLv(s), boss = isBoss(s), T = talentFx(), wis = teamBonus("wisdom"), luck = teamBonus("luck");
  let base = 12 * Math.pow(1.1, E - 1) * (boss ? 3 : 1);
  if (!win) base *= .3;
  const hx = Math.round(base * (1 + T.xp + wis));
  const cx = Math.round(base * .8 * (1 + T.cardXp + wis));
  const first = win && s > S.prog;
  const co = win ? Math.round(6 * Math.pow(1.09, E - 1) * (boss ? 3 : 1) * (first ? 2 : 1) * (1 + T.coins + luck)) : 0;
  const du = win ? Math.round(5 * Math.pow(1.1, E - 1) * (boss ? 2 : 1) * (1 + T.dust + luck)) : 0;
  S.co += co; S.dust += du;
  if (win) { S.stats.wins++; if (first) S.prog = s; } else S.stats.losses++;
  const team = S.team.slice(0, slotsAt(S.lv)).filter(id => S.cards[id]);
  const cards = team.map(id => { const c = S.cards[id], from = c.l; addCardXP(id, cx); return { id, from, to:c.l }; });
  if (T.mentor) Object.keys(S.cards).filter(id => !team.includes(id)).forEach(id => addCardXP(id, Math.round(cx * T.mentor)));
  const hero = addHeroXP(hx);
  cards.forEach(c => c.to = S.cards[c.id].l); // Deckel kann durch Helden-Level-Up gestiegen sein
  let drop = null;
  if (win && (boss || Math.random() < .08 + T.drop)) {
    const w = { ...ZONES[zoneOf(s)].w };
    if (boss) { w.c = 0; w.r = Math.max(w.r, 10); }
    drop = grantCard(rollCard(w));
  }
  save();
  return { win, s, hx, cx, co, du, first, hero, cards, drop };
}

function screenHero() {

  const next = HERO_AB.find(a => a.lv > S.lv), nextSlot = SLOT_LV.find(x => x > S.lv);

        <div><div class="hc-title">${t[1]}</div><div class="hc-name">Der Mondkurier</div><div class="hc-lv">Level ${S.lv} von ${MAX_LV}</div></div></div>
      <div class="hc-xp">${bar(mx ? 1 : S.xp, mx ? 1 : n)}
        <div class="xptext"><span>${mx ? "Maximum erreicht" : `${S.xp} / ${n} EP`}</span><span>${mx ? "" : `noch ${n - S.xp} EP`}</span></div></div>
      <div class="statrow">

const oddsCache = {};
function winChance(s) {

  if (oddsCache[key] == null) {
    let w = 0; const n = 30, T = talentFx();
    for (let i = 0; i < n; i++) if (simulate(buildTeam(), makeWave(s), T).win) w++;

  }

}
function oddsOf(s) {

}

function startBattle(s) {

  const res = simulate(P, E, talentFx());

      <span class="ust" id="st${u.uid}"></span><span class="ue">${u.e}</span><span class="un">${u.n}</span>
      <span class="uhp"><i style="width:100%"></i><span class="ush"></span></span><span class="uv" id="hv${u.uid}">${u.hp}</span></div>`;
  const bt = $("#battle");

      <div class="speeds">${[1,2,4].map(x => `<button data-act="speed" data-x="${x}" class="${speed === x ? "on" : ""}">${x}×</button>`).join("")}<button data-act="skip">Ende ⏭</button></div></div>
    <div class="b-enemies"><div class="side">${units.filter(u => u.side === "e").map(tile).join("")}</div></div>

    <div class="b-team"><div class="side">${units.filter(u => u.side === "p").map(tile).join("")}</div></div>
    <div id="fx"></div></div>`;
  bt.hidden = false;
  B.timer = setTimeout(step, 500 / speed);
}
function setHP(uid, hp, sh) {
  const u = B.units[uid], el = $("#u" + uid); if (!el) return;
  el.querySelector(".uhp i").style.width = Math.max(0, hp / u.max * 100) + "%";
  el.querySelector(".ush").style.width = Math.min(100, sh / u.max * 100) + "%";
  $("#hv" + uid).textContent = sh > 0 ? `${hp} +${sh}` : hp;
}
function floatAt(uid, text, cls) {
  const layer = $("#fx"), el = $("#u" + uid); if (!layer || !el) return;
  const r = el.getBoundingClientRect(), lr = layer.getBoundingClientRect(), f = document.createElement("div");
  f.className = "float " + cls; f.textContent = text;
  f.style.left = (r.left - lr.left + r.width / 2 + (Math.random() * 24 - 12)) + "px";
  f.style.top = (r.top - lr.top + r.height * .25) + "px";
  layer.appendChild(f); setTimeout(() => f.remove(), 900);
}
function banner(msg) {
  const layer = $("#fx"); if (!layer) return;
  const b = document.createElement("div"); b.className = "banner"; b.textContent = msg;
  layer.appendChild(b); setTimeout(() => b.remove(), 1100);
}
function flash(uid, cls) { const el = $("#u" + uid); if (!el) return; el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
// Ein Ereignis anzeigen; gibt die Wartezeit in ms zurück
function applyEv(e, quiet) {
  const U = B.units;
  switch (e.t) {
    case "round": $("#bRound").textContent = `Runde ${e.n}`; return 150;
    case "act": if (!quiet) { document.querySelectorAll(".unit.act").forEach(x => x.classList.remove("act")); const el = $("#u" + e.u); if (el) el.classList.add("act"); } return 40;
    case "hit": setHP(e.u, e.hp, e.sh); if (!quiet) { floatAt(e.u, (e.crit ? "✦" : "") + e.v, e.crit ? "crit" : "dmg"); flash(e.u, "hurt"); } return e.aoe ? 110 : e.thorns ? 150 : 330;
    case "miss": if (!quiet) floatAt(e.u, "verfehlt", "miss"); return e.aoe ? 110 : 260;
    case "heal": setHP(e.u, e.hp, e.sh); if (!quiet) floatAt(e.u, "+" + e.v, "heal"); return 200;
    case "sh": setHP(e.u, e.hp, e.sh); if (!quiet) floatAt(e.u, "⛨" + e.v, "sh"); return 110;
    case "dot": setHP(e.u, e.hp, e.sh); if (!quiet) floatAt(e.u, "☠" + e.v, "dot"); return 160;
    case "stun": { const s = $("#st" + e.u); if (s) s.textContent = "❄"; if (!quiet) floatAt(e.u, "eingefroren", "info"); return 140; }
    case "frozen": { const s = $("#st" + e.u); if (s) s.textContent = ""; if (!quiet) floatAt(e.u, "setzt aus", "miss"); return 220; }
    case "skill": if (quiet) return 0; if (e.quiet) { floatAt(e.a, e.msg, "info"); return 120; } banner(`${U[e.a].n}: ${e.msg}`); return 650;
    case "die": { const el = $("#u" + e.u); if (el) el.classList.add("dead"); const s = $("#st" + e.u); if (s) s.textContent = ""; setHP(e.u, 0, 0); return 300; }
    case "revive": case "save": { const el = $("#u" + e.u); if (el) { el.classList.remove("dead"); if (!quiet) flash(e.u, "revive"); } setHP(e.u, e.hp, e.sh); if (!quiet) banner(e.msg); return 700; }
    case "banner": if (!quiet) banner(e.msg); return 600;

}

  modal(`<div class="result-head ${R.win ? "win" : "lose"}"><h2>${R.win ? "Sieg" : "Niederlage"}</h2>
      <p>${R.win ? (R.first ? "Etappe zum ersten Mal geschafft: doppelte Münzen." : `Gewonnen in ${B.res.rounds} Runden.`) : loseMsg}</p></div>
    <div class="gains"><span class="x">+${R.hx} EP</span>${R.co ? `<span class="coin">+${R.co}</span>` : ""}${R.du ? `<span class="dust">+${R.du}</span>` : ""}</div>
    <div>${bar(mx ? 1 : S.xp, mx ? 1 : n)}<div class="xptext" style="text-align:center;margin-top:4px">Held Level ${S.lv} · ${mx ? "Maximum" : `${S.xp} / ${n} EP`}</div></div>
    ${lvUp ? `<div class="lvup"><b>Level ${S.lv}!</b><span>+${lvUp} Talentpunkt${lvUp > 1 ? "e" : ""}</span>
      ${R.hero.abs.map(a => `<span>Neue Fähigkeit: ${a}</span>`).join("")}${R.hero.slots.length ? "<span>Neuer Platz im Team frei</span>" : ""}</div>` : ""}
    ${cardLines ? `<div class="cgain"><div class="xptext">+${R.cx} EP für jeden Begleiter</div>${cardLines}</div>` : ""}
    ${drop}
    ${auto ? `<div class="autoline" id="autoLine">Nächster Kampf in 2 Sekunden …</div>` : ""}
    <div class="row">
      <button class="btn ghost" data-act="leave">Zurück</button>
      ${nextOpen && !auto ? `<button class="btn" data-act="again" data-s="${R.s + 1}">Nächste Etappe</button>` : ""}
      <button class="btn ${nextOpen && !auto ? "ghost" : ""}" data-act="again" data-s="${R.s}">${auto ? "Sofort" : "Nochmal"}</button>
    </div>
    ${auto ? `<button class="btn ghost sm" data-act="autoOff">Automatik stoppen</button>` : ""}`);
  if (auto) B.autoT = setTimeout(() => { if (B && B.done && S.auto) { modal(""); startBattle(R.s); } }, 2000);
  if (!R.win && S.auto) { S.auto = false; save(); }
}
function leaveBattle() {
  if (B) { clearTimeout(B.timer); clearTimeout(B.autoT); UI.speed = B.speed; }
  B = null; modal("");
  $("#battle").hidden = true; $("#battle").innerHTML = "";
  render();
}

/* =========================================================
   EINGABE
   ========================================================= */
function act(el, ev) {
  const a = el.dataset.act, id = el.dataset.id;
  switch (a) {
    case "tab": UI.tab = el.dataset.k; modal(""); render(); $("#main").scrollTop = 0; break;
    case "card": cardModal(id); break;
    case "close": modal(""); break;
    case "closeBg": if (ev.target === el && !B) modal(""); break;
    case "toggleTeam": {
      const i = S.team.indexOf(id);
      if (i >= 0) S.team.splice(i, 1); else if (S.team.length < slotsAt(S.lv)) S.team.push(id);
      save(); render(); cardModal(id); break;
    }
    case "train": {
      const c = S.cards[id], cost = Math.max(0, cardNeed(c.l) - c.xp);
      if (c.l >= cardCap(c) || S.dust < cost) return;
      S.dust -= cost; addCardXP(id, cost); save(); render(); cardModal(id);
      toast(`${form(id, c.st)[0]} ist jetzt Level ${c.l}`); break;
    }
    case "evolve": {
      const c = S.cards[id], cost = evoCost(id, c.st + 1);
      if (c.st >= 2 || c.l < STAGE_CAP[c.st] || S.co < cost) return;
      S.co -= cost; c.st++; addCardXP(id, 0); save(); render(); cardModal(id);
      toast(`Entwickelt: ${form(id, c.st)[1]} ${form(id, c.st)[0]}`); break;
    }
    case "zone": { const z = +el.dataset.z; if (z > 0 && S.prog < z * 10) { toast(`Besiege zuerst den Boss von Zone ${z}.`); return; } S.zone = z; save(); render(); break; }
    case "fight": startBattle(+el.dataset.s); break;
    case "noop": toast("Schaffe zuerst die Etappe davor."); break;
    case "auto": S.auto = !S.auto; save(); render(); break;
    case "speed": B.speed = +el.dataset.x; document.querySelectorAll(".speeds [data-x]").forEach(b => b.classList.toggle("on", +b.dataset.x === B.speed)); break;
    case "skip": skipBattle(); break;
    case "again": { const s = +el.dataset.s; if (B) clearTimeout(B.autoT); modal(""); S.zone = zoneOf(s); startBattle(s); break; }
    case "autoOff": { S.auto = false; save(); if (B) clearTimeout(B.autoT); const l = $("#autoLine"); if (l) l.textContent = "Automatik gestoppt."; el.hidden = true; break; }
    case "leave": leaveBattle(); break;
    case "talent": talentModal(id); break;
    case "learn": {
      const t = TM[id], r = S.tal[id] || 0, sp = TALENTS.filter(x => x.b === t.b).reduce((s2, x) => s2 + (S.tal[x.id] || 0), 0);
      if (S.tp < 1 || r >= t.max || sp < t.t * 5) return;
      S.tp--; S.tal[id] = r + 1; save(); render(); talentModal(id); break;
    }
    case "talReset": {
      const p = resetPrice(); if (S.co < p) return;
      modal(`<h2>Talente zurücksetzen?</h2><p>Du bekommst alle ${Object.values(S.tal).reduce((x, y) => x + y, 0)} Punkte zurück und kannst sie neu verteilen. Kosten: ${p} Münzen.</p>
        <div class="row"><button class="btn ghost" data-act="close">Abbrechen</button><button class="btn" data-act="talResetOk">Zurücksetzen</button></div>`); break;
    }
    case "talResetOk": {
      const p = resetPrice(); if (S.co < p) return;
      S.co -= p; S.tp += Object.values(S.tal).reduce((x, y) => x + y, 0); S.tal = {}; save(); modal(""); render(); break;
    }
    case "pack": {
      const n = +el.dataset.n, p = n === 1 ? packPrice() : Math.round(packPrice() * 2.5);
      if (S.co < p) return;
      S.co -= p;
      const w = ZONES[Math.min(4, Math.floor(S.prog / 10))].w, got = [];
      for (let i = 0; i < n; i++) got.push(grantCard(rollCard(n === 3 && i === 0 ? { ...w, c:0, r:Math.max(w.r, 10) } : w)));
      save(); render();
      modal(`<h2>${n === 1 ? "Sternenpack" : "Großes Sternenpack"}</h2>${got.map(g => {
        const d = CC[g.id], f = form(g.id, S.cards[g.id].st);
        return `<div class="drop r-${d.r}"><div class="dm">${g.dup ? "Doppelt" : "Neu!"}</div><div class="de">${f[1]}</div><div class="dn">${f[0]}</div>
          <div class="dm">${RAR[d.r].n} · ${AB[d.ab].n}${g.dup ? ` · +${g.dust} Staub${g.up ? ", +1 Level" : ""}` : ` · Level ${g.l}`}</div></div>`;
      }).join("")}<button class="btn" data-act="close">Super</button>`);
      break;
    }
    case "buyDust": { const p = dustOffer(); if (S.co < p) return; S.co -= p; S.dust += p; save(); render(); toast(`+${p} Sternenstaub`); break; }
    case "help": helpModal(); break;
    case "resetAsk":
      modal(`<h2>Spielstand löschen?</h2><p>Level, Karten, Talente und Münzen gehen verloren. Das lässt sich nicht rückgängig machen.</p>
        <div class="row"><button class="btn ghost" data-act="close">Abbrechen</button><button class="btn danger" data-act="reset">Löschen</button></div>`); break;
    case "reset": S = defSave(); S.seen = true; save(); modal(""); UI.tab = "hero"; render(); toast("Neues Spiel gestartet"); break;
  }
}
document.addEventListener("click", ev => { const el = ev.target.closest("[data-act]"); if (el) act(el, ev); });

/* =========================================================
   START
   ========================================================= */
function start(data) {
  S = (data && data.S && data.S.v === 2) ? data.S : load();
  render();
  if (!S.seen) { S.seen = true; save(); helpModal(); }
}
window.claude?.hot?.snapshot?.(() => ({ S }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
</body>
</html>
