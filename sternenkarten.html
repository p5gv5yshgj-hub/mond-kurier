<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Sternenkarten</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-sized column. Status bar on top, one screen in the middle, four tabs at the bottom.
   Every screen leads with one clear action; the upgrade tree is a pannable star map. */
:root {
  --night: #0c0f22;      /* deep lunar night, page ground */
  --deck: #171b37;       /* raised panels */
  --deck-2: #222851;     /* chips, empty bars */
  --line: #313869;       /* hairlines */
  --moon: #ece8d9;       /* moon-silver text */
  --dim: #a3a5c2;        /* secondary text */
  --gold: #f2c14e;       /* lunar gold: the one action colour */
  --gold-ink: #1b1606;
  --hp: #ff5d6c;
  --shield: #6ecbff;
  --good: #7bd88f;
  --xp: #9a88ff;
  --t-a: #ff7a59; --t-d: #59b8ff; --t-c: #c48bff; --t-k: #f2c14e;
  --r-c: #9aa3b8; --r-r: #4fb3ff; --r-e: #b77bff; --r-l: #ffb347;
  --f-display: "Chakra Petch", "Trebuchet MS", system-ui, sans-serif;
  --f-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--night); color: var(--moon);
  font-family: var(--f-body); font-size: 16px; line-height: 1.35;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  overflow: hidden; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none;
}
body::after {
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: .4;
  background-image:
    radial-gradient(1px 1px at 12% 18%, var(--moon) 50%, transparent 51%),
    radial-gradient(1px 1px at 72% 9%, var(--moon) 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 41% 63%, var(--dim) 50%, transparent 51%),
    radial-gradient(1px 1px at 88% 47%, var(--moon) 50%, transparent 51%),
    radial-gradient(1px 1px at 23% 86%, var(--dim) 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 63% 92%, var(--moon) 50%, transparent 51%);
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, [data-act]:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; letter-spacing: .02em; }
p { margin: 0; }
.muted { color: var(--dim); }

#app { position: relative; z-index: 1; max-width: 560px; height: 100%; margin: 0 auto; display: flex; flex-direction: column; }

/* ---------- Statusleiste ---------- */
#top { display: flex; align-items: center; gap: 12px; padding-block: 12px 10px; border-bottom: 1px solid var(--line); }
.lvl-badge { font-family: var(--f-display); font-weight: 700; font-size: 14px; background: var(--gold); color: var(--gold-ink); padding: 4px 9px; border-radius: 7px; white-space: nowrap; }
.xpwrap { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.bar { height: 8px; background: var(--deck-2); border-radius: 4px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--xp); border-radius: 4px; transition: width .5s ease; }
.bar.gold i { background: var(--gold); }
.xptext { font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; }
.wallet { display: flex; gap: 10px; font-weight: 700; font-variant-numeric: tabular-nums; font-size: 15px; white-space: nowrap; }
.coin::before { content: ""; display: inline-block; width: .8em; height: .8em; border-radius: 50%; background: var(--gold); box-shadow: inset -2px -2px 0 rgba(0,0,0,.25); margin-right: 5px; vertical-align: -1px; }
.sp { color: var(--good); }
.sp::before { content: "★"; margin-right: 3px; }

#main { flex: 1; overflow-y: auto; overflow-x: hidden; padding-block: 14px 24px; -webkit-overflow-scrolling: touch; display: flex; flex-direction: column; gap: 14px; min-height: 0; }
#main > * { flex-shrink: 0; }
#main.fill { overflow: hidden; padding-bottom: 8px; }
.screen-title h2 { font-size: 24px; }
.screen-title p { color: var(--dim); font-size: 14px; margin-top: 2px; }
.label { font-family: var(--f-display); text-transform: uppercase; letter-spacing: .12em; font-size: 12px; color: var(--dim); margin-top: 6px; }

#nav { display: grid; grid-template-columns: repeat(5, 1fr); border-top: 1px solid var(--line); padding-block: 6px 8px; }
#nav button { background: none; border: 0; padding: 4px 0; display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--dim); font-size: 12px; font-weight: 600; }
#nav button svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
#nav button.on { color: var(--gold); }
#nav .badge { position: relative; }
#nav .badge b { position: absolute; top: -4px; right: -12px; min-width: 18px; height: 17px; padding: 0 4px; border-radius: 9px; background: var(--good); color: var(--night); font-size: 11px; line-height: 17px; }

.btn { border: 0; border-radius: 12px; padding: 13px 18px; font-weight: 700; font-size: 16px; background: var(--gold); color: var(--gold-ink); font-family: var(--f-display); letter-spacing: .03em; transition: transform .12s ease, opacity .2s; }
.btn:active { transform: scale(.97); }
.btn.ghost { background: var(--deck-2); color: var(--moon); }
.btn.green { background: var(--good); color: var(--night); }
.btn.danger { background: var(--hp); color: var(--night); }
.btn.big { width: 100%; font-size: 20px; padding: 16px; }
.btn.sm { padding: 8px 12px; font-size: 14px; border-radius: 9px; }
.btn.wide { width: 100%; }
.btn[disabled] { opacity: .4; pointer-events: none; }
.panel { background: var(--deck); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
.r-c { --rc: var(--r-c); } .r-r { --rc: var(--r-r); } .r-e { --rc: var(--r-e); } .r-l { --rc: var(--r-l); }
.rar { color: var(--rc); font-weight: 700; }

.chance { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-weight: 700; font-size: 14px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.chance.easy { background: color-mix(in srgb, var(--good) 20%, transparent); color: var(--good); }
.chance.even { background: color-mix(in srgb, var(--gold) 20%, transparent); color: var(--gold); }
.chance.hard { background: color-mix(in srgb, var(--hp) 20%, transparent); color: var(--hp); }

/* ---------- Start ---------- */
.herobar { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; background: var(--deck); border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
.portrait { width: 64px; height: 64px; border-radius: 50%; flex: none; display: grid; place-items: center; font-size: 36px;
  background: radial-gradient(circle at 35% 30%, var(--moon), #b9b39e 55%, #6f6a5b); box-shadow: 0 0 0 3px var(--hc, var(--r-c)); }
.herobar .hb { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.herobar .ht { font-size: 12px; text-transform: uppercase; letter-spacing: .12em; color: var(--hc); font-weight: 700; }
.herobar .hn { font-family: var(--f-display); font-size: 20px; font-weight: 700; }
.chev { color: var(--dim); font-size: 22px; }
.nextfight { position: relative; overflow: hidden; border-radius: 20px; padding: 18px; border: 2px solid var(--gold); background: var(--deck); display: flex; flex-direction: column; gap: 12px; }
.nextfight::before { content: ""; position: absolute; inset: 0; background: var(--zbg); opacity: .55; pointer-events: none; }
.nextfight > * { position: relative; }
.nf-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.nf-kicker { font-size: 12px; text-transform: uppercase; letter-spacing: .14em; color: var(--gold); font-weight: 700; }
.nf-title { font-family: var(--f-display); font-size: 22px; font-weight: 700; margin-top: 2px; }
.nf-foes { font-size: 44px; letter-spacing: 6px; text-align: center; line-height: 1.2; }
.nf-hint { font-size: 14px; color: var(--moon); background: color-mix(in srgb, var(--night) 55%, transparent); border-radius: 12px; padding: 10px 12px; line-height: 1.4; }
.switchrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; background: none; border: 0; padding: 0; text-align: left; font-size: 14px; color: var(--dim); }
.switchrow b { color: var(--moon); }
.sw { width: 46px; height: 28px; border-radius: 999px; background: var(--deck-2); position: relative; flex: none; transition: background .2s; border: 1px solid var(--line); }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--dim); transition: transform .2s, background .2s; }
.sw.on { background: color-mix(in srgb, var(--good) 40%, var(--deck-2)); }
.sw.on::after { transform: translateX(18px); background: var(--good); }
.todos { display: flex; flex-direction: column; gap: 8px; }
.todo { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: var(--deck); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
.todo .ti { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-size: 22px; flex: none; background: var(--deck-2); }
.todo .tt { flex: 1; min-width: 0; }
.todo .tt b { display: block; }
.todo .tt span { font-size: 13px; color: var(--dim); }
.todo.hot { border-color: var(--good); }
.todo.hot .ti { background: color-mix(in srgb, var(--good) 22%, var(--deck-2)); }
.goal { font-size: 14px; color: var(--dim); line-height: 1.5; display: flex; flex-direction: column; gap: 4px; }
.goal b { color: var(--moon); }

/* ---------- Held ---------- */
.hero-svg { display: block; overflow: visible; }
.hero-svg.idle { animation: hover 3.2s ease-in-out infinite; }
@keyframes hover { 50% { transform: translateY(-5px); } }
.herocard { position: relative; overflow: hidden; display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; border-radius: 20px; padding: 12px 14px 12px 6px;
  border: 2px solid var(--hc); background: radial-gradient(120% 120% at 15% 50%, color-mix(in srgb, var(--hc) 22%, var(--deck)), var(--deck) 65%); }
.herocard .hb { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
.herocard .ht { font-size: 12px; text-transform: uppercase; letter-spacing: .12em; color: var(--hc); font-weight: 700; }
.herocard .hn { font-family: var(--f-display); font-size: 21px; font-weight: 700; line-height: 1.1; }
.eqdots { display: flex; gap: 5px; flex-wrap: wrap; }
.eqdots span { font-size: 11px; font-weight: 700; padding: 2px 6px; border-radius: 6px; background: var(--deck-2); border: 1px solid var(--tc); color: var(--moon); white-space: nowrap; }
.stage-hero { position: relative; text-align: center; border-radius: 24px; padding: 18px 16px 16px; overflow: hidden; border: 2px solid var(--hc);
  background: radial-gradient(70% 60% at 50% 38%, color-mix(in srgb, var(--hc) 30%, transparent), transparent 70%), linear-gradient(180deg, var(--deck), var(--night)); }
.stage-hero::after { content: ""; position: absolute; left: 50%; bottom: 96px; width: 190px; height: 34px; transform: translateX(-50%); border-radius: 50%;
  background: radial-gradient(closest-side, color-mix(in srgb, var(--hc) 45%, transparent), transparent); pointer-events: none; }
.stage-hero .hero-svg { margin: 0 auto; position: relative; z-index: 1; }
.stage-hero .tt { font-size: 13px; text-transform: uppercase; letter-spacing: .16em; color: var(--hc); font-weight: 700; margin-top: 4px; }
.stage-hero h2 { font-size: 28px; }
.stage-hero .lvline { font-family: var(--f-display); color: var(--dim); font-size: 16px; margin-bottom: 10px; }
.stats4 { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 6px; }
.stats4 div { background: var(--deck); border: 1px solid var(--line); border-radius: 12px; padding: 10px 2px; text-align: center; }
.stats4 b { display: block; font-family: var(--f-display); font-size: 18px; font-variant-numeric: tabular-nums; }
.stats4 span { font-size: 10.5px; color: var(--dim); text-transform: uppercase; letter-spacing: .06em; }
.eqgrid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px; }
.eq { display: flex; flex-direction: column; gap: 6px; padding: 12px; border-radius: 16px; background: var(--deck); border: 2px solid var(--tc); min-width: 0; }
.eq .eh { display: flex; gap: 8px; align-items: center; }
.eq .ei { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-size: 22px; flex: none; background: color-mix(in srgb, var(--tc) 22%, var(--deck-2)); }
.eq .en { font-weight: 700; font-size: 14px; line-height: 1.15; }
.eq .ek { font-size: 12px; color: var(--dim); }
.eq .ed { font-size: 13px; color: var(--dim); line-height: 1.35; flex: 1; }
.eq .btn { width: 100%; }
.forms { display: grid; grid-template-columns: repeat(6, minmax(0,1fr)); gap: 4px; }
.forms div { text-align: center; border-radius: 12px; padding: 6px 0 4px; border: 1px solid var(--line); opacity: .4; min-width: 0; }
.forms div.on { opacity: 1; border-color: var(--hc); background: color-mix(in srgb, var(--hc) 14%, transparent); }
.forms div.done { opacity: .8; }
.forms .hero-svg { margin: 0 auto; }
.forms span { display: block; font-size: 10px; color: var(--dim); font-weight: 700; }
.ultbox { display: flex; gap: 12px; align-items: center; }
.ultbox .uicon { width: 52px; height: 52px; border-radius: 50%; flex: none; display: grid; place-items: center; font-size: 26px;
  background: radial-gradient(circle, color-mix(in srgb, var(--gold) 50%, transparent), var(--deck-2)); border: 2px solid var(--gold); }

/* ---------- Etappen ---------- */
.zonetabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 2px; }
.zonetabs::-webkit-scrollbar { display: none; }
.ztab { flex: none; background: var(--deck-2); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; text-align: left; color: var(--dim); }
.ztab b { display: block; font-size: 14px; color: var(--moon); }
.ztab span { font-size: 12px; }
.ztab.on { background: var(--moon); border-color: var(--moon); }
.ztab.on b, .ztab.on span { color: var(--night); }
.ztab.lock { opacity: .45; }
.zonehead { position: relative; border-radius: 16px; padding: 16px; overflow: hidden; border: 1px solid var(--line); background: var(--deck); }
.zonehead::before { content: ""; position: absolute; inset: 0; background: var(--zbg); opacity: .6; }
.zonehead > * { position: relative; }
.zonehead h3 { font-size: 21px; }
.zonehead p { color: var(--dim); font-size: 14px; margin-top: 4px; }
.stages { display: flex; flex-direction: column; gap: 8px; }
.stage { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: var(--deck); border: 1px solid var(--line); border-radius: 14px; text-align: left; width: 100%; min-height: 64px; }
.stage .sn { font-family: var(--f-display); font-weight: 700; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-size: 16px; flex: none; background: var(--deck-2); }
.stage.cleared .sn { background: color-mix(in srgb, var(--good) 25%, var(--deck-2)); color: var(--good); }
.stage .sf { flex: 1; min-width: 0; font-size: 26px; letter-spacing: 3px; }
.stage .sf small { display: block; font-size: 12px; letter-spacing: 0; color: var(--dim); font-family: var(--f-body); }
.stage.boss { border-color: var(--r-l); }
.stage.boss .sn { background: var(--r-l); color: var(--night); }
.stage.locked { opacity: .4; }
.stage.next { border: 2px solid var(--gold); }

/* ---------- Team ---------- */
.lineup { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 8px; }
.slot { min-height: 116px; border-radius: 14px; border: 1px dashed var(--line); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-align: center; padding: 8px 3px; font-size: 12px; color: var(--dim); background: none; min-width: 0; }
.slot.full { border: 2px solid var(--rc); background: var(--deck); color: var(--moon); }
.slot.hero { border: 2px solid var(--gold); background: color-mix(in srgb, var(--gold) 10%, var(--deck)); color: var(--moon); }
.slot .se { font-size: 32px; line-height: 1.15; }
.slot .sn { font-weight: 700; font-size: 12px; line-height: 1.15; max-width: 100%; overflow-wrap: anywhere; }
.slot .sl { font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums; }
.slot.empty { border-color: var(--good); color: var(--good); }
.slot.locked { opacity: .5; }
.clist { display: flex; flex-direction: column; gap: 8px; }
.crow { display: flex; gap: 12px; align-items: center; padding: 12px; background: var(--deck); border: 1px solid var(--line); border-left: 4px solid var(--rc); border-radius: 14px; text-align: left; width: 100%; }
.crow .ce { font-size: 34px; width: 44px; text-align: center; flex: none; }
.crow .ci { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.crow .cn { font-weight: 700; font-size: 16px; }
.crow .cm { font-size: 13px; color: var(--dim); }
.crow .clv { font-family: var(--f-display); font-weight: 700; font-size: 16px; text-align: right; white-space: nowrap; }
.crow.future { opacity: .55; border-style: dashed; border-left-style: solid; }
.crow.future .ce { filter: grayscale(1) brightness(.6); }
.flag { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 6px; background: var(--gold); color: var(--gold-ink); margin-top: 3px; }

/* ---------- Modal ---------- */
.modal-bg { position: fixed; inset: 0; z-index: 50; background: color-mix(in srgb, var(--night) 86%, transparent); display: flex; align-items: center; justify-content: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); animation: fade .2s ease; }
.modal { width: 100%; max-width: 420px; max-height: 100%; overflow-y: auto; background: var(--deck); border: 1px solid var(--line); border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.modal h2 { font-size: 22px; }
.modal p { color: var(--dim); line-height: 1.45; }
.modal .row { display: flex; gap: 8px; flex-wrap: wrap; }
.modal .row .btn { flex: 1; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.mhead { display: flex; gap: 14px; align-items: center; }
.mhead .me { font-size: 50px; line-height: 1; width: 72px; height: 72px; border-radius: 18px; display: grid; place-items: center; background: var(--deck-2); border: 2px solid var(--rc); flex: none; }
.mhead .mt { min-width: 0; }
.mhead .mt p { font-size: 14px; }
.box { background: var(--deck-2); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.box .bt { font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--dim); font-weight: 700; }
.box .bb { font-size: 15px; line-height: 1.4; }
.box .bb b { color: var(--gold); }
.stats3 { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; }
.stats3 div { background: var(--deck-2); border-radius: 12px; padding: 10px 4px; text-align: center; }
.stats3 b { display: block; font-family: var(--f-display); font-size: 20px; font-variant-numeric: tabular-nums; }
.stats3 span { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: .08em; }
.evorow { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 6px; }
.evorow div { text-align: center; border-radius: 12px; padding: 8px 4px; border: 1px solid var(--line); opacity: .45; }
.evorow div.on { opacity: 1; border-color: var(--rc); background: color-mix(in srgb, var(--rc) 12%, transparent); }
.evorow .ee { font-size: 28px; line-height: 1.2; }
.evorow .en { font-size: 12px; font-weight: 700; line-height: 1.15; }
.evorow .el { font-size: 11px; color: var(--dim); }
.ablist { display: flex; flex-direction: column; gap: 8px; }
.abrow { display: flex; gap: 12px; align-items: flex-start; padding: 10px 12px; background: var(--deck-2); border-radius: 12px; }
.abrow .lvtag { font-family: var(--f-display); font-weight: 700; font-size: 12px; min-width: 50px; text-align: center; padding: 3px 0; border-radius: 6px; background: var(--gold); color: var(--gold-ink); flex: none; }
.abrow.locked { opacity: .5; }
.abrow.locked .lvtag { background: var(--line); color: var(--dim); }
.abrow .an { font-weight: 700; }
.abrow .ad { font-size: 13px; color: var(--dim); line-height: 1.35; }
.steps { display: flex; flex-direction: column; gap: 10px; }
.steps div { display: flex; gap: 12px; align-items: flex-start; }
.steps i { font-style: normal; font-family: var(--f-display); font-weight: 700; width: 28px; height: 28px; border-radius: 50%; background: var(--gold); color: var(--gold-ink); display: grid; place-items: center; flex: none; }
.steps p { color: var(--moon); }
.steps span { color: var(--dim); font-size: 14px; display: block; }

/* ---------- Upgrade-Baum ---------- */
.treebar { display: flex; gap: 6px; align-items: center; }
.treebar .bjump { flex: 1; min-width: 0; border: 0; border-radius: 10px; padding: 8px 2px; background: var(--deck-2); color: var(--bc); font-weight: 700; font-size: 13px; }

.treewrap { position: relative; overflow: auto; border: 1px solid var(--line); border-radius: 16px; background:

.tnode .tc { position: absolute; top: -6px; right: -8px; min-width: 22px; height: 20px; border-radius: 10px; font-size: 11px; font-weight: 700; line-height: 18px; padding: 0 5px; background: var(--deck-2); border: 1px solid var(--line); color: var(--dim); font-family: var(--f-body); }
.tnode.locked { opacity: .45; filter: grayscale(.7); }
.tnode.open { border-color: var(--good); border-style: dashed; }

@keyframes glow { 50% { box-shadow: 0 0 0 8px color-mix(in srgb, var(--good) 10%, transparent); } }
.legendrow { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--dim); }
.legendrow span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; border: 2px solid var(--c); background: var(--f, transparent); }

/* ---------- Kampf ---------- */

.unit.hero { border: 2px solid var(--gold); }
.unit.herobig { flex-direction: row; align-items: center; gap: 10px; padding: 6px 12px 6px 4px; text-align: left;
  background: radial-gradient(90% 140% at 10% 50%, color-mix(in srgb, var(--gold) 18%, var(--deck)), var(--deck) 70%); }
.unit.herobig .hbx { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.unit.herobig .un { font-size: 14px; font-family: var(--f-display); font-weight: 700; }

.uen i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--gold), #fff3c4); transition: width .25s ease; }
.uen.full i { animation: charged .6s ease-in-out infinite; }
@keyframes charged { 50% { filter: brightness(1.6); } }
.enlabel { font-size: 11px; color: var(--gold); font-weight: 700; display: flex; justify-content: space-between; }
.ultflash::after { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 50% 70%, color-mix(in srgb, var(--gold) 45%, transparent), transparent 70%); animation: ult .7s ease-out forwards; pointer-events: none; z-index: 4; }
@keyframes ult { from { opacity: 1; } to { opacity: 0; } }

@keyframes ultname { 0% { opacity: 0; scale: .6; } 20% { opacity: 1; scale: 1.1; } 80% { opacity: 1; } 100% { opacity: 0; } }
.unit .un { font-size: 10.5px; font-weight: 600; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.unit .uhp { height: 7px; background: var(--deck-2); border-radius: 4px; overflow: hidden; position: relative; }
.unit .uhp i { display: block; height: 100%; background: var(--hp); transition: width .25s ease; }
.unit .ush { position: absolute; left: 0; top: 0; bottom: 0; background: color-mix(in srgb, var(--shield) 80%, transparent); transition: width .25s; width: 0; }
.unit .uv { font-size: 10.5px; color: var(--moon); font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.unit .ust { position: absolute; top: 2px; right: 4px; font-size: 12px; }
.unit.act { transform: translateY(-6px) scale(1.06); border-color: var(--moon); box-shadow: 0 0 0 2px var(--moon); z-index: 2; }
.b-enemies .unit.act { transform: translateY(8px) scale(1.06); }
.unit.hurt { animation: shake .3s; }
.unit.dead { opacity: .25; filter: grayscale(1); }
.unit.revive { animation: pop .5s; }
@keyframes shake { 0%,100% { translate: 0; } 25% { translate: -6px 0; } 50% { translate: 5px 0; } 75% { translate: -3px 0; } }
@keyframes pop { 0% { transform: scale(.6); } 70% { transform: scale(1.15); } }
#fx { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.float { position: absolute; font-family: var(--f-display); font-weight: 700; font-size: 19px; text-shadow: 0 2px 5px rgba(0,0,0,.85); animation: floatup .9s ease-out forwards; transform: translateX(-50%); white-space: nowrap; z-index: 3; }
.float.dmg { color: var(--moon); } .float.crit { color: var(--gold); font-size: 25px; } .float.heal { color: var(--good); } .float.sh { color: var(--shield); } .float.miss { color: var(--dim); font-size: 14px; } .float.dot { color: var(--good); font-size: 16px; } .float.info { color: var(--gold); font-size: 14px; }
@keyframes floatup { from { opacity: 1; margin-top: 0; } to { opacity: 0; margin-top: -46px; } }
.burst { position: absolute; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%; border: 3px solid var(--moon); animation: burst .35s ease-out forwards; z-index: 2; }
.burst.crit { border-color: var(--gold); width: 80px; height: 80px; margin: -40px 0 0 -40px; }

.beam { position: absolute; height: 3px; transform-origin: 0 50%; background: linear-gradient(90deg, transparent, var(--gold)); border-radius: 2px; animation: beam .28s ease-out forwards; z-index: 1; }
.beam.foe { background: linear-gradient(90deg, transparent, var(--hp)); }
@keyframes beam { from { opacity: 1; } to { opacity: 0; } }
.legend { display: flex; justify-content: center; gap: 12px; font-size: 11px; color: var(--dim); flex-wrap: wrap; }
.legend i { display: inline-block; width: 10px; height: 6px; border-radius: 3px; margin-right: 4px; vertical-align: 1px; }

/* Ergebnis */
.result-head { text-align: center; display: flex; flex-direction: column; gap: 6px; }
.result-head h2 { font-size: 30px; }
.result-head.win h2 { color: var(--gold); } .result-head.lose h2 { color: var(--hp); }
.gains { display: flex; gap: 16px; justify-content: center; font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; flex-wrap: wrap; }
.gains .x { color: var(--xp); }
.lvup { text-align: center; background: color-mix(in srgb, var(--gold) 14%, var(--deck)); border: 1px solid var(--gold); border-radius: 14px; padding: 12px; animation: pop .5s ease; }
.lvup b { font-family: var(--f-display); font-size: 21px; color: var(--gold); display: block; }
.lvup span { font-size: 14px; color: var(--moon); display: block; margin-top: 3px; }
.cg { display: grid; grid-template-columns: 30px minmax(0,1fr) auto; align-items: center; gap: 4px 10px; font-size: 14px; }
.cg .ge { font-size: 24px; grid-row: span 2; text-align: center; }
.cg .gn { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cg .gl { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; }
.cg .gl.up { color: var(--good); }
.cg .bar { grid-column: 2 / 4; height: 6px; }
.drop { text-align: center; border: 2px solid var(--rc); border-radius: 16px; padding: 12px; animation: pop .5s ease; }
.drop .de { font-size: 46px; }
.drop .dn { font-family: var(--f-display); font-weight: 700; font-size: 18px; }
.drop .dm { font-size: 13px; color: var(--dim); }
.autoline { text-align: center; font-size: 14px; color: var(--good); }

#toasts { position: fixed; z-index: 80; left: 0; right: 0; top: calc(env(safe-area-inset-top, 0px) + 10px); display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; padding: 0 16px; }
.toast { background: var(--moon); color: var(--night); font-weight: 700; font-size: 15px; padding: 10px 16px; border-radius: 12px; box-shadow: 0 6px 20px rgba(0,0,0,.4); animation: tin .3s ease, tout .3s ease 2.4s forwards; max-width: 420px; text-align: center; }
@keyframes tin { from { transform: translateY(-20px); opacity: 0; } }
@keyframes tout { to { transform: translateY(-20px); opacity: 0; } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; transition-duration: .01ms !important; }
}
@media (max-width: 360px) {
  .b-enemies .unit { width: 88px; }
  .nf-foes { font-size: 36px; }
}

<body>
<div id="app">
  <header id="top"></header>
  <main id="main"></main>
  <nav id="nav"></nav>
</div>
<div id="battle" hidden></div>

<script>
"use strict";
/* =========================================================
   GRUNDWERTE
   ========================================================= */
const G = 1.07;                 // Wachstum der Kampfwerte pro Level
const MAX_LV = 60;
const MAX_ROUNDS = 30;
const STAGE_CAP = [20, 40, 60]; // Max-Level je Entwicklungsform
const SLOT_LV = [1, 1, 3, 6, 10, 15, 22]; // ab welchem Heldenlevel ein Kartenplatz frei wird (7 Plätze)
const WAVE = [1, 1, 2, 2, 2, 3, 3, 3, 3];
const recLv = s => Math.round(1 + (s - 1) * 1.2);       // empfohlenes Level je Etappe (1–50)
const isBoss = s => s % 10 === 0;
const zoneOf = s => Math.floor((s - 1) / 10);
const stageNo = s => (s - 1) % 10 + 1;
const slotsAt = L => SLOT_LV.filter(x => x <= L).length;
const heroNeed = L => Math.round(12 * Math.pow(1.1, L - 1) * (3 + .35 * L));
const cardNeed = l => Math.round(heroNeed(l) * .8);
const ptsFor = L => 3 + Math.floor(L / 15);   // Sternenpunkte beim Erreichen von Level L
const BOSS_PTS = 5;
const pct = v => Math.round(v * 100) + " %";

const RAR = { c:{ n:"Gewöhnlich", m:1, cost:1 }, r:{ n:"Selten", m:1.12, cost:1.5 }, e:{ n:"Episch", m:1.25, cost:2.2 }, l:{ n:"Legendär", m:1.4, cost:3 } };
const STAGE_MUL = [1, 1.3, 1.7];
const EVO_COST = [0, 400, 4000];
const ROLES = {
  tank:     { n:"Tank",         hp:110, atk:6,  spd:3, key:"tank" },
  krieger:  { n:"Krieger",      hp:78,  atk:10, spd:5, key:"warrior" },
  schuetze: { n:"Schütze",      hp:52,  atk:13, spd:7, key:"shooter" },
  magier:   { n:"Magier",       hp:55,  atk:11, spd:4, key:"mage" },
  heiler:   { n:"Heiler",       hp:62,  atk:7,  spd:6, key:"healer" },
  support:  { n:"Unterstützer", hp:66,  atk:8,  spd:5, key:"support" }
};

// Fähigkeiten: v = Wert je Entwicklungsform
const AB = {
  taunt:     { n:"Spott",          v:[.15,.25,.35], d:v => `Lockt die Gegner an und nimmt ${pct(v)} weniger Schaden.` },
  shieldTeam:{ n:"Schutzfeld",     v:[.2,.32,.45],  d:v => `Zu Kampfbeginn bekommt das ganze Team einen Schild von ${pct(v)} seiner Lebenspunkte.` },
  heal:      { n:"Reparatur",      v:[1.6,2.2,3],   d:v => `Heilt das schwächste Teammitglied, sobald jemand verletzt ist (${pct(v)} des Angriffs).` },
  aoe:       { n:"Kettenblitz",    v:[.9,1.2,1.6],  d:v => `Jede 3. Runde trifft sie alle Gegner gleichzeitig (${pct(v)} des Angriffs).` },
  poison:    { n:"Sporengift",     v:[.3,.45,.6],   d:v => `Treffer vergiften: 3 Runden lang ${pct(v)} des Angriffs als Schaden.` },
  crit:      { n:"Funkeln",        v:[.25,.35,.5],  d:v => `${pct(v)} Chance auf doppelten Schaden.` },

  stun:      { n:"Frost",          v:[.18,.25,.33], d:v => `${pct(v)} Chance, das Ziel einzufrieren. Es setzt dann eine Runde aus.` },
  aura:      { n:"Schlachtruf",    v:[.08,.13,.2],  d:v => `Das ganze Team macht ${pct(v)} mehr Schaden.` },
  revive:    { n:"Wiedergeburt",   v:[.3,.5,.75],   d:v => `Holt das erste gefallene Teammitglied mit ${pct(v)} Leben zurück.` },
  execute:   { n:"Hinrichtung",    v:[.6,1,1.5],    d:v => `${pct(v)} mehr Schaden gegen fast besiegte Gegner.` },
  double:    { n:"Schattenhieb",   v:[.3,.45,.6],   d:v => `${pct(v)} Chance, zweimal anzugreifen.` },
  thorns:    { n:"Stacheln",       v:[.25,.4,.6],   d:v => `Wer sie angreift, bekommt ${pct(v)} des Schadens zurück.` },
  dodge:     { n:"Ausweichen",     v:[.18,.26,.35], d:v => `${pct(v)} Chance, einem Angriff auszuweichen.` },
  rage:      { n:"Wut",            v:[.07,.1,.14],  d:v => `Wird mit jedem eigenen Angriff ${pct(v)} stärker.` },
  burn:      { n:"Plasmabrand",    v:[.35,.5,.7],   d:v => `Setzt zu Kampfbeginn alle Gegner 4 Runden lang in Brand (${pct(v)} des Angriffs pro Runde).` },
  luck:      { n:"Goldnase",       v:[.15,.25,.4],  d:v => `Nach jedem Sieg ${pct(v)} mehr Münzen.` },
  wisdom:    { n:"Weisheit",       v:[.1,.16,.25],  d:v => `Nach jedem Kampf ${pct(v)} mehr EP für Held und Team.` },
  martyr:    { n:"Explosion",      v:[2,3,4.5],     d:v => `Explodiert beim Fallen und trifft alle Gegner (${pct(v)} des Angriffs).` },
  snipe:     { n:"Zielfernrohr",   v:[.25,.4,.6],   d:v => `Greift immer den schwächsten Gegner an und macht ${pct(v)} mehr Schaden.` },
  barrier:   { n:"Bollwerk",       v:[1.8,2.6,3.6], d:v => `Jede 2. Runde bekommt das schwächste Teammitglied einen Schild (${pct(v)} des Angriffs).` },
  shred:     { n:"Säure",          v:[.06,.09,.13], d:v => `Jeder Treffer macht das Ziel dauerhaft ${pct(v)} verwundbarer.` },
  dragon:    { n:"Drachenatem",    v:[1,1.4,1.9],   d:v => `Jede 3. Runde trifft er alle Gegner (${pct(v)} des Angriffs) und setzt sie in Brand.` },
  divine:    { n:"Segen",          v:[.7,1,1.4],    d:v => `Greift nicht an, heilt aber jede Runde das ganze Team (${pct(v)} des Angriffs).` },
  chain:     { n:"Kettenhieb",     v:[.4,.6,.85],   d:v => `Jeder Treffer springt auf einen zweiten Gegner über (${pct(v)} des Schadens).` },
  guard:     { n:"Leibwächter",    v:[.25,.35,.45], d:v => `Fängt ${pct(v)} des Schadens ab, den Teammitglieder abbekommen.` },
  charge:    { n:"Aufladung",      v:[2.5,3.2,4],   d:v => `Jeder 3. Angriff ist aufgeladen und macht das ${String(v).replace(".", ",")}-Fache an Schaden.` },
  berserk:   { n:"Raserei",        v:[.8,1.2,1.7],  d:v => `Je weniger Leben sie hat, desto härter schlägt sie zu (bis zu ${pct(v)} mehr Schaden).` },
  drain:     { n:"Kraftraub",      v:[.05,.07,.1],  d:v => `Jeder Treffer schwächt das Ziel: Es macht ${pct(v)} weniger Schaden (stapelbar).` },
  mark:      { n:"Zielmarkierung", v:[.15,.22,.3],  d:v => `Markiert ihr Ziel. Das ganze Team macht ${pct(v)} mehr Schaden gegen markierte Gegner.` },
  counter:   { n:"Konter",         v:[.35,.45,.6],  d:v => `${pct(v)} Chance, sofort zurückzuschlagen, wenn er angegriffen wird.` },
  laststand: { n:"Letztes Gefecht",v:[.5,.7,.9],    d:v => `Fällt er unter 30 % Leben, bekommt er einmal einen Schild von ${pct(v)} seiner Lebenspunkte.` },
  timebomb:  { n:"Zeitzünder",     v:[3,4,5.5],     d:v => `In Runde 4 explodiert die Ladung und trifft alle Gegner (${pct(v)} des Angriffs).` }
};

// Karten: lv = ab welchem Heldenlevel sie freigeschaltet wird. Seltenheit ergibt sich aus diesem Level.
const COMP = [
  { id:"kiesel",  lv:1,  role:"tank",     ab:"taunt",     f:[["Kieselgolem","🪨"],["Felsgolem","🗿"],["Monolith","🏛️"]] },
  { id:"funkel",  lv:1,  role:"schuetze", ab:"crit",      f:[["Funkelkäfer","🐞"],["Leuchtkäfer","🪲"],["Sternkäfer","🌟"]] },
  { id:"sani",    lv:1,  role:"heiler",   ab:"heal",      f:[["Sanibot","🤖"],["Medibot","🩺"],["Lebensbaum","🌳"]] },

const CW = 84, BGAP = 30, RH = 104, PADX = 30, PADY = 70;
const TREE = [], TN = {};
(function buildTree() {
  const root = { id:"root", root:true, x:0, y:PADY, parents:[], icon:"🧑‍🚀", n:"Mondkurier" };
  TREE.push(root); TN.root = root;
  TREE_DEF.forEach((br, bi) => {
    const laneX = l => PADX + (bi * 3 + l) * CW + bi * BGAP + CW / 2;
    const lastInLane = [null, null, null];
    br.rows.forEach((row, ri) => {
      const r = ri + 1, prevMid = ri === 0 ? "root" : `${br.k}${ri}m`;
      row.forEach(([lane, icon, n, key, v, flag]) => {
        const id = `${br.k}${r}${"lmr"[lane]}`;
        const parents = lane === 1 ? [prevMid] : [prevMid].concat(lastInLane[lane] ? [lastInLane[lane]] : []);
        const node = { id, b:br.k, bc:br.c, lane, row:r, icon, n, key, v, flag:!!flag, cost:1 + Math.floor(r / 3) + (flag ? 2 : 0),
          parents, x:laneX(lane), y:PADY + 40 + r * RH };
        TREE.push(node); TN[id] = node; lastInLane[lane] = id;
      });
    });
    br.x = laneX(1);
  });
  const W = PADX * 2 + 12 * CW + 3 * BGAP;
  root.x = W / 2;
  TREE.W = W; TREE.H = PADY + 40 + 15 * RH;
})();
const treeTotal = () => TREE.reduce((a, n) => a + (n.cost || 0), 0);

    COMP.filter(c => c.lv === S.lv && !S.cards[c.id]).forEach(c => {
      S.cards[c.id] = { l:newCardLv(), xp:0, st:0 }; out.cards.push(c.id);
      if (S.team.length < slotsAt(S.lv)) S.team.push(c.id);
    });
  }
  if (S.lv >= MAX_LV) S.xp = 0;
  if (out.lv.length) Object.keys(S.cards).forEach(id => addCardXP(id, 0));
  return out;
}
function teamBonus(k) {
  const T = treeFx();
  return S.team.slice(0, slotsAt(S.lv)).reduce((a, id) => { const c = S.cards[id]; return a + (c && CC[id].ab === k ? abVal(k, c.st, T) : 0); }, 0);
}
function grantRewards(win, s) {
  const E = recLv(s), boss = isBoss(s), T = treeFx(), wis = teamBonus("wisdom"), luck = teamBonus("luck");
  let base = 12 * Math.pow(1.1, E - 1) * (boss ? 3 * (1 + T.bossXp) : 1);
  if (!win) base *= .3 * (1 + T.lossXp);
  const hx = Math.round(base * (1 + T.xp + wis));
  const cx = Math.round(base * .8 * (1 + T.cardXp + wis));
  const first = win && s > S.prog;
  const co = win ? Math.round(9 * Math.pow(1.09, E - 1) * (boss ? 3 : 1) * (first ? 2 * (1 + T.firstCo) : 1) * (1 + T.coins + luck)) : 0;
  S.co += co;
  let bossPts = 0;
  if (win) { S.stats.wins++; if (first) { S.prog = s; if (boss) { bossPts = BOSS_PTS; S.sp += bossPts; } } } else S.stats.losses++;
  const team = S.team.slice(0, slotsAt(S.lv)).filter(id => S.cards[id]);
  const cards = team.map(id => { const c = S.cards[id], from = c.l; addCardXP(id, cx); return { id, from, to:c.l }; });
  if (T.mentor) Object.keys(S.cards).filter(id => !team.includes(id)).forEach(id => addCardXP(id, Math.round(cx * T.mentor)));
  const hero = addHeroXP(hx);
  cards.forEach(c => c.to = S.cards[c.id].l);
  save();
  return { win, s, hx, cx, co, first, hero, cards, bossPts };
}

// Siegchance per Probekämpfen schätzen (zwischengespeichert, solange sich das Team nicht ändert)
const oddsCache = {};
function winChance(s) {
  const key = [s, S.lv, Object.keys(S.tree).sort().join(""), S.team.slice(0, slotsAt(S.lv)).map(id => id + S.cards[id].l + "." + S.cards[id].st).join(",")].join("|");
  if (oddsCache[key] == null) {
    let w = 0; const n = 30, T = treeFx();
    for (let i = 0; i < n; i++) if (simulate(buildTeam(), makeWave(s), T).win) w++;
    oddsCache[key] = w / n;
  }
  return oddsCache[key];
}
function chanceHTML(s) {
  const c = winChance(s), p = Math.round(c * 100) + " %";
  if (c >= .8) return `<span class="chance easy">${p} · Leicht</span>`;
  if (c >= .4) return `<span class="chance even">${p} · Knapp</span>`;
  return `<span class="chance hard">${p} · Zu schwer</span>`;
}
function farmStage() {
  for (let s = S.prog; s >= 1; s--) if (winChance(s) >= .8) return s;
  return S.prog >= 1 ? 1 : 0;
}

const say = html => { const l = $("#bLog"); if (l) l.innerHTML = `<span>${html}</span>`; };

// Ein Ereignis anzeigen; gibt die Wartezeit in ms zurück
function applyEv(e, quiet) {
  const U = B.units, nm = id => U[id] ? U[id].n : "";
  switch (e.t) {
    case "round": $("#bRound").textContent = `Runde ${e.n}`; return 150;
    case "en": { const b = $("#en" + e.u); if (b) { b.querySelector("i").style.width = e.v + "%"; b.classList.toggle("full", e.v >= 100); } return 0; }
    case "ult": if (quiet) return 0; {
        const bw = $(".bwrap"); bw.classList.remove("ultflash"); void bw.offsetWidth; bw.classList.add("ultflash");
        const nmEl = document.createElement("div"); nmEl.className = "ultname"; nmEl.textContent = e.msg + "!"; $("#fx").appendChild(nmEl); setTimeout(() => nmEl.remove(), 1100);
        say(`<b>Mondkurier</b> entfesselt <b>${e.msg}</b>!`); return 900; }
    case "act": if (!quiet) { document.querySelectorAll(".unit.act").forEach(x => x.classList.remove("act")); const el = $("#u" + e.u); if (el) el.classList.add("act"); } return 40;
    case "hit": setHP(e.u, e.hp, e.sh); if (!quiet) {

        floatAt(e.u, (e.crit ? "Krit! " : "") + e.v, e.crit ? "crit" : "dmg"); flash(e.u, "hurt"); burst(e.u, e.crit ? "crit" : "");
        if (e.guard) say(`${nm(e.u)} fängt ${e.v} Schaden ab`);
        else if (!e.aoe) say(e.thorns ? `${nm(e.u)} sticht sich an ${nm(e.a)}: ${e.v} Schaden` : `${nm(e.a)} trifft ${nm(e.u)}: <b>${e.v}</b> Schaden${e.crit ? " (kritisch)" : ""}`); }
      return e.aoe ? 110 : e.thorns || e.guard ? 150 : 340;
    case "miss": if (!quiet) { floatAt(e.u, "ausgewichen", "miss"); if (!e.aoe) say(`${nm(e.u)} weicht ${nm(e.a)} aus`); } return e.aoe ? 110 : 260;
    case "heal": setHP(e.u, e.hp, e.sh); if (!quiet) { floatAt(e.u, "+" + e.v, "heal"); burst(e.u, "heal"); if (e.a && e.a !== e.u) say(`${nm(e.a)} heilt ${nm(e.u)} um ${e.v}`); } return 200;
    case "sh": setHP(e.u, e.hp, e.sh); if (!quiet) floatAt(e.u, "Schild " + e.v, "sh"); return 110;
    case "dot": setHP(e.u, e.hp, e.sh); if (!quiet) { floatAt(e.u, "Gift " + e.v, "dot"); say(`${nm(e.u)} leidet unter Gift oder Brand: ${e.v}`); } return 170;
    case "stun": { const s = $("#st" + e.u); if (s) s.textContent = "❄"; if (!quiet) floatAt(e.u, "eingefroren", "info"); return 140; }
    case "frozen": { const s = $("#st" + e.u); if (s) s.textContent = ""; if (!quiet) { floatAt(e.u, "setzt aus", "miss"); say(`${nm(e.u)} ist eingefroren und setzt aus`); } return 240; }
    case "skill": if (quiet) return 0; say(`<b>${nm(e.a)}</b> setzt <b>${e.msg}</b> ein`); return e.quiet ? 160 : 650;
    case "die": { const el = $("#u" + e.u); if (el) el.classList.add("dead"); const s = $("#st" + e.u); if (s) s.textContent = ""; setHP(e.u, 0, 0); if (!quiet) say(`${nm(e.u)} ist besiegt`); return 320; }
    case "revive": case "save": { const el = $("#u" + e.u); if (el) { el.classList.remove("dead"); if (!quiet) flash(e.u, "revive"); } setHP(e.u, e.hp, e.sh); if (!quiet) say(`<b>${e.msg}</b>`); return 750; }
    case "banner": if (!quiet) say(`<b>${e.msg}</b>`); return 600;
  }
  return 0;
}

  }).join("");
  const newCards = R.hero.cards.map(id => { const d = CC[id];
    return `<div class="drop r-${d.r}"><div class="dm">Neue Karte freigeschaltet!</div><div class="de">${d.f[0][1]}</div><div class="dn">${d.f[0][0]}</div>
      <div class="dm"><span class="rar">${RAR[d.r].n}</span> · ${ROLES[d.role].n} · ${AB[d.ab].n} · startet auf Level ${S.cards[id].l}${S.team.includes(id) ? " · schon im Team" : ""}</div></div>`; }).join("");
  const nextOpen = R.win && R.s < 50 && R.s === S.prog;
  const loseMsg = B.res.timeout ? "Nach 30 Runden ist die Zeit abgelaufen. Dein Team macht noch zu wenig Schaden." : "Dein Team ist gefallen.";
  modal(`<div class="result-head ${R.win ? "win" : "lose"}"><h2>${R.win ? "Sieg!" : "Niederlage"}</h2>
      <p>${R.win ? (R.first ? "Neue Etappe geschafft! Dafür gibt es extra Münzen." : `Gewonnen in ${B.res.rounds} Runden.`) : `${loseMsg} Du bekommst trotzdem ein paar EP.`}</p></div>
    <div class="gains"><span class="x">+${R.hx} EP</span>${R.co ? `<span class="coin">+${R.co}</span>` : ""}${R.bossPts ? `<span class="sp">+${R.bossPts}</span>` : ""}</div>
    <div>${bar(mx ? 1 : S.xp, mx ? 1 : n)}<div class="xptext" style="text-align:center;margin-top:4px">Hauptkarte Level ${S.lv} · ${mx ? "Maximum" : `${S.xp} / ${n} EP bis Level ${S.lv + 1}`}</div></div>
    ${lvUp ? `<div class="lvup"><b>Level ${S.lv} erreicht!</b><span>+${R.hero.pts} Sternenpunkte für den Baum · mehr Leben und Angriff</span>
      ${R.hero.abs.map(a => `<span>Neue Fähigkeit der Hauptkarte: ${a}</span>`).join("")}${R.hero.slots.length ? "<span>Ein neuer Platz im Team ist frei</span>" : ""}</div>` : ""}
    ${newCards}
    ${cardLines ? `<div class="label" style="margin:0">Deine Karten · je +${R.cx} EP</div>${cardLines}` : ""}
    ${auto ? `<div class="autoline" id="autoLine">Nächster Kampf startet gleich …</div>` : ""}
    ${lvUp && !auto ? `<button class="btn green wide" data-act="toTree">Sternenpunkte im Baum ausgeben</button>` : ""}
    ${nextOpen && !auto ? `<button class="btn big" data-act="again" data-s="${R.s + 1}">Weiter zu Etappe ${stageNo(R.s + 1)}</button>` : ""}
    <div class="row">
      <button class="btn ghost" data-act="leave">Zum Start</button>
      <button class="btn ${nextOpen && !auto ? "ghost" : ""}" data-act="again" data-s="${R.s}">${auto ? "Sofort weiter" : R.win ? "Nochmal" : "Erneut versuchen"}</button>
    </div>
    ${auto ? `<button class="btn ghost sm" data-act="autoOff">Automatisch wiederholen stoppen</button>` : ""}`);
  if (auto) B.autoT = setTimeout(() => { if (B && B.done && S.auto) { modal(""); startBattle(R.s); } }, 2200);
  if (!R.win && S.auto) { S.auto = false; save(); }
}
function leaveBattle() {
  if (B) { clearTimeout(B.timer); clearTimeout(B.autoT); }
  B = null; modal("");
  $("#battle").hidden = true; $("#battle").innerHTML = "";
  render();
}

/* =========================================================
   EINGABE
   ========================================================= */
function act(el, ev) {
  const a = el.dataset.act, id = el.dataset.id;
  switch (a) {
    case "tab": UI.tab = el.dataset.k; modal(""); render(); $("#main").scrollTop = 0; break;
    case "heroInfo": UI.tab = "hero"; modal(""); render(); break;
    case "eqUp": {
      const k = el.dataset.k, l = S.eq[k], cost = eqCost(l);
      if (l >= S.lv || S.co < cost) return;
      S.co -= cost; S.eq[k] = l + 1; save();
      const e = EQUIP.find(x => x.k === k), sc = $("#main").scrollTop; render(); $("#main").scrollTop = sc;
      if (eqTier(l + 1) > eqTier(l)) toast(`Neues Aussehen: ${e.tiers[eqTier(l + 1)]}`);
      break;
    }
    case "card": cardModal(id); break;
    case "pick": pickModal(); break;
    case "putIn": if (S.team.length < slotsAt(S.lv) && !S.team.includes(id)) { S.team.push(id); save(); } modal(""); render(); break;
    case "close": modal(""); break;
    case "closeBg": if (ev.target === el && !B) modal(""); break;
    case "toggleTeam": {
      const i = S.team.indexOf(id);
      if (i >= 0) S.team.splice(i, 1); else if (S.team.length < slotsAt(S.lv)) S.team.push(id);
      save(); render(); cardModal(id); break;
    }
    case "train": {
      const c = S.cards[id], cost = trainCost(c);
      if (c.l >= cardCap(c) || S.co < cost) return;
      S.co -= cost; addCardXP(id, cardNeed(c.l) - c.xp); save(); render(); cardModal(id);
      toast(`${form(id, c.st)[0]} ist jetzt Level ${c.l}`); break;
    }
    case "evolve": {
      const c = S.cards[id], cost = evoCost(id, c.st + 1);
      if (c.st >= 2 || c.l < STAGE_CAP[c.st] || S.co < cost) return;
      S.co -= cost; c.st++; addCardXP(id, 0); save(); render(); cardModal(id);
      toast(`Entwickelt: ${form(id, c.st)[1]} ${form(id, c.st)[0]}`); break;
    }
    case "zone": { const z = +el.dataset.z; if (z > 0 && S.prog < z * 10) { toast(`Besiege zuerst den Boss von Zone ${z}.`); return; } S.zone = z; save(); render(); break; }
    case "fight": startBattle(+el.dataset.s); break;
    case "noop": toast("Schaffe zuerst die Etappe davor."); break;
    case "auto": S.auto = !S.auto; save(); render(); break;
    case "speed": UI.speed = +el.dataset.x; document.querySelectorAll(".speeds [data-x]").forEach(b => b.classList.toggle("on", +b.dataset.x === UI.speed)); break;
    case "skip": skipBattle(); break;
    case "again": { const s = +el.dataset.s; if (B) clearTimeout(B.autoT); modal(""); S.zone = zoneOf(s); startBattle(s); break; }
    case "autoOff": { S.auto = false; save(); if (B) clearTimeout(B.autoT); const l = $("#autoLine"); if (l) l.textContent = "Automatisch wiederholen ist aus."; el.hidden = true; break; }
    case "leave": UI.tab = "home"; leaveBattle(); break;
    case "toTree": UI.tab = "tree"; UI.treeScroll = null; leaveBattle(); break;
    case "node": nodeModal(id); break;
    case "buyNode": {
      const n = TN[id]; if (!nodeOpen(n) || S.sp < n.cost) return;
      S.sp -= n.cost; S.tree[id] = 1; save(); modal(""); render();
      toast(`${n.icon} ${n.n} freigeschaltet`); break;
    }
    case "jump": {
      const w = $("#treeWrap"), br = TREE_DEF[+el.dataset.i];
      if (w) w.scrollTo({ left:Math.max(0, br.x * UI.zoom - w.clientWidth / 2), top:0, behavior:"smooth" }); break;
    }
    case "zoom": {
      const w = $("#treeWrap"), old = UI.zoom, cx = w ? (w.scrollLeft + w.clientWidth / 2) / old : TREE.W / 2;
      UI.zoom = old < 1 ? 1 : .55; UI.treeScroll = null; render();
      const w2 = $("#treeWrap"); if (w2) w2.scrollLeft = Math.max(0, cx * UI.zoom - w2.clientWidth / 2); break;
    }
    case "treeReset": {
      const p = resetPrice(); if (S.co < p) { toast(`Dafür brauchst du ${p} Münzen.`); return; }
      modal(`<h2>Baum zurücksetzen?</h2><p>Du bekommst alle ausgegebenen Sternenpunkte zurück und kannst sie neu verteilen. Das kostet ${p} Münzen.</p>
        <div class="row"><button class="btn ghost" data-act="close">Abbrechen</button><button class="btn" data-act="treeResetOk">Zurücksetzen</button></div>`); break;
    }
    case "treeResetOk": {
      const p = resetPrice(); if (S.co < p) return;
      S.co -= p; Object.keys(S.tree).forEach(k => { S.sp += TN[k] ? TN[k].cost : 0; }); S.tree = {}; save(); modal(""); render(); break;
    }
    case "help": helpModal(); break;
    case "resetAsk":
      modal(`<h2>Neu starten?</h2><p>Level, Karten, Baum und Münzen gehen verloren. Das lässt sich nicht rückgängig machen.</p>
        <div class="row"><button class="btn ghost" data-act="close">Abbrechen</button><button class="btn danger" data-act="reset">Alles löschen</button></div>`); break;
    case "reset": S = defSave(); S.seen = true; save(); modal(""); UI.tab = "home"; render(); toast("Neues Spiel gestartet"); break;
  }
}
document.addEventListener("click", ev => { const el = ev.target.closest("[data-act]"); if (el) act(el, ev); });

/* =========================================================
   START
   ========================================================= */
function start(data) {
  S = (data && data.S && data.S.v === 3) ? data.S : load();
  render();
  if (!S.seen) { S.seen = true; save(); helpModal(); }
}
window.claude?.hot?.snapshot?.(() => ({ S }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
</body>
</html>
