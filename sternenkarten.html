<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Sternenkarten</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-sized column — status bar, scrolling screen, tab bar; battle takes over the whole column. */
:root {
  --night: #0c0f22;      /* deep lunar night, page ground */
  --deck: #161a35;       /* raised panels */
  --deck-2: #20254a;     /* inputs, chips */
  --line: #2f3566;       /* hairlines */
  --moon: #ece8d9;       /* moon-silver text */
  --dim: #9a9cba;        /* secondary text */
  --gold: #f2c14e;       /* lunar gold accent (coins, buttons) */
  --gold-ink: #1b1606;
  --hp: #ff5d6c;
  --shield: #6ecbff;
  --venom: #7bd88f;
  --power: #c99bff;
  --r-c: #9aa3b8;  /* Gewöhnlich */
  --r-r: #4fb3ff;  /* Selten */
  --r-e: #b77bff;  /* Episch */
  --r-l: #ffb347;  /* Legendär */
  --f-display: "Chakra Petch", "Trebuchet MS", system-ui, sans-serif;
  --f-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--night);
  color: var(--moon);
  font-family: var(--f-body);
  font-size: 15px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
}
body::after {
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background-image:
    radial-gradient(1px 1px at 12% 18%, var(--moon) 50%, transparent 51%),
    radial-gradient(1px 1px at 72% 9%, var(--moon) 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 41% 63%, var(--dim) 50%, transparent 51%),
    radial-gradient(1px 1px at 88% 47%, var(--moon) 50%, transparent 51%),
    radial-gradient(1px 1px at 23% 86%, var(--dim) 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 63% 92%, var(--moon) 50%, transparent 51%),
    radial-gradient(1px 1px at 5% 52%, var(--moon) 50%, transparent 51%),
    radial-gradient(1px 1px at 95% 75%, var(--dim) 50%, transparent 51%);
  opacity: .5;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, [data-act]:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; letter-spacing: .02em; }

#app {
  position: relative; z-index: 1;
  max-width: 520px; height: 100%; margin: 0 auto;
  display: flex; flex-direction: column;
}

/* ---------- top status bar ---------- */
#top {
  display: flex; align-items: center; gap: 10px;
  padding-block: 10px 8px;
}
.lvl-badge {
  font-family: var(--f-display); font-weight: 700; font-size: 13px;
  background: var(--gold); color: var(--gold-ink);
  padding: 3px 8px; border-radius: 6px; white-space: nowrap;
}
.xpwrap { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.xpbar { height: 7px; background: var(--deck-2); border-radius: 4px; overflow: hidden; }
.xpbar i { display: block; height: 100%; background: linear-gradient(90deg, var(--r-r), var(--power)); border-radius: 4px; transition: width .6s ease; }
.xptext { font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums; }
.res { display: flex; gap: 10px; font-weight: 700; font-variant-numeric: tabular-nums; font-size: 14px; }
.coin::before { content: ""; display: inline-block; width: .8em; height: .8em; border-radius: 50%; background: var(--gold); box-shadow: inset -2px -2px 0 rgba(0,0,0,.25); margin-right: 4px; vertical-align: -1px; }
.pts { color: var(--power); }
.pts::before { content: "✦"; margin-right: 3px; }

/* ---------- main scroller ---------- */
#main { flex: 1; overflow-y: auto; overflow-x: hidden; padding-block: 4px 16px; -webkit-overflow-scrolling: touch; }
.screen-title { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin: 6px 0 12px; }
.screen-title h2 { font-size: 22px; }
.screen-title small { color: var(--dim); font-size: 13px; }
.section-label { font-family: var(--f-display); text-transform: uppercase; letter-spacing: .12em; font-size: 11px; color: var(--dim); margin: 18px 0 8px; }

/* ---------- bottom nav ---------- */
#nav {
  display: grid; grid-template-columns: repeat(5, 1fr);
  border-top: 1px solid var(--line);
  padding-block: 6px 6px;
}
#nav button {
  background: none; border: 0; padding: 4px 0;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  color: var(--dim); font-size: 11px; font-weight: 600;
}
#nav button svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
#nav button.on { color: var(--gold); }
#nav .dot { position: relative; }
#nav .dot::after { content: ""; position: absolute; top: -1px; right: -4px; width: 7px; height: 7px; border-radius: 50%; background: var(--hp); }

/* ---------- generic ---------- */
.btn {
  border: 0; border-radius: 10px; padding: 11px 16px; font-weight: 700;
  background: var(--gold); color: var(--gold-ink); font-family: var(--f-display); letter-spacing: .03em;
  transition: transform .12s ease, opacity .2s;
}
.btn:active { transform: scale(.96); }
.btn.ghost { background: var(--deck-2); color: var(--moon); }
.btn.danger { background: var(--hp); color: var(--night); }
.btn[disabled] { opacity: .4; pointer-events: none; }
.btn.sm { padding: 7px 11px; font-size: 13px; border-radius: 8px; }
.panel { background: var(--deck); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { background: var(--deck-2); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; color: var(--dim); }
.chip.on { background: var(--moon); color: var(--night); border-color: var(--moon); }

/* ---------- zones ---------- */
.zones { display: flex; flex-direction: column; gap: 12px; }
.zone { position: relative; overflow: hidden; border-radius: 16px; border: 1px solid var(--line); padding: 14px; background: var(--deck); }
.zone::before { content: ""; position: absolute; inset: 0; background: var(--zbg); opacity: .55; pointer-events: none; }
.zone > * { position: relative; }
.zone-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.zone h3 { font-size: 19px; }
.zone .zsub { color: var(--dim); font-size: 13px; margin-top: 2px; }
.zone .ztag { font-family: var(--f-display); font-size: 12px; padding: 3px 8px; border-radius: 6px; background: var(--deck-2); white-space: nowrap; }
.zone.locked { filter: saturate(.3); }
.zone.locked .zlock { margin-top: 10px; color: var(--dim); font-size: 13px; }
.foes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
.foe {
  background: color-mix(in srgb, var(--night) 70%, transparent); border: 1px solid var(--line); border-radius: 12px;
  padding: 8px 4px; display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center;
}
.foe .fe { font-size: 30px; line-height: 1.1; }
.foe .fn { font-size: 12px; font-weight: 600; line-height: 1.15; }
.foe .fs { font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums; }
.bossrow { margin-top: 8px; display: flex; align-items: center; gap: 10px; background: color-mix(in srgb, var(--night) 70%, transparent); border: 1px solid var(--r-l); border-radius: 12px; padding: 8px 10px; }
.bossrow.closed { border-color: var(--line); }
.bossrow .fe { font-size: 34px; }
.bossrow .bi { flex: 1; min-width: 0; }
.bossrow .bn { font-weight: 700; font-family: var(--f-display); }
.bossrow .bs { font-size: 12px; color: var(--dim); }
.progress-pips { display: flex; gap: 4px; margin-top: 4px; }
.progress-pips i { width: 18px; height: 5px; border-radius: 3px; background: var(--deck-2); }
.progress-pips i.on { background: var(--gold); }

/* ---------- cards ---------- */
.card {
  --rc: var(--r-c);
  position: relative; display: flex; flex-direction: column; align-items: stretch;
  background: linear-gradient(170deg, var(--deck-2), var(--deck) 60%);
  border: 2px solid var(--rc); border-radius: 12px; padding: 6px 6px 7px;
  text-align: center; color: var(--moon); font-family: var(--f-body);
}
.card.r-r { --rc: var(--r-r); } .card.r-e { --rc: var(--r-e); } .card.r-l { --rc: var(--r-l); }
.card.r-l { box-shadow: 0 0 14px color-mix(in srgb, var(--r-l) 35%, transparent); }
.card .cost {
  position: absolute; top: -8px; left: -8px; width: 26px; height: 26px; border-radius: 50%;
  background: var(--gold); color: var(--gold-ink); font-family: var(--f-display); font-weight: 700; font-size: 15px;
  display: grid; place-items: center; border: 2px solid var(--night);
}
.card .art { font-size: 30px; line-height: 1.2; margin-top: 2px; }
.card .cname { font-family: var(--f-display); font-weight: 700; font-size: 12.5px; line-height: 1.1; margin-top: 2px; }
.card .lv { color: var(--venom); margin-left: 2px; }
.card .ctype { font-size: 9.5px; text-transform: uppercase; letter-spacing: .1em; color: var(--rc); margin: 3px 0 4px; font-weight: 700; }
.card .cdesc { font-size: 11px; line-height: 1.25; color: var(--moon); opacity: .9; }
.card.t-K .art { filter: drop-shadow(0 0 6px var(--power)); }
.card.locked { --rc: var(--line); background: var(--deck); }
.card.locked .art { filter: grayscale(1) brightness(.4); }
.card.locked .cname, .card.locked .cdesc { color: var(--dim); }
.card .indeck { position: absolute; top: 4px; right: 5px; font-size: 10px; font-weight: 700; color: var(--venom); }
.card .junk-x { color: var(--dim); }

.cardgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px 10px; padding-top: 8px; }
.cardgrid .card { min-height: 150px; }

/* ---------- modal ---------- */
.modal-bg {
  position: fixed; inset: 0; z-index: 50; background: color-mix(in srgb, var(--night) 82%, transparent);
  display: flex; align-items: center; justify-content: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  animation: fade .2s ease;
}
.modal { width: 100%; max-width: 420px; max-height: 100%; overflow-y: auto; background: var(--deck); border: 1px solid var(--line); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.modal h2 { font-size: 21px; }
.modal p { margin: 0; color: var(--dim); line-height: 1.45; }
.modal .row { display: flex; gap: 8px; flex-wrap: wrap; }
.modal .row .btn { flex: 1; }
.bigcard { width: 160px; margin: 6px auto 0; }
.bigcard .art { font-size: 52px; }
.bigcard .cname { font-size: 16px; }
.bigcard .cdesc { font-size: 13px; }
.lvdots { display: flex; justify-content: center; gap: 6px; }
.lvdots i { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--venom); }
.lvdots i.on { background: var(--venom); }
.next { background: var(--deck-2); border-radius: 10px; padding: 10px; font-size: 13px; line-height: 1.4; }
.next b { color: var(--venom); }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }

/* ---------- shop ---------- */
.shopgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 12px; padding-top: 8px; }
.offer { display: flex; flex-direction: column; gap: 8px; }
.offer .card { min-height: 150px; }
.price { width: 100%; }
.pack { display: flex; align-items: center; gap: 14px; }
.pack .packart {
  width: 64px; height: 86px; border-radius: 10px; flex: none;
  background: linear-gradient(150deg, var(--r-e), var(--r-r) 60%, var(--night));
  display: grid; place-items: center; font-size: 28px; border: 2px solid var(--moon);
}
.pack .pi { flex: 1; min-width: 0; }
.pack .pi h3 { font-size: 16px; }
.pack .pi p { margin: 2px 0 8px; color: var(--dim); font-size: 13px; }
.relic { display: flex; align-items: center; gap: 12px; padding-block: 10px; border-bottom: 1px solid var(--line); }
.relic:last-child { border-bottom: 0; }
.relic .re { font-size: 28px; width: 40px; text-align: center; flex: none; }
.relic .ri { flex: 1; min-width: 0; }
.relic .rn { font-weight: 700; }
.relic .rd { font-size: 13px; color: var(--dim); }
.relic.missing .re { filter: grayscale(1) brightness(.5); }

/* ---------- achievements ---------- */
.achs { display: flex; flex-direction: column; gap: 8px; }
.ach { display: flex; gap: 12px; align-items: center; background: var(--deck); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.ach .am { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--deck-2); color: var(--dim); font-size: 16px; flex: none; }
.ach.done { border-color: color-mix(in srgb, var(--gold) 50%, var(--line)); }
.ach.done .am { background: var(--gold); color: var(--gold-ink); }
.ach .ai { flex: 1; min-width: 0; }
.ach .an { font-weight: 700; }
.ach .ad { font-size: 13px; color: var(--dim); }
.ach .ar { font-size: 12px; font-weight: 700; text-align: right; white-space: nowrap; }

/* ---------- hero ---------- */
.hero { display: flex; flex-direction: column; align-items: center; gap: 6px; padding-block: 8px 4px; text-align: center; }
.moonface {
  width: 120px; height: 120px; border-radius: 50%; position: relative;
  background: radial-gradient(circle at 35% 30%, var(--moon), #b9b39e 55%, #6f6a5b);
  box-shadow: 0 0 40px color-mix(in srgb, var(--moon) 30%, transparent);
  display: grid; place-items: center; font-size: 56px;
}
.moonface::before, .moonface::after { content: ""; position: absolute; border-radius: 50%; background: rgba(0,0,0,.12); }
.moonface::before { width: 22px; height: 22px; top: 18px; right: 22px; }
.moonface::after { width: 14px; height: 14px; bottom: 20px; left: 24px; }
.hero h2 { font-size: 24px; margin-top: 6px; }
.hero .hl { color: var(--dim); font-size: 14px; }
.statgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 14px; }
.stat { background: var(--deck); border: 1px solid var(--line); border-radius: 12px; padding: 10px 6px; text-align: center; }
.stat b { display: block; font-family: var(--f-display); font-size: 20px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: .08em; }

/* ---------- battle ---------- */
#battle { position: fixed; inset: 0; z-index: 20; background: var(--night); display: flex; justify-content: center;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }
#battle::before { content: ""; position: absolute; inset: 0; background: var(--zbg); opacity: .5; pointer-events: none; }
.bwrap { position: relative; width: 100%; max-width: 520px; height: 100%; display: flex; flex-direction: column; }
.b-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-block: 8px; font-size: 12px; color: var(--dim); }
.b-top .bz { font-family: var(--f-display); text-transform: uppercase; letter-spacing: .1em; }
.b-enemy { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }
.intent {
  display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; font-weight: 700; font-size: 14px;
  background: var(--deck); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px;
}
.i-atk { color: var(--hp); } .i-blk { color: var(--shield); } .i-buf { color: var(--gold); } .i-deb { color: var(--power); } .i-heal { color: var(--venom); } .i-junk { color: var(--dim); }
.sprite { font-size: 92px; line-height: 1; filter: drop-shadow(0 8px 18px rgba(0,0,0,.5)); transition: transform .15s; }
.sprite.boss { font-size: 112px; }
.sprite.hit { animation: shake .35s; }
.sprite.lunge { animation: lunge .35s; }
.sprite.dead { animation: die .7s forwards; }
@keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-10px) rotate(-4deg); } 40% { transform: translateX(9px) rotate(3deg); } 60% { transform: translateX(-6px); } 80% { transform: translateX(4px); } }
@keyframes lunge { 50% { transform: translateY(26px) scale(1.12); } }
@keyframes die { to { transform: scale(.2) rotate(40deg); opacity: 0; } }
.ename { font-family: var(--f-display); font-weight: 700; font-size: 18px; display: flex; align-items: center; gap: 8px; }
.ename .bosstag { font-size: 10px; background: var(--r-l); color: var(--night); padding: 2px 6px; border-radius: 4px; letter-spacing: .1em; }
.hpline { width: min(260px, 80%); display: flex; align-items: center; gap: 8px; }
.hpbar { flex: 1; height: 12px; background: var(--deck-2); border-radius: 6px; overflow: hidden; position: relative; }
.hpbar i { display: block; height: 100%; background: var(--hp); transition: width .3s ease; }
.hpnum { font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; min-width: 64px; text-align: right; }
.blk { display: inline-flex; align-items: center; gap: 3px; color: var(--shield); font-weight: 700; font-size: 13px; }
.blk::before { content: "⛨"; }
.statuses { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; min-height: 20px; }
.st { font-size: 12px; font-weight: 700; padding: 2px 7px; border-radius: 999px; background: var(--deck-2); }
.st.str { color: var(--gold); } .st.weak, .st.vuln { color: var(--power); } .st.poison { color: var(--venom); } .st.regen { color: var(--venom); } .st.thorns { color: var(--r-l); } .st.pw { color: var(--power); }
.b-log { text-align: center; font-size: 13px; color: var(--dim); min-height: 20px; padding-block: 2px; }
.b-player { background: var(--deck); border: 1px solid var(--line); border-radius: 14px; padding: 8px 12px; display: flex; flex-direction: column; gap: 6px; }
.b-player .prow { display: flex; align-items: center; gap: 10px; }
.b-player .pname { font-family: var(--f-display); font-weight: 700; font-size: 14px; white-space: nowrap; }
.b-player .hpbar i { background: linear-gradient(90deg, var(--hp), #ff8a7a); }
.b-player.hit { animation: shake .35s; }
.b-hand { display: flex; gap: 8px; overflow-x: auto; overflow-y: visible; padding: 14px 4px 8px; min-height: 172px; align-items: flex-end; scrollbar-width: none; }
.b-hand::-webkit-scrollbar { display: none; }
.b-hand .card { flex: 0 0 96px; min-height: 148px; transition: transform .15s ease, opacity .2s; animation: deal .25s ease backwards; }
.b-hand .card:active { transform: translateY(-8px) scale(1.03); }
.b-hand .card.off { opacity: .45; }
.b-hand .card.off .cost { background: var(--deck-2); color: var(--dim); }
@keyframes deal { from { transform: translateY(40px); opacity: 0; } }
.b-ctrl { display: flex; align-items: center; gap: 10px; padding-block: 4px 10px; }
.energy {
  width: 52px; height: 52px; border-radius: 50%; flex: none;
  background: radial-gradient(circle at 35% 30%, #fff3c4, var(--gold) 55%, #a87c16);
  color: var(--gold-ink); display: grid; place-items: center; font-family: var(--f-display); font-weight: 700; font-size: 18px;
  box-shadow: 0 0 18px color-mix(in srgb, var(--gold) 40%, transparent);
}
.energy.empty { filter: grayscale(.8) brightness(.6); }
.piles { flex: 1; font-size: 12px; color: var(--dim); line-height: 1.4; font-variant-numeric: tabular-nums; }
#fx { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.float { position: absolute; font-family: var(--f-display); font-weight: 700; font-size: 26px; text-shadow: 0 2px 6px rgba(0,0,0,.8); animation: floatup 1s ease-out forwards; transform: translateX(-50%); }
.float.dmg { color: var(--hp); } .float.blk { color: var(--shield); } .float.heal { color: var(--venom); } .float.info { color: var(--gold); font-size: 16px; }
@keyframes floatup { from { opacity: 1; margin-top: 0; } to { opacity: 0; margin-top: -60px; } }
.phase-flash { animation: flash .6s; }
@keyframes flash { 50% { background: color-mix(in srgb, var(--hp) 30%, var(--night)); } }

/* reward */
.reward-xp { display: flex; flex-direction: column; gap: 6px; }
.reward-xp .xpbar { height: 10px; }
.gains { display: flex; gap: 14px; justify-content: center; font-weight: 700; font-size: 17px; font-variant-numeric: tabular-nums; }
.gains .x { color: var(--r-r); }
.lvup { text-align: center; font-family: var(--f-display); font-weight: 700; color: var(--gold); font-size: 18px; animation: pop .5s ease; }
@keyframes pop { 0% { transform: scale(.5); opacity: 0; } 70% { transform: scale(1.15); } }
.choice { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; padding-top: 10px; }
.choice .card { min-height: 150px; animation: flip .5s ease backwards; }
.choice .card:nth-child(2) { animation-delay: .1s; } .choice .card:nth-child(3) { animation-delay: .2s; }
.choice .card.picked { outline: 3px solid var(--gold); outline-offset: 2px; }
@keyframes flip { from { transform: rotateY(90deg); opacity: 0; } }
.dup { font-size: 11px; color: var(--gold); font-weight: 700; margin-top: 4px; }

/* toast */
#toasts { position: fixed; z-index: 80; left: 0; right: 0; top: calc(env(safe-area-inset-top, 0px) + 10px); display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; padding: 0 16px; }
.toast { background: var(--moon); color: var(--night); font-weight: 700; font-size: 14px; padding: 9px 14px; border-radius: 12px; box-shadow: 0 6px 20px rgba(0,0,0,.4); animation: tin .3s ease, tout .3s ease 2.4s forwards; max-width: 420px; text-align: center; }
@keyframes tin { from { transform: translateY(-20px); opacity: 0; } }
@keyframes tout { to { transform: translateY(-20px); opacity: 0; } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; transition-duration: .01ms !important; }
}
@media (max-width: 360px) {
  .cardgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .b-hand .card { flex-basis: 88px; }
}

function defSave() {

    st:{ wins:0, losses:0, maxHit:0, poisonKills:0, perfect:0, fast:0 }, ach:[], shop:null, seen:false };
}
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) { const o = JSON.parse(raw); if (o && o.v === 1) { const d = defSave(); return { ...d, ...o, st:{ ...d.st, ...o.st } }; } }
  } catch (e) {}
  return defSave();
}

const topZone = () => { let z = 0; ZONES.forEach((Z, i) => { if (zoneOpen(i)) z = i; }); return z; };
const val = (c, l, k) => (c[k] || 0) + ((c.up && c.up[k]) || 0) * l;
const costOf = (c, l) => c.c == null ? null : Math.max(0, c.c - (c.upc && l >= c.upc ? 1 : 0));
const upCost = l => l + 1;
const maxHP = () => 60 + (hasRel("helm") ? 10 : 0) + (hasRel("anzug") ? 15 : 0) + (hasRel("herz") ? 25 : 0);

function desc(c, l, dmgFn) {
  if (c.junk) return "Unspielbar. Belegt nur Platz auf der Hand.";
  const v = k => val(c, l, k), o = [];
  if (v("energy")) o.push(`+${v("energy")} Energie`);
  if (v("str")) o.push(`+${v("str")} Stärke`);
  if (c.sp === "cleanse") o.push("Entferne Schwäche, Verwundbar und Gift");
  if (v("block")) o.push(`${v("block")} Schild`);
  if (c.sp === "doubleblock") o.push("Verdopple deinen Schild");
  if (c.sp === "blockdmg") o.push("Schaden in Höhe deines Schilds");
  if (v("dmg")) { const d = dmgFn ? dmgFn(v("dmg")) : v("dmg"), h = v("hits") || 1; o.push(`${d} Schaden${h > 1 ? " ×" + h : ""}`); }
  if (c.sp === "execute") o.push("×3 Schaden, wenn der Gegner unter 30 % HP ist");
  if (c.sp === "lowhp") o.push("×2 Schaden, wenn du unter 50 % HP bist");
  if (c.sp === "lifesteal") o.push("Heile um die Hälfte des Schadens");
  if (v("vuln")) o.push(`${v("vuln")} Verwundbar`);
  if (v("weak")) o.push(`${v("weak")} Schwäche`);
  if (v("poison")) o.push(`${v("poison")} Gift`);
  if (c.sp === "doublepoison") o.push("Verdopple das Gift des Gegners");
  if (v("heal")) o.push(`Heile ${v("heal")}`);
  if (v("regen")) o.push(`${v("regen")} Regeneration`);
  if (v("thorns")) o.push(`${v("thorns")} Dornen`);
  if (v("draw")) o.push(`Ziehe ${v("draw")}`);
  if (c.pw) o.push(PW[c.pw](v("pv")));
  if (c.ex) o.push("Verbraucht");
  return o.join(". ") + ".";
}

function cardHTML(id, l, opt = {}) {
  const c = CM[id];
  if (opt.locked) {
    return `<div class="card locked" ${opt.attrs || ""}><div class="art">${c.e}</div><div class="cname">???</div>
      <div class="ctype">${RAR[c.r].n}</div><div class="cdesc">Noch nicht freigeschaltet</div></div>`;
  }
  const cost = costOf(c, l);
  return `<div class="card r-${c.r} t-${c.t} ${opt.cls || ""}" ${opt.attrs || ""}>
    <div class="cost">${cost == null ? "–" : cost}</div>
    ${opt.deck ? '<div class="indeck">DECK</div>' : ""}
    <div class="art">${c.e}</div>
    <div class="cname">${c.n}${l ? `<span class="lv">+${l}</span>` : ""}</div>
    <div class="ctype">${c.junk ? "Schrott" : TYPE[c.t]}</div>
    <div class="cdesc">${desc(c, l, opt.dmgFn)}</div></div>`;
}

function pickWeighted(w) {
  const tot = Object.values(w).reduce((a, b) => a + b, 0);
  let r = Math.random() * tot;
  for (const k in w) { r -= w[k]; if (r <= 0) return k; }
  return "c";
}
// Zufällige Karte nach Seltenheitsgewichten; onlyNew = nur unbekannte Karten
function pickCard(w, exclude, onlyNew) {
  const ok = c => !exclude.includes(c.id) && (!onlyNew || !(c.id in S.own));
  for (let tries = 0; tries < 12; tries++) {
    const r = pickWeighted(w), pool = CARDS.filter(c => c.r === r && ok(c));
    if (pool.length) return rnd(pool).id;
  }
  const rest = CARDS.filter(c => w[c.r] > 0 && ok(c));
  return rest.length ? rnd(rest).id : null;
}

function toast(html) {
  const t = document.createElement("div");
  t.className = "toast"; t.innerHTML = html;
  $("#toasts").appendChild(t);
  setTimeout(() => t.remove(), 2800);
}
function modal(html) {
  $("#modalRoot").innerHTML = html ? `<div class="modal-bg" data-act="closeBg"><div class="modal" role="dialog">${html}</div></div>` : "";
}

function addXP(amount) {
  const ups = [];
  S.xp += amount;
  while (S.lv < MAX_LV && S.xp >= need(S.lv)) {
    S.xp -= need(S.lv); S.lv++; S.pts += 2; ups.push(S.lv);
  }
  if (S.lv >= MAX_LV) S.xp = Math.min(S.xp, need(S.lv));
  return ups;
}
function unlockCard(id) {
  if (id in S.own) { const d = RAR[CM[id].r].dup; S.co += d; return { dup:d }; }
  S.own[id] = 0;
  if (S.deck.length < DECK_MAX) S.deck.push(id);
  return { dup:0 };
}
function checkAch() {
  let any = true;
  while (any) {
    any = false;
    for (const a of ACH) {
      if (!S.ach.includes(a.id) && a.ok(S)) {
        S.ach.push(a.id); S.co += a.co || 0; S.pts += a.pt || 0; any = true;
        toast(`Erfolg: ${a.n} · +${a.co} Münzen${a.pt ? ` · +${a.pt} ✦` : ""}`);
      }
    }
  }
}
function rollShop() {
  const w = ZONES[topZone()].w, cards = [];
  for (let i = 0; i < 4; i++) { const id = pickCard(w, cards, true); if (id) cards.push(id); }
  const pool = shuffle(RELICS.filter(r => !hasRel(r.id)).map(r => r.id));
  S.shop = { cards, rel: pool.slice(0, 2), sold: [] };
}

function calc(base, att, def) {
  let d = base + (att.str || 0);
  if (att.weak > 0) d *= 0.75;
  if (def.vuln > 0) d *= 1.5;
  return Math.max(0, Math.floor(d));
}
function fx(target, text, cls) {
  const layer = $("#fx"); if (!layer) return;
  const el = target === "e" ? $("#bEnemy .sprite") : $("#bPlayer");
  if (!el) return;
  const r = el.getBoundingClientRect(), lr = layer.getBoundingClientRect();
  const f = document.createElement("div");
  f.className = "float " + cls; f.textContent = text;
  f.style.left = (r.left - lr.left + r.width / 2 + (Math.random() * 40 - 20)) + "px";
  f.style.top = (r.top - lr.top + (target === "e" ? r.height * 0.3 : -10)) + "px";
  layer.appendChild(f); setTimeout(() => f.remove(), 1000);
}
function anim(sel, cls, keep) { if (B && !keep) (B.pend = B.pend || []).push([sel, cls]); const el = $(sel); if (!el) return; el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }

  const L = { str:["▲","Stärke"], weak:["↓","Schwäche"], vuln:["◎","Verwundbar"], poison:["☠","Gift"], regen:["✚","Regeneration"], thorns:["✶","Dornen"] };
  let h = Object.keys(L).filter(k => st[k] > 0).map(k => `<span class="st ${k}" title="${L[k][1]}">${L[k][0]} ${L[k][1]} ${st[k]}</span>`).join("");
  if (powers) h += Object.entries(powers).map(([k, v]) => `<span class="st pw">◆ ${PW_SHORT[k]} ${v}</span>`).join("");
  return h;
}
function intentHTML(it) {
  const o = [];
  if (it.a) o.push(`<span class="i-atk">⚔ ${calc(it.a, B.e.st, B.p.st)}${it.n > 1 ? " ×" + it.n : ""}</span>`);
  if (it.b) o.push(`<span class="i-blk">⛨ ${it.b}</span>`);
  if (it.s) o.push(`<span class="i-buf">▲ +${it.s} Stärke</span>`);
  if (it.h) o.push(`<span class="i-heal">✚ ${it.h}</span>`);
  if (it.weak) o.push(`<span class="i-deb">↓ Schwäche ${it.weak}</span>`);
  if (it.vuln) o.push(`<span class="i-deb">◎ Verwundbar ${it.vuln}</span>`);
  if (it.poison) o.push(`<span class="i-deb">☠ Gift ${it.poison}</span>`);
  if (it.junk) o.push(`<span class="i-junk">🗑 ${it.junk} Schrott</span>`);
  return o.join("");
}
function renderBattle() {
  if (!B) return;
  const e = B.e, p = B.p;
  $("#bInfo").textContent = `${ZONES[B.z].n} · Zug ${B.turn}`;
  $("#bEnemy").innerHTML = `
    <div class="intent" title="Absicht des Gegners">${B.over ? "&nbsp;" : intentHTML(intent())}</div>
    <div class="sprite ${B.E.boss ? "boss" : ""}">${B.E.e}</div>
    <div class="ename">${B.E.n}${B.E.boss ? `<span class="bosstag">BOSS${e.phase === 2 ? " · WUT" : ""}</span>` : ""}</div>
    <div class="hpline">${e.block ? `<span class="blk">${e.block}</span>` : ""}<div class="hpbar"><i style="width:${Math.max(0, e.hp / e.max * 100)}%"></i></div>
      <span class="hpnum">${Math.max(0, e.hp)} / ${e.max}</span></div>
    <div class="statuses">${statusHTML(e.st)}</div>`;
  $("#bPlayer").innerHTML = `
    <div class="prow"><span class="pname">Mondkurier</span>${p.block ? `<span class="blk">${p.block}</span>` : ""}
      <div class="hpbar"><i style="width:${Math.max(0, p.hp / p.max * 100)}%"></i></div><span class="hpnum">${Math.max(0, p.hp)} / ${p.max}</span></div>
    <div class="statuses" style="justify-content:flex-start">${statusHTML(p.st, B.powers)}</div>`;
  const dmgFn = d => calc(d, p.st, e.st);
  $("#bHand").innerHTML = B.hand.map((c, i) => {
    const card = CM[c.id], cost = costOf(card, c.l), off = card.junk || cost > p.energy || B.busy || B.over;
    return cardHTML(c.id, c.l, { cls: off ? "off" : "", dmgFn, attrs:`data-act="play" data-i="${i}" role="button" tabindex="0"` });
  }).join("");
  $("#bEnergy").textContent = `${p.energy}`;
  $("#bEnergy").classList.toggle("empty", p.energy === 0);
  $("#bPiles").innerHTML = `Nachziehstapel ${B.draw.length}<br>Ablage ${B.disc.length}${B.exh.length ? ` · Verbraucht ${B.exh.length}` : ""}`;
  $("#bLog").textContent = B.log;
  $("#endBtn").disabled = B.busy || B.over;
  const pend = B.pend || []; B.pend = [];
  pend.forEach(([sel, cls]) => anim(sel, cls, true));
}
function drawCards(n) {
  for (let k = 0; k < n; k++) {
    if (!B.draw.length) { if (!B.disc.length) break; B.draw = shuffle(B.disc); B.disc = []; }
    if (B.hand.length >= 10) break;
    B.hand.push(B.draw.pop());
  }
}
function heal(n) { const before = B.p.hp; B.p.hp = Math.min(B.p.max, B.p.hp + n); if (B.p.hp > before) fx("p", "+" + (B.p.hp - before), "heal"); }
function damageEnemy(d) {
  const e = B.e, absorbed = Math.min(e.block, d);
  e.block -= absorbed; const lost = d - absorbed; e.hp -= lost;
  if (d > S.st.maxHit) S.st.maxHit = d;
  fx("e", absorbed && !lost ? "⛨" : "-" + d, absorbed && !lost ? "blk" : "dmg");
  anim("#bEnemy .sprite", "hit");
  return lost;
}
function damagePlayer(d) {
  const p = B.p, absorbed = Math.min(p.block, d);
  p.block -= absorbed; const lost = d - absorbed; p.hp -= lost;
  fx("p", lost ? "-" + lost : "⛨ " + absorbed, lost ? "dmg" : "blk");
  if (lost) anim("#bPlayer", "hit");
  return lost;
}
function checkPhase() {
  if (B.E.p2 && B.e.phase === 1 && B.e.hp > 0 && B.e.hp <= B.e.max / 2) {
    B.e.phase = 2; B.e.i = 0; B.log = `${B.E.n} gerät in Wut!`;
    anim("#battle", "phase-flash");
  }
}

function playerTurn() {
  B.turn++;
  const p = B.p;
  p.block = 0;
  if (p.st.poison > 0) {
    p.hp -= p.st.poison; fx("p", "☠ -" + p.st.poison, "dmg"); p.st.poison--;
    if (p.hp <= 0) { renderBattle(); return endBattle(false); }
  }
  if (B.turn === 1 && hasRel("amulett")) p.block += 8;
  p.energy = 3 + (hasRel("batterie") ? 1 : 0) + (B.powers.pEnergy || 0);
  if (B.powers.pStr) p.st.str += B.powers.pStr;
  if (B.powers.pBlock) p.block += B.powers.pBlock;
  drawCards(5 + (B.powers.pDraw || 0) + (hasRel("kompass") ? 1 : 0) + (B.turn === 1 && hasRel("uhr") ? 2 : 0));
  B.busy = false;
  if (B.turn === 1) B.log = "Dein Zug. Tippe Karten an, um sie auszuspielen.";
  else if (!B.log) B.log = "Dein Zug.";
  renderBattle();
}

function playCard(i) {
  if (!B || B.busy || B.over) return;
  const inst = B.hand[i]; if (!inst) return;
  const c = CM[inst.id], l = inst.l, cost = costOf(c, l), p = B.p, e = B.e;
  if (c.junk) { B.log = "Weltraumschrott lässt sich nicht ausspielen."; return renderBattle(); }
  if (cost > p.energy) { B.log = "Nicht genug Energie."; return renderBattle(); }
  p.energy -= cost;
  B.hand.splice(i, 1);
  const v = k => val(c, l, k);
  B.log = `${c.n} ausgespielt.`;

  if (v("energy")) p.energy += v("energy");
  if (v("str")) p.st.str += v("str");
  if (c.sp === "cleanse") { p.st.weak = 0; p.st.vuln = 0; p.st.poison = 0; }
  if (v("block")) { p.block += v("block"); fx("p", "⛨ +" + v("block"), "blk"); }
  if (c.sp === "doubleblock") p.block *= 2;
  let dealt = 0;
  const strike = base => {
    if (e.hp <= 0) return;
    dealt += damageEnemy(calc(base, p.st, e.st));
    if (B.powers.pPoison) e.st.poison += B.powers.pPoison;
  };
  if (c.sp === "blockdmg") strike(p.block);
  if (v("dmg")) {
    const hits = v("hits") || 1;
    for (let h = 0; h < hits; h++) {
      let base = v("dmg");
      if (c.sp === "lowhp" && p.hp < p.max / 2) base *= 2;
      if (c.sp === "execute" && e.hp < e.max * 0.3) base *= 3;
      strike(base);
    }
  }
  if (c.sp === "lifesteal" && dealt > 0) heal(Math.floor(dealt / 2));
  if (v("vuln")) e.st.vuln += v("vuln");
  if (v("weak")) e.st.weak += v("weak");
  if (v("poison")) e.st.poison += v("poison");
  if (c.sp === "doublepoison") e.st.poison *= 2;
  if (v("heal")) heal(v("heal"));
  if (v("regen")) p.st.regen += v("regen");
  if (v("thorns")) p.st.thorns += v("thorns");
  if (c.pw) { B.powers[c.pw] = (B.powers[c.pw] || 0) + v("pv"); }
  if (v("draw")) drawCards(v("draw"));

  if (c.ex || c.t === "K") B.exh.push(inst); else B.disc.push(inst);
  if (e.hp <= 0) { renderBattle(); return endBattle(true); }
  checkPhase();
  renderBattle();
}

function endTurn() {
  if (!B || B.busy || B.over) return;
  B.busy = true;
  const p = B.p;
  B.disc.push(...B.hand); B.hand = [];
  if (p.st.regen > 0) { heal(p.st.regen); p.st.regen--; }
  if (B.powers.pRegen) heal(B.powers.pRegen);
  if (hasRel("kristall")) heal(2);
  if (p.st.weak > 0) p.st.weak--;
  if (p.st.vuln > 0) p.st.vuln--;
  B.log = `${B.E.n} ist am Zug …`;
  renderBattle();
  setTimeout(enemyTurn, 550);
}

function enemyTurn() {
  if (!B || B.over) return;
  const e = B.e, p = B.p, it = intent();
  e.block = 0;
  if (e.st.poison > 0) {
    e.hp -= e.st.poison; fx("e", "☠ -" + e.st.poison, "dmg"); e.st.poison--;
    if (e.hp <= 0) { B.poisonKill = true; renderBattle(); return endBattle(true); }
    checkPhase();
  }
  const parts = [];
  if (it.s) { e.st.str += it.s; parts.push(`wird stärker`); fx("e", "▲ +" + it.s, "info"); }
  if (it.b) { e.block += it.b; parts.push(`errichtet ${it.b} Schild`); }
  if (it.h) { const b = e.hp; e.hp = Math.min(e.max, e.hp + it.h); fx("e", "+" + (e.hp - b), "heal"); parts.push(`heilt sich`); }
  if (it.a) {
    anim("#bEnemy .sprite", "lunge");
    const n = it.n || 1;
    for (let k = 0; k < n; k++) {
      if (p.hp <= 0) break;
      damagePlayer(calc(it.a, e.st, p.st));
      if (p.st.thorns > 0) { e.hp -= p.st.thorns; fx("e", "✶ -" + p.st.thorns, "dmg"); }
    }
    parts.push(`greift an`);
  }
  if (it.weak) p.st.weak += it.weak;
  if (it.vuln) p.st.vuln += it.vuln;
  if (it.poison) p.st.poison += it.poison;
  if (it.weak || it.vuln || it.poison) parts.push("schwächt dich");
  if (it.junk) { for (let k = 0; k < it.junk; k++) B.disc.push({ id:"schrott", l:0, u:B.uid++ }); parts.push(`wirft ${it.junk} Schrott in deine Ablage`); }
  B.log = `${B.E.n} ${parts.join(", ")}.`;
  if (e.st.weak > 0) e.st.weak--;
  if (e.st.vuln > 0) e.st.vuln--;
  e.i++;
  renderBattle();
  if (p.hp <= 0) return endBattle(false);
  if (e.hp <= 0) return endBattle(true);
  checkPhase();
  setTimeout(() => { if (B && !B.over) playerTurn(); }, 650);
}

function endBattle(won) {
  B.over = true; B.busy = true;
  renderBattle();
  if (won) anim("#bEnemy .sprite", "dead");
  setTimeout(() => won ? victory() : defeat(), won ? 700 : 500);
}

function victory() {
  const E = B.E, z = B.z;
  let xp = E.xp, co = E.co;
  if (hasRel("linse")) xp = Math.round(xp * 1.25);
  if (hasRel("karte")) co = Math.round(co * 1.25);
  const startLv = S.lv, startXP = S.xp;
  S.st.wins++; S.co += co;
  if (E.boss) S.bd[z] = true; else S.zw[z] = Math.min(BOSS_WINS, S.zw[z] + 1);
  if (B.poisonKill) S.st.poisonKills++;
  if (B.p.hp >= B.startHP) S.st.perfect++;
  if (B.turn <= 2) S.st.fast++;
  const ups = addXP(xp);
  // Karten-Auswahl
  let w = { ...ZONES[z].w };
  if (E.boss) { const order = ["c","r","e","l"], min = order.indexOf(ZONES[z].bossR); order.forEach((r, k) => { if (k < min) w[r] = 0; else w[r] = w[r] || 5; }); }
  const opts = [];
  for (let k = 0; k < 3; k++) { const id = pickCard(w, opts, true); if (id) opts.push(id); }
  let relic = null;
  if (E.boss) { const pool = RELICS.filter(r => !hasRel(r.id)); if (pool.length) { relic = rnd(pool).id; S.rel.push(relic); } }
  rollShop();
  checkAch(); save();
  B.reward = { opts, picked:null, skipCoins: 10 + z * 10 };

  const n0 = need(startLv);
  const newZones = ZONES.filter(Z => Z.lv > startLv && Z.lv <= S.lv).map(Z => Z.n);
  modal(`<h2>Sieg!</h2>
    <p>${E.n} wurde besiegt.${B.poisonKill ? " Das Gift hat ganze Arbeit geleistet." : ""}</p>
    <div class="gains"><span class="x">+${xp} EP</span><span class="coin">+${co}</span></div>
    <div class="reward-xp"><div class="xpbar"><i id="rxp" style="width:${S.lv > startLv ? 0 : startXP / n0 * 100}%"></i></div>
      <div class="xptext" style="text-align:center">Level ${S.lv} · ${S.lv >= MAX_LV ? "Maximum" : `${S.xp} / ${need(S.lv)} EP`}</div></div>
    ${ups.length ? `<div class="lvup">Level ${S.lv}! +${ups.length * 2} ✦ Level-Punkte</div>` : ""}
    ${newZones.length ? `<div class="next">Neue Zone freigeschaltet: <b>${newZones.join(", ")}</b></div>` : ""}
    ${relic ? `<div class="relic" style="border:0"><span class="re">${RM[relic].e}</span><div class="ri"><div class="rn">Artefakt: ${RM[relic].n}</div><div class="rd">${RM[relic].d}</div></div></div>` : ""}
    ${opts.length ? `<p style="text-align:center;color:var(--moon);font-weight:600">Wähle eine neue Karte</p>
      <div class="choice" id="choice">${opts.map(id => cardHTML(id, 0, { attrs:`data-act="pick" data-id="${id}" role="button" tabindex="0"` })).join("")}</div>
      <button class="btn ghost" data-act="skipPick">Überspringen · <span class="coin">+${B.reward.skipCoins}</span></button>`
      : `<div class="next">Du besitzt bereits alle Karten dieser Seltenheit. Bonus: <span class="coin">+50</span></div>`}
    <button class="btn" id="contBtn" data-act="leave" ${opts.length ? "hidden" : ""}>Weiter</button>`);
  if (!opts.length) { S.co += 50; save(); }
  requestAnimationFrame(() => { const x = $("#rxp"); if (x) setTimeout(() => x.style.width = (S.lv >= MAX_LV ? 100 : S.xp / need(S.lv) * 100) + "%", 80); });
}
function defeat() {
  const xp = Math.round(B.E.xp * 0.25);
  S.st.losses++;
  const ups = addXP(xp);
  checkAch(); save();
  modal(`<h2>Niederlage</h2>
    <p>${B.E.n} war diesmal zu stark. Du bekommst trotzdem <b style="color:var(--r-r)">${xp} EP</b> für die Erfahrung.</p>
    ${ups.length ? `<div class="lvup">Level ${S.lv}! +${ups.length * 2} ✦</div>` : ""}
    <div class="next">Tipp: Werte deine besten Karten im Karten-Tab auf, nimm mehr Schild-Karten ins Deck oder sammle in leichteren Zonen weitere EP.</div>
    <button class="btn" data-act="leave">Zurück zur Karte</button>`);
}
function leaveBattle() {
  B = null; modal("");
  $("#battle").hidden = true; $("#battle").innerHTML = "";
  $("#app").removeAttribute("aria-hidden");
  UI.tab = "adv"; render();
}

/* =========================================================
   EINGABE
   ========================================================= */
function act(el, ev) {
  const a = el.dataset.act, id = el.dataset.id;
  switch (a) {
    case "tab": UI.tab = el.dataset.k; render(); $("#main").scrollTop = 0; break;
    case "filter": UI.filter = el.dataset.k; render(); break;
    case "fight": startBattle(el.dataset.e, +el.dataset.z); break;
    case "noop": toast(`Gewinne ${BOSS_WINS} Kämpfe in dieser Zone, um den Boss zu öffnen.`); break;
    case "card": cardModal(id); break;
    case "lockedcard": {
      const c = CM[id], zs = ZONES.filter(Z => Z.w[c.r] > 0).map(Z => Z.n);
      modal(`<h2>Gesperrte Karte</h2><div class="bigcard">${cardHTML(id, 0, { locked:true })}</div>
        <p>Seltenheit: <b style="color:var(--moon)">${RAR[c.r].n}</b>. Gewinne Kämpfe, um sie als Belohnung zu ziehen. Sie kann in folgenden Zonen auftauchen: ${zs.join(", ")}. Manchmal liegt sie auch im Shop.</p>
        <button class="btn ghost" data-act="close">Schließen</button>`);
      break;
    }
    case "upgrade": {
      const l = S.own[id], cost = upCost(l);
      if (l >= MAX_CARD_LV || S.pts < cost) return;
      S.pts -= cost; S.own[id] = l + 1; checkAch(); save();
      toast(`${CM[id].n} ist jetzt +${l + 1}`);
      render(); cardModal(id); break;
    }
    case "toggleDeck": {
      const i = S.deck.indexOf(id);
      if (i >= 0) { if (S.deck.length <= DECK_MIN) return; S.deck.splice(i, 1); }
      else { if (S.deck.length >= DECK_MAX) return; S.deck.push(id); }
      save(); render(); cardModal(id); break;
    }
    case "close": modal(""); break;
    case "closeBg": if (ev.target === el && !B) modal(""); break;
    case "buyCard": {
      const p = RAR[CM[id].r].price;
      if (S.co < p || id in S.own) return;
      S.co -= p; unlockCard(id); S.shop.sold.push(id); checkAch(); save();
      toast(`${CM[id].n} freigeschaltet${S.deck.includes(id) ? " und ins Deck gelegt" : ""}`); render(); break;
    }
    case "buyRel": {
      const r = RM[id]; if (S.co < r.price || hasRel(id)) return;
      S.co -= r.price; S.rel.push(id); checkAch(); save(); toast(`${r.n} erworben`); render(); break;
    }
    case "reroll": if (S.co < 25) return; S.co -= 25; rollShop(); save(); render(); break;
    case "pack": {
      if (S.co < 120) return;
      S.co -= 120;
      const w = ZONES[topZone()].w, got = [];
      for (let k = 0; k < 3; k++) { const cid = pickCard(w, [], false); const r = unlockCard(cid); got.push({ id:cid, dup:r.dup }); }
      checkAch(); save(); render();
      modal(`<h2>Sternenpack</h2><div class="choice">${got.map(g => `<div>${cardHTML(g.id, S.own[g.id])}${g.dup ? `<div class="dup" style="text-align:center">Doppelt · <span class="coin">+${g.dup}</span></div>` : `<div class="dup" style="text-align:center;color:var(--venom)">Neu!</div>`}</div>`).join("")}</div>
        <button class="btn" data-act="close">Super</button>`);
      break;
    }
    case "play": playCard(+el.dataset.i); break;
    case "endTurn": endTurn(); break;
    case "fleeAsk":
      if (!B || B.over) return;
      modal(`<h2>Kampf aufgeben?</h2><p>Du erhältst keine Belohnung und der Kampf zählt als Niederlage.</p>
        <div class="row"><button class="btn ghost" data-act="close">Weiterkämpfen</button><button class="btn danger" data-act="flee">Aufgeben</button></div>`);
      break;
    case "flee": S.st.losses++; save(); leaveBattle(); break;
    case "pick": {
      if (!B || !B.reward || B.reward.picked) return;
      B.reward.picked = id; unlockCard(id); checkAch(); save();
      el.classList.add("picked");
      document.querySelectorAll("#choice .card").forEach(c => { if (c !== el) c.style.opacity = ".3"; });
      toast(`${CM[id].n} freigeschaltet${S.deck.includes(id) ? " und ins Deck gelegt" : ""}`);
      const sk = document.querySelector('[data-act="skipPick"]'); if (sk) sk.hidden = true;
      $("#contBtn").hidden = false; break;
    }
    case "skipPick":
      if (!B || !B.reward || B.reward.picked) return;
      B.reward.picked = "skip"; S.co += B.reward.skipCoins; save(); leaveBattle(); break;
    case "leave": leaveBattle(); break;
    case "help": helpModal(); break;
    case "resetAsk":
      modal(`<h2>Spielstand löschen?</h2><p>Level, Karten, Münzen und Erfolge gehen verloren. Das lässt sich nicht rückgängig machen.</p>
        <div class="row"><button class="btn ghost" data-act="close">Abbrechen</button><button class="btn danger" data-act="reset">Löschen</button></div>`);
      break;
    case "reset": S = defSave(); S.seen = true; rollShop(); save(); modal(""); UI.tab = "adv"; render(); toast("Neues Spiel gestartet"); break;
  }
}
document.addEventListener("click", ev => {
  const el = ev.target.closest("[data-act]");
  if (el) act(el, ev);
});
document.addEventListener("keydown", ev => {
  if ((ev.key === "Enter" || ev.key === " ") && ev.target.matches("[data-act][tabindex]")) { ev.preventDefault(); act(ev.target, ev); }
});

/* =========================================================
   START
   ========================================================= */
function start(data) {
  S = (data && data.S) || load();
  if (!S.shop) rollShop();
  render();
  if (!S.seen) { S.seen = true; save(); helpModal(); }
}
window.claude?.hot?.snapshot?.(() => ({ S }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
</body>
</html>
