<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Sternenkarten</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0c0f22">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sternenkarten">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-sized column. Status bar on top, one screen in the middle, four tabs at the bottom.
   Every screen leads with one clear action; the upgrade tree is a pannable star map. */
:root {
  --night: #0c0f22;      /* deep lunar night, page ground */
  --deck: #171b37;       /* raised panels */
  --deck-2: #222851;     /* chips, empty bars */
  --line: #313869;       /* hairlines */
  --moon: #ece8d9;       /* moon-silver text */
  --dim: #a3a5c2;        /* secondary text */
  --gold: #f2c14e;       /* lunar gold: the one action colour */
  --gold-ink: #1b1606;
  --hp: #ff5d6c;
  --shield: #6ecbff;
  --good: #7bd88f;
  --xp: #9a88ff;
  --t-a: #ff7a59; --t-d: #59b8ff; --t-c: #c48bff; --t-k: #f2c14e;
  --r-c: #9aa3b8; --r-r: #4fb3ff; --r-e: #b77bff; --r-l: #ffb347;
  --f-display: "Chakra Petch", "Trebuchet MS", system-ui, sans-serif;
  --f-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--night); color: var(--moon);
  font-family: var(--f-body); font-size: 16px; line-height: 1.35;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  overflow: hidden; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none;
}
body::after {
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: .4;
  background-image:
    radial-gradient(1px 1px at 12% 18%, var(--moon) 50%, transparent 51%),
    radial-gradient(1px 1px at 72% 9%, var(--moon) 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 41% 63%, var(--dim) 50%, transparent 51%),
    radial-gradient(1px 1px at 88% 47%, var(--moon) 50%, transparent 51%),
    radial-gradient(1px 1px at 23% 86%, var(--dim) 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 63% 92%, var(--moon) 50%, transparent 51%);
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, [data-act]:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; letter-spacing: .02em; }
p { margin: 0; }
.muted { color: var(--dim); }

#app { position: relative; z-index: 1; max-width: 560px; height: 100%; margin: 0 auto; display: flex; flex-direction: column; }

/* ---------- Statusleiste ---------- */
#top { display: flex; align-items: center; gap: 12px; padding-block: calc(12px + env(safe-area-inset-top, 0px)) 10px; border-bottom: 1px solid var(--line); }
.lvl-badge { font-family: var(--f-display); font-weight: 700; font-size: 14px; background: var(--gold); color: var(--gold-ink); padding: 4px 9px; border-radius: 7px; white-space: nowrap; }
.xpwrap { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.bar { height: 8px; background: var(--deck-2); border-radius: 4px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--xp); border-radius: 4px; transition: width .5s ease; }
.bar.gold i { background: var(--gold); }
.xptext { font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; }
.wallet { display: flex; gap: 10px; font-weight: 700; font-variant-numeric: tabular-nums; font-size: 15px; white-space: nowrap; }
.coin::before { content: ""; display: inline-block; width: .8em; height: .8em; border-radius: 50%; background: var(--gold); box-shadow: inset -2px -2px 0 rgba(0,0,0,.25); margin-right: 5px; vertical-align: -1px; }
.sp { color: var(--good); }
.sp::before { content: "★"; margin-right: 3px; }

#main { flex: 1; overflow-y: auto; overflow-x: hidden; padding-block: 14px 24px; -webkit-overflow-scrolling: touch; display: flex; flex-direction: column; gap: 14px; min-height: 0; }
#main > * { flex-shrink: 0; }
#main.fill { overflow: hidden; padding-bottom: 8px; }
.screen-title h2 { font-size: 24px; }
.screen-title p { color: var(--dim); font-size: 14px; margin-top: 2px; }
.label { font-family: var(--f-display); text-transform: uppercase; letter-spacing: .12em; font-size: 12px; color: var(--dim); margin-top: 6px; }

#nav { display: grid; grid-template-columns: repeat(5, 1fr); border-top: 1px solid var(--line); padding-block: 6px calc(8px + env(safe-area-inset-bottom, 0px)); }
#nav button { background: none; border: 0; padding: 4px 0; display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--dim); font-size: 12px; font-weight: 600; }
#nav button svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
#nav button.on { color: var(--gold); }
#nav .badge { position: relative; }
#nav .badge b { position: absolute; top: -4px; right: -12px; min-width: 18px; height: 17px; padding: 0 4px; border-radius: 9px; background: var(--good); color: var(--night); font-size: 11px; line-height: 17px; }

.btn { border: 0; border-radius: 12px; padding: 13px 18px; font-weight: 700; font-size: 16px; background: var(--gold); color: var(--gold-ink); font-family: var(--f-display); letter-spacing: .03em; transition: transform .12s ease, opacity .2s; }
.btn:active { transform: scale(.97); }
.btn.ghost { background: var(--deck-2); color: var(--moon); }
.btn.green { background: var(--good); color: var(--night); }
.btn.danger { background: var(--hp); color: var(--night); }
.btn.big { width: 100%; font-size: 20px; padding: 16px; }
.btn.sm { padding: 8px 12px; font-size: 14px; border-radius: 9px; }
.btn.wide { width: 100%; }
.btn[disabled] { opacity: .4; pointer-events: none; }
.panel { background: var(--deck); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
.r-c { --rc: var(--r-c); } .r-r { --rc: var(--r-r); } .r-e { --rc: var(--r-e); } .r-l { --rc: var(--r-l); }
.rar { color: var(--rc); font-weight: 700; }

.chance { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-weight: 700; font-size: 14px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.chance.easy { background: color-mix(in srgb, var(--good) 20%, transparent); color: var(--good); }
.chance.even { background: color-mix(in srgb, var(--gold) 20%, transparent); color: var(--gold); }
.chance.hard { background: color-mix(in srgb, var(--hp) 20%, transparent); color: var(--hp); }

/* ---------- Start ---------- */
.herobar { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; background: var(--deck); border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
.portrait { width: 64px; height: 64px; border-radius: 50%; flex: none; display: grid; place-items: center; font-size: 36px;
  background: radial-gradient(circle at 35% 30%, var(--moon), #b9b39e 55%, #6f6a5b); box-shadow: 0 0 0 3px var(--hc, var(--r-c)); }
.herobar .hb { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.herobar .ht { font-size: 12px; text-transform: uppercase; letter-spacing: .12em; color: var(--hc); font-weight: 700; }
.herobar .hn { font-family: var(--f-display); font-size: 20px; font-weight: 700; }
.chev { color: var(--dim); font-size: 22px; }
.nextfight { position: relative; overflow: hidden; border-radius: 20px; padding: 18px; border: 2px solid var(--gold); background: var(--deck); display: flex; flex-direction: column; gap: 12px; }
.nextfight::before { content: ""; position: absolute; inset: 0; background: var(--zbg); opacity: .55; pointer-events: none; }
.nextfight > * { position: relative; }
.nf-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.nf-kicker { font-size: 12px; text-transform: uppercase; letter-spacing: .14em; color: var(--gold); font-weight: 700; }
.nf-title { font-family: var(--f-display); font-size: 22px; font-weight: 700; margin-top: 2px; }
.nf-foes { font-size: 44px; letter-spacing: 6px; text-align: center; line-height: 1.2; }
.nf-hint { font-size: 14px; color: var(--moon); background: color-mix(in srgb, var(--night) 55%, transparent); border-radius: 12px; padding: 10px 12px; line-height: 1.4; }
.switchrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; background: none; border: 0; padding: 0; text-align: left; font-size: 14px; color: var(--dim); }
.switchrow b { color: var(--moon); }
.sw { width: 46px; height: 28px; border-radius: 999px; background: var(--deck-2); position: relative; flex: none; transition: background .2s; border: 1px solid var(--line); }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--dim); transition: transform .2s, background .2s; }
.sw.on { background: color-mix(in srgb, var(--good) 40%, var(--deck-2)); }
.sw.on::after { transform: translateX(18px); background: var(--good); }
.todos { display: flex; flex-direction: column; gap: 8px; }
.todo { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: var(--deck); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
.todo .ti { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-size: 22px; flex: none; background: var(--deck-2); }
.todo .tt { flex: 1; min-width: 0; }
.todo .tt b { display: block; }
.todo .tt span { font-size: 13px; color: var(--dim); }
.todo.hot { border-color: var(--good); }
.todo.hot .ti { background: color-mix(in srgb, var(--good) 22%, var(--deck-2)); }
.goal { font-size: 14px; color: var(--dim); line-height: 1.5; display: flex; flex-direction: column; gap: 4px; }
.goal b { color: var(--moon); }

/* ---------- Held ---------- */
.hero-svg { display: block; overflow: visible; }
.hero-svg.idle { animation: hover 3.2s ease-in-out infinite; }
@keyframes hover { 50% { transform: translateY(-5px); } }
.herocard { position: relative; overflow: hidden; display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; border-radius: 20px; padding: 12px 14px 12px 6px;
  border: 2px solid var(--hc); background: radial-gradient(120% 120% at 15% 50%, color-mix(in srgb, var(--hc) 22%, var(--deck)), var(--deck) 65%); }
.herocard .hb { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
.herocard .ht { font-size: 12px; text-transform: uppercase; letter-spacing: .12em; color: var(--hc); font-weight: 700; }
.herocard .hn { font-family: var(--f-display); font-size: 21px; font-weight: 700; line-height: 1.1; }
.eqdots { display: flex; gap: 5px; flex-wrap: wrap; }
.eqdots span { font-size: 11px; font-weight: 700; padding: 2px 6px; border-radius: 6px; background: var(--deck-2); border: 1px solid var(--tc); color: var(--moon); white-space: nowrap; }
.stage-hero { position: relative; text-align: center; border-radius: 24px; padding: 18px 16px 16px; overflow: hidden; border: 2px solid var(--hc);
  background: radial-gradient(70% 60% at 50% 38%, color-mix(in srgb, var(--hc) 30%, transparent), transparent 70%), linear-gradient(180deg, var(--deck), var(--night)); }
.stage-hero::after { content: ""; position: absolute; left: 50%; bottom: 96px; width: 190px; height: 34px; transform: translateX(-50%); border-radius: 50%;
  background: radial-gradient(closest-side, color-mix(in srgb, var(--hc) 45%, transparent), transparent); pointer-events: none; }
.stage-hero .hero-svg { margin: 0 auto; position: relative; z-index: 1; }
.stage-hero .tt { font-size: 13px; text-transform: uppercase; letter-spacing: .16em; color: var(--hc); font-weight: 700; margin-top: 4px; }
.stage-hero h2 { font-size: 28px; }
.stage-hero .lvline { font-family: var(--f-display); color: var(--dim); font-size: 16px; margin-bottom: 10px; }
.stats4 { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 6px; }
.stats4 div { background: var(--deck); border: 1px solid var(--line); border-radius: 12px; padding: 10px 2px; text-align: center; }
.stats4 b { display: block; font-family: var(--f-display); font-size: 18px; font-variant-numeric: tabular-nums; }
.stats4 span { font-size: 10.5px; color: var(--dim); text-transform: uppercase; letter-spacing: .06em; }
.eqgrid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px; }
.eq { display: flex; flex-direction: column; gap: 6px; padding: 12px; border-radius: 16px; background: var(--deck); border: 2px solid var(--tc); min-width: 0; }
.eq .eh { display: flex; gap: 8px; align-items: center; }
.eq .ei { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-size: 22px; flex: none; background: color-mix(in srgb, var(--tc) 22%, var(--deck-2)); }
.eq .en { font-weight: 700; font-size: 14px; line-height: 1.15; }
.eq .ek { font-size: 12px; color: var(--dim); }
.eq .ed { font-size: 13px; color: var(--dim); line-height: 1.35; flex: 1; }
.eq .btn { width: 100%; }
.forms { display: grid; grid-template-columns: repeat(6, minmax(0,1fr)); gap: 4px; }
.forms div { text-align: center; border-radius: 12px; padding: 6px 0 4px; border: 1px solid var(--line); opacity: .4; min-width: 0; }
.forms div.on { opacity: 1; border-color: var(--hc); background: color-mix(in srgb, var(--hc) 14%, transparent); }
.forms div.done { opacity: .8; }
.forms .hero-svg { margin: 0 auto; }
.forms span { display: block; font-size: 10px; color: var(--dim); font-weight: 700; }
.ultbox { display: flex; gap: 12px; align-items: center; }
.ultbox .uicon { width: 52px; height: 52px; border-radius: 50%; flex: none; display: grid; place-items: center; font-size: 26px;
  background: radial-gradient(circle, color-mix(in srgb, var(--gold) 50%, transparent), var(--deck-2)); border: 2px solid var(--gold); }

/* ---------- Spielmodi ---------- */
.modes { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
.mode { position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; text-align: left; padding: 14px; border-radius: 18px; min-width: 0;
  border: 2px solid var(--mc); background: radial-gradient(120% 90% at 100% 0%, color-mix(in srgb, var(--mc) 26%, transparent), transparent 60%), var(--deck); }
.mode .mi { font-size: 34px; line-height: 1.1; }
.mode .mn { font-family: var(--f-display); font-weight: 700; font-size: 17px; }
.mode .md { font-size: 12.5px; color: var(--dim); line-height: 1.3; }
.mode .mb { font-size: 12px; color: var(--moon); font-weight: 600; margin-top: auto; padding-top: 4px; }
.mode .daily { position: absolute; top: 10px; right: 10px; font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 6px; background: var(--good); color: var(--night); }
.mode.locked { filter: grayscale(.8); opacity: .55; }
.nextfight .daily { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 6px; background: var(--good); color: var(--night); margin-left: 6px; vertical-align: 2px; }
.boost { font-size: 13px; color: var(--good); font-weight: 600; }
/* Minispiele */
.mg .b-top { align-items: center; }
.mgscore { font-family: var(--f-display); font-weight: 700; font-size: 26px; color: var(--gold); font-variant-numeric: tabular-nums; }
.mgarea { position: relative; flex: 1; min-height: 0; border-radius: 18px; overflow: hidden; border: 1px solid var(--line); background: color-mix(in srgb, var(--night) 70%, transparent); touch-action: manipulation; }
.mgarea canvas { display: block; width: 100%; height: 100%; }
.mghint { text-align: center; font-size: 14px; color: var(--dim); padding-block: 8px 14px; min-height: 40px; }
.mgtime { height: 6px; background: var(--deck-2); border-radius: 3px; overflow: hidden; margin-top: 4px; width: 120px; }
.mgtime i { display: block; height: 100%; background: var(--gold); transition: width .2s linear; }
.memgrid { position: absolute; inset: 10px; display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); grid-template-rows: repeat(var(--rows, 4), minmax(0,1fr)); gap: 7px; }
.memgrid.r6 .mem { font-size: 26px; }
.pwr { position: absolute; top: 34px; right: 12px; font-size: 13px; font-weight: 700; color: var(--shield); text-align: right; }
.met.big { font-size: 60px; width: 76px; height: 76px; margin: -38px 0 0 -38px; }
.met.big.hit1 { filter: brightness(1.3) saturate(.6); } .met.big.hit2 { filter: brightness(1.7) saturate(.2); }
.frosted .met { filter: hue-rotate(160deg) brightness(1.2); }
.weak { position: absolute; width: 64px; height: 64px; margin: -32px 0 0 -32px; border-radius: 50%; border: 0; font-size: 40px; background: radial-gradient(circle, color-mix(in srgb, var(--gold) 45%, transparent), transparent 70%); animation: pop .3s ease; z-index: 3; touch-action: manipulation; }
.crystal { position: absolute; left: 50%; top: 18%; transform: translateX(-50%); border: 2px solid var(--shield); border-radius: 16px; background: color-mix(in srgb, var(--shield) 22%, var(--deck)); font-size: 34px; padding: 6px 14px; z-index: 3; touch-action: manipulation; }
.crystal span { display: block; font-size: 12px; font-weight: 700; color: var(--shield); }
.bossbtn.shielded { filter: drop-shadow(0 0 18px var(--shield)) saturate(.5); }
.bossstage { font-family: var(--f-display); font-weight: 700; color: var(--gold); font-size: 14px; }
.mem { border: 0; border-radius: 14px; background: linear-gradient(150deg, var(--r-e), var(--r-r) 60%, var(--deck-2)); font-size: 34px; display: grid; place-items: center; transition: transform .25s; color: transparent; }
.mem::after { content: "✦"; color: var(--moon); font-size: 22px; opacity: .8; }
.mem.up { background: var(--deck); border: 2px solid var(--moon); color: inherit; transform: rotateY(180deg) scaleX(-1); }
.mem.up::after, .mem.done::after { content: none; }
.mem.done { background: color-mix(in srgb, var(--good) 22%, var(--deck)); border: 2px solid var(--good); color: inherit; opacity: .8; }
.mem.bad { animation: shake .3s; }
.met { position: absolute; left: 0; top: 0; width: 58px; height: 58px; margin: -29px 0 0 -29px; display: grid; place-items: center; font-size: 40px; border: 0; background: none; padding: 0; touch-action: manipulation; }
.met.pop { animation: metpop .25s ease-out forwards; pointer-events: none; }
@keyframes metpop { to { transform: scale(1.8); opacity: 0; } }
.base { position: absolute; left: 0; right: 0; bottom: 0; height: 46px; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 22px;
  background: linear-gradient(0deg, #6f6a5b, #b9b39e); border-top: 3px solid var(--moon); }
.base.hit { animation: shake .3s; }
.lives { position: absolute; top: 8px; left: 10px; font-size: 18px; letter-spacing: 2px; }
.combo { position: absolute; top: 8px; right: 12px; font-family: var(--f-display); font-weight: 700; color: var(--gold); font-size: 18px; }
.bosszone { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 12px; }
.bossbtn { border: 0; background: none; font-size: 120px; line-height: 1; padding: 0; transition: transform .06s; filter: drop-shadow(0 10px 20px rgba(0,0,0,.6)); touch-action: manipulation; }
.bossbtn:active { transform: scale(.93); }
.bossbtn.hurt { animation: shake .2s; }
.bosshp { width: 90%; height: 14px; background: var(--deck-2); border-radius: 7px; overflow: hidden; border: 1px solid var(--line); position: relative; }
.bosshp i { display: block; height: 100%; background: linear-gradient(90deg, var(--hp), #ff9a7a); transition: width .15s; }
.bosshp b { position: absolute; top: 0; height: 100%; width: 2px; background: var(--moon); opacity: .6; }
.bossinfo { font-size: 13px; color: var(--dim); text-align: center; font-variant-numeric: tabular-nums; }
.ultbtn { width: 90%; }
.ultbtn.ready { animation: charged .6s ease-in-out infinite; }

/* ---------- Etappen ---------- */
.zonetabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 2px; }
.zonetabs::-webkit-scrollbar { display: none; }
.ztab { flex: none; background: var(--deck-2); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; text-align: left; color: var(--dim); }
.ztab b { display: block; font-size: 14px; color: var(--moon); }
.ztab span { font-size: 12px; }
.ztab.on { background: var(--moon); border-color: var(--moon); }
.ztab.on b, .ztab.on span { color: var(--night); }
.ztab.lock { opacity: .45; }
.zonehead { position: relative; border-radius: 16px; padding: 16px; overflow: hidden; border: 1px solid var(--line); background: var(--deck); }
.zonehead::before { content: ""; position: absolute; inset: 0; background: var(--zbg); opacity: .6; }
.zonehead > * { position: relative; }
.zonehead h3 { font-size: 21px; }
.zonehead p { color: var(--dim); font-size: 14px; margin-top: 4px; }
.stages { display: flex; flex-direction: column; gap: 8px; }
.stage { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: var(--deck); border: 1px solid var(--line); border-radius: 14px; text-align: left; width: 100%; min-height: 64px; }
.stage .sn { font-family: var(--f-display); font-weight: 700; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-size: 16px; flex: none; background: var(--deck-2); }

// Große Zahlen lesbar machen
function fmt(n) {
  n = Math.round(n);
  if (Math.abs(n) < 100000) return n.toLocaleString("de-DE");
  if (Math.abs(n) >= 1e18) return n.toExponential(1).replace(".", ",");
  for (const [v, u] of [[1e15, "Brd."], [1e12, "Bio."], [1e9, "Mrd."], [1e6, "Mio."], [1e3, "Tsd."]])
    if (Math.abs(n) >= v) return (n / v).toLocaleString("de-DE", { maximumFractionDigits:1 }) + " " + u;
  return String(n);
}
function roman(n) {
  const R = [[10,"X"],[9,"IX"],[5,"V"],[4,"IV"],[1,"I"]]; let o = "";
  for (const [v, r] of R) while (n >= v) { o += r; n -= v; }
  return o;
}

      ev.push({ t:"banner", msg:`${u.n} explodiert!` });
      foes(u).forEach(f => directDmg(u, f, u.atk * u.ab.v));
    }
    const ph = mates(u).find(f => f.ab && f.ab.k === "revive" && !f.revGiven);
    if (ph) { ph.revGiven = true; u.alive = true; u.hp = u.max * ph.ab.v; ev.push({ t:"revive", ...snap(u), msg:`${ph.n} holt ${u.n} zurück!` }); return; }
    if (isP(u) && !u.hero && T.teamRevive && !teamRevUsed) { teamRevUsed = true; u.alive = true; u.hp = u.max * .4; ev.push({ t:"revive", ...snap(u), msg:`Rettungskapsel: ${u.n} ist zurück!` }); }
  }
  function applyDmg(t, d, a) {
    // Leibwächter fängt einen Teil ab
    const g = mates(t).find(m => m !== t && m.ab && m.ab.k === "guard");
    if (g && a && a.side !== t.side) {
      const part = Math.round(d * g.ab.v); d -= part;
      const ga = Math.min(g.shield, part); g.shield -= ga; g.hp -= part - ga;
      ev.push({ t:"hit", a:a.uid, ...snap(g), v:part, guard:true }); kill(g);
    }
    if (t.hero) gainEn(t, 8);
    const pierce = a && isP(a) ? T.pierce : 0;
    const abs = Math.min(t.shield, d * (1 - pierce)); t.shield -= abs; t.hp -= d - abs;
    return d;
  }
  function directDmg(src, t, d) {
    if (!t.alive) return;
    d = Math.max(1, Math.round(d * (1 - t.dr)));
    applyDmg(t, d, src);
    ev.push({ t:"hit", a:src.uid, ...snap(t), v:d, aoe:true });
    kill(t);
  }
  function hit(a, t, mult, aoe, noCounter) {
    if (!t || !t.alive || !a.alive) return 0;
    if (Math.random() < t.dodge) { ev.push({ t:"miss", a:a.uid, u:t.uid, aoe }); return 0; }
    const k = a.ab && a.ab.k, v = a.ab && a.ab.v;
    let d = a.atk * (1 + a.rage) * (1 - a.weaken) * mult * (.9 + Math.random() * .2);
    if (isP(a)) {
      if (round <= 2) d *= 1 + T.first;
      if (t.boss) d *= 1 + T.boss;
      if (t.hp / t.max < .35) d *= 1 + T.exec;
      if (aoe) d *= 1 + T.aoe;
    }
    if (k === "execute" && t.hp / t.max < .35) d *= 1 + v;
    if (k === "berserk") d *= 1 + v * (1 - a.hp / a.max);
    d *= 1 + t.mark;
    if (isP(a) && t.uid === ctl.focus) d *= 1.15;
    const crit = Math.random() < a.crit; if (crit) d *= a.critDmg;
    const dr = isP(a) ? t.dr * (1 - T.pierce) : t.dr;
    d *= (1 + t.shred) * (1 - dr);
    d = Math.max(1, Math.round(d));
    applyDmg(t, d, a);
    ev.push({ t:"hit", a:a.uid, ...snap(t), v:d, crit, aoe });
    const dotMul = isP(a) ? 1 + T.dot : 1;
    if (k === "poison") t.dots.push({ d:a.atk * v * dotMul, r:3 });
    if (k === "shred") t.shred += v;
    if (k === "drain") t.weaken = Math.min(.5, t.weaken + v);
    if (k === "mark") t.mark = Math.max(t.mark, v);
    if (k === "stun" && t.hp > 0 && Math.random() < v) { t.stun = 1; ev.push({ t:"stun", u:t.uid }); }
    if (k === "lifesteal") heal(a, d * v, a);
    if (k === "chain" && !aoe) { const o = foes(a).filter(f => f !== t); if (o.length) { const c2 = rnd(o); directDmg(a, c2, d * v); } }
    if (t.thorns > 0 && a.alive) {
      const r = Math.max(1, Math.round(d * t.thorns)); a.hp -= r; ev.push({ t:"hit", a:t.uid, ...snap(a), v:r, thorns:true }); kill(a);
    }
    kill(t);
    if (!noCounter && !aoe && t.alive && t.ab && t.ab.k === "counter" && a.alive && Math.random() < t.ab.v) {
      ev.push({ t:"skill", a:t.uid, msg:"Konter", quiet:1 }); hit(t, a, 1, false, true);
    }
    return d;
  }
  function target(u) {
    const fs = foes(u); if (!fs.length) return null;
    if (isP(u) && ctl.focus) { const f = fs.find(x => x.uid === ctl.focus); if (f) return f; }
    if (u.ab && u.ab.k === "snipe") return fs.reduce((m, f) => f.hp < m.hp ? f : m);
    const tz = fs.filter(f => f.ab && f.ab.k === "taunt");
    if (tz.length && Math.random() < .75) return rnd(tz);
    return rnd(fs);
  }
  const gainEn = (u, v) => { if (!u.alive) return; const b = u.en; u.en = Math.min(100, u.en + v * u.charge); if (Math.round(u.en) !== Math.round(b)) ev.push({ t:"en", u:u.uid, v:Math.round(u.en) }); };
  const aoeAll = (u, mult, name) => { ev.push({ t:"skill", a:u.uid, msg:name }); foes(u).forEach(f => hit(u, f, mult, true)); };
  const lowest = u => mates(u).reduce((m, f) => f.hp / f.max < m.hp / m.max ? f : m);

  function act(u) {
    const k = u.ab && u.ab.k, v = u.ab && u.ab.v;
    if (u.tele) {
      if (u.charging) { u.charging = false; ev.push({ t:"skill", a:u.uid, msg:"Großangriff" }); ev.push({ t:"charge", u:u.uid, on:false }); foes(u).forEach(f => hit(u, f, u.tele, true)); return; }
      if (round % 4 === 3) { u.charging = true; ev.push({ t:"warn", u:u.uid, msg:`⚠️ ${u.n} lädt einen Großangriff auf!` }); ev.push({ t:"charge", u:u.uid, on:true }); return; }
    }
    if (u.hero) {
      gainEn(u, 25);
      if (u.habs.includes("hNova") && round % 6 === 0) return aoeAll(u, 3, "Supernova");
      if (T.fall && round % 3 === 0) return aoeAll(u, 1, "Sternenfall");
      if (u.habs.includes("hStun") && round % 5 === 0) { ev.push({ t:"skill", a:u.uid, msg:"Gravitationswelle" }); foes(u).forEach(f => { f.stun = 1; ev.push({ t:"stun", u:f.uid }); }); }
    }
    if (k === "timebomb" && round === 4) return aoeAll(u, v, AB.timebomb.n);
    if (k === "aoe" && round % 3 === 0) return aoeAll(u, v, AB.aoe.n);
    if (k === "dragon" && round % 3 === 0) { aoeAll(u, v, AB.dragon.n); foes(u).forEach(f => f.dots.push({ d:u.atk * .4 * (isP(u) ? 1 + T.dot : 1), r:3 })); return; }
    if (k === "divine") { ev.push({ t:"skill", a:u.uid, msg:AB.divine.n, quiet:1 }); mates(u).forEach(f => heal(f, u.atk * v, u)); return; }
    if (k === "heal") { const lo = lowest(u); if (lo.hp / lo.max < .75) { ev.push({ t:"skill", a:u.uid, msg:AB.heal.n, quiet:1 }); heal(lo, u.atk * v, u); return; } }
    if (k === "barrier" && round % 2 === 0) { ev.push({ t:"skill", a:u.uid, msg:AB.barrier.n, quiet:1 }); addShield(lowest(u), u.atk * v); return; }
    let mult = 1 + (k === "snipe" ? v : 0);
    if (k === "charge") { u.cnt++; if (u.cnt % 3 === 0) { mult *= v; ev.push({ t:"skill", a:u.uid, msg:AB.charge.n, quiet:1 }); } }
    hit(u, target(u), mult);
    if (k === "rage") u.rage += v;
    if (k === "double" && u.alive && Math.random() < v) hit(u, target(u), 1);
    if (isP(u) && !u.hero && T.multi && u.alive && Math.random() < T.multi) hit(u, target(u), 1);
  }

  const hero = P.find(u => u.hero); ctl.hero = hero;
  const has = k => hero && TK[k].lv <= hero.lv;
  const ready = k => hero && hero.alive && has(k) && (k === "ult" ? hero.en >= 100 : !(ctl.cd[k] > 0));
  function useTech(k) {
    if (!ready(k)) return;
    if (k === "ult") {
      const U = hero.ult; hero.en = 0;
      ev.push({ t:"ult", a:hero.uid, msg:U.n }); ev.push({ t:"en", u:hero.uid, v:0 });
      foes(hero).forEach(f => hit(hero, f, U.mult * hero.ultMul, true));
      if (U.burn) foes(hero).forEach(f => f.dots.push({ d:hero.atk * U.burn * (1 + T.dot), r:3 }));
      if (U.heal) mates(hero).forEach(f => heal(f, f.max * U.heal, hero));
      return;
    }
    ctl.cd[k] = TK[k].cd;
    ev.push({ t:"tech", k, msg:TK[k].n });
    if (k === "wall") mates(hero).forEach(f => addShield(f, f.max * .25));
    if (k === "heal") mates(hero).forEach(f => heal(f, f.max * .25, hero));
    if (k === "stop") foes(hero).forEach(f => { f.stun = 1; ev.push({ t:"stun", u:f.uid }); });
  }
  function think() {
    if (!ctl.ai || !hero || !hero.alive) return;
    const team = mates(hero), avg = team.reduce((a, u) => a + u.hp / u.max, 0) / team.length, low = team.some(u => u.hp / u.max < .35);
    const charging = E.some(e => e.alive && e.charging);
    if (ready("ult")) ctl.cmds.push("ult");
    if (charging && ready("stop")) ctl.cmds.push("stop");
    else if (charging && ready("wall")) ctl.cmds.push("wall");
    if ((avg < .55 || low) && ready("heal")) ctl.cmds.push("heal");
    else if (avg < .6 && ready("wall") && !charging) ctl.cmds.push("wall");
    if (has("focus")) { const fs = foes(hero); if (fs.length && !fs.some(f => f.uid === ctl.focus)) ctl.focus = fs.reduce((m, f) => f.hp < m.hp ? f : m).uid; }
  }
  function commands() {
    think();
    while (ctl.cmds.length) {

      else useTech(c);
      if (over()) return;
    }
  }

  // Kampfbeginn
  for (const u of all) {
    const k = u.ab && u.ab.k;
    if (k === "shieldTeam") mates(u).forEach(f => addShield(f, f.max * u.ab.v));
    if (k === "burn") foes(u).forEach(f => f.dots.push({ d:u.atk * u.ab.v * (isP(u) ? 1 + T.dot : 1), r:4 }));
    if (u.hero && u.habs.includes("hShield")) P.forEach(f => addShield(f, u.max * .12));
  }
  if (T.shield) P.forEach(f => addShield(f, f.max * T.shield));
  yield flush();

  while (round < MAX_ROUNDS && !over()) {
    round++;
    Object.keys(ctl.cd).forEach(k => ctl.cd[k] = Math.max(0, ctl.cd[k] - 1));
    ev.push({ t:"round", n:round });
    commands(); yield flush();
    const order = all.filter(u => u.alive).sort((a, b) => b.spd - a.spd || Math.random() - .5);
    for (const u of order) {
      commands();
      if (!u.alive || over()) { yield flush(); continue; }
      if (u.stun > 0) {
        u.stun--; ev.push({ t:"frozen", u:u.uid });
        if (u.charging) { u.charging = false; ev.push({ t:"charge", u:u.uid, on:false }); ev.push({ t:"banner", msg:`${u.n}s Großangriff wurde abgebrochen!` }); }
        yield flush(); continue;
      }
      ev.push({ t:"act", u:u.uid });
      act(u);
      yield flush();
    }
    if (over()) break;
    for (const u of all) {
      if (!u.alive) continue;
      if (u.dots.length) {
        const d = Math.max(1, Math.round(u.dots.reduce((a, x) => a + x.d, 0)));
        u.hp -= d; u.dots.forEach(x => x.r--); u.dots = u.dots.filter(x => x.r > 0);
        ev.push({ t:"dot", ...snap(u), v:d }); kill(u);
      }
      if (!u.alive) continue;
      if (u.hero && u.habs.includes("hRegen")) heal(u, u.max * .04);
      if (isP(u) && T.regen) heal(u, u.max * T.regen);
    }
    if (over()) break;
  }
  yield flush();
  const win = !E.some(x => x.alive) && P.some(x => x.alive);
  return { win, rounds:round, timeout:!over() };
}

   ========================================================= */
function addHeroXP(n) {
  const out = { lv:[], abs:[], comps:[], forms:[], pts:0 };
  if (S.lv >= MAX_LV) return out;
  S.xp += n;
  while (S.lv < MAX_LV && S.xp >= heroNeed(S.lv)) {
    S.xp -= heroNeed(S.lv); S.lv++; out.lv.push(S.lv);
    const p = ptsFor(S.lv) + (S.lv % 5 === 0 ? treeFx().ptsLv : 0);
    S.sp += p; out.pts += p;
    HERO_AB.filter(a => a.lv === S.lv).forEach(a => out.abs.push(a.n));
    ULTS.filter(u => u.lv === S.lv && u.lv > 1).forEach(u => out.abs.push("Spezialangriff " + u.n));
    COMP.filter(c => c.lv === S.lv).forEach(c => out.comps.push(c.id));
    if (FORM_LV.includes(S.lv) && S.lv > 1) out.forms.push(S.lv);
  }
  if (S.lv >= MAX_LV) S.xp = 0;
  return out;
}
function teamBonus(k) {
  const T = treeFx();
  return unlocked().reduce((a, d) => a + (d.ab === k ? abVal(k, formOf(S.lv), T) : 0), 0);
}
function grantRewards(win, s) {
  const E = recLv(s), boss = isBoss(s), T = treeFx(), wis = teamBonus("wisdom"), luck = teamBonus("luck");
  let base = 12 * Math.pow(1.1, E - 1) * (boss ? 3 * (1 + T.bossXp) : 1);
  if (!win) base *= .3 * (1 + T.lossXp);
  const daily = win && dailyFree("story");
  if (daily) { base *= 2; useDaily("story"); }
  S.fails = S.fails || {};
  if (s === S.prog + 1) { if (win) delete S.fails[s]; else S.fails[s] = (S.fails[s] || 0) + 1; }
  const hx = Math.round(base * (1 + T.xp + wis));
  const first = win && s > S.prog;
  const co = win ? Math.round(9 * Math.pow(1.09, E - 1) * (boss ? 3 : 1) * (first ? 2 * (1 + T.firstCo) : 1) * (daily ? 2 : 1) * (1 + T.coins + luck)) : 0;
  S.co += co;
  let bossPts = 0;
  if (win) { S.stats.wins++; if (first) { S.prog = s; if (boss) { bossPts = BOSS_PTS; S.sp += bossPts; } } } else S.stats.losses++;
  const fromLv = S.lv;
  const hero = addHeroXP(hx);
  save();
  return { win, s, hx, co, first, hero, bossPts, fromLv, daily };
}

// Siegchance per Probekämpfen schätzen (zwischengespeichert, solange sich das Team nicht ändert)
const oddsCache = {};
function teamFor(s) {
  const P = buildTeam(), b = boostFor(s);
  if (b) P.forEach(u => { u.atk = Math.round(u.atk * (1 + b)); u.hp = u.max = Math.round(u.max * (1 + b)); });
  return P;
}
function winChance(s) {
  const key = [s, S.lv, Object.keys(S.tree).sort().join(""), JSON.stringify(S.rank), JSON.stringify(S.eq), boostFor(s)].join("|");
  if (oddsCache[key] == null) {
    let w = 0; const n = 30, T = treeFx();
    for (let i = 0; i < n; i++) if (simulate(teamFor(s), makeWave(s), T).win) w++;
    oddsCache[key] = w / n;
  }
  return oddsCache[key];
}
function chanceHTML(s) {
  const c = winChance(s), p = Math.round(c * 100) + " %";
  if (c >= .8) return `<span class="chance easy">${p} · Leicht</span>`;
  if (c >= .4) return `<span class="chance even">${p} · Knapp</span>`;
  return `<span class="chance hard">${p} · Zu schwer</span>`;
}
function farmStage() {
  for (let s = S.prog; s >= 1; s--) if (winChance(s) >= .8) return s;
  return S.prog >= 1 ? 1 : 0;
}

  const GY = H - 60, START = 30, stars = Array.from({ length:50 }, () => [Math.random() * W, Math.random() * (GY - 20), Math.random() * 1.5 + .4]);
  const st = { t:START, score:0, pkCount:0, combo:0, speed:240, dist:0, nextSpawn:300, y:GY, vy:0, jumps:0, obs:[], items:[], hurt:0, shield:0, magnet:0, started:false, el:0 };

  const onDown = e => { e.preventDefault(); jump(); };

  area.addEventListener("pointerdown", onDown); document.addEventListener("keydown", onKey);
  MG.cleanup = () => { area.removeEventListener("pointerdown", onDown); document.removeEventListener("keydown", onKey); };
  const PX = W * .2, PW = 38, PH = 46;
  const mult = () => Math.min(5, 1 + Math.floor(st.combo / 10));
  const hud = () => {
    $("#combo").textContent = st.combo >= 10 ? `Kombo ×${mult()}` : st.combo ? `${st.combo} am Stück` : "";
    $("#pwr").textContent = [st.shield ? "🛡️ Schild" : "", st.magnet > 0 ? `🧲 ${Math.ceil(st.magnet)} s` : ""].filter(Boolean).join("  ");
  };
  let last = performance.now();
  function spawn() {
    const r = Math.random(), x = W + 40, late = st.el > 8;
    if (r < .32) st.obs.push({ k:"rock", x, w:28, h:26 + Math.random() * 14 });
    else if (r < .56) st.obs.push({ k:"gap", x, w:70 + Math.random() * 50 });
    else if (r < .74 && late) st.obs.push({ k:"drone", x, w:34, y:GY - 95 - Math.random() * 25 });
    const n = 1 + Math.floor(Math.random() * 4), hy = GY - 40 - Math.random() * 110;
    for (let i = 0; i < n; i++) st.items.push({ k:"pk", x:x + 70 + i * 34, y:hy - Math.sin(i / 2) * 22 });
    const q = Math.random();
    if (q < .12) st.items.push({ k:"clock", x:x + 220, y:GY - 70 - Math.random() * 90 });
    else if (q < .19) st.items.push({ k:"shield", x:x + 220, y:GY - 60 - Math.random() * 90 });
    else if (q < .26) st.items.push({ k:"magnet", x:x + 220, y:GY - 60 - Math.random() * 90 });
    st.nextSpawn = Math.max(200, 300 - st.el * 2) + Math.random() * 200;
  }
  function penalty(text) {
    if (st.shield) { st.shield = 0; mgFloat(PX + 10, st.y - 70, "Schild!", "sh"); st.hurt = .5; hud(); return; }
    st.t -= 3; st.hurt = .8; st.combo = 0; mgFloat(PX + 10, st.y - 70, text, "dmg"); hud();
  }
  const ICON = { pk:"📦", clock:"⏱️", shield:"🛡️", magnet:"🧲" };
  function frame(now) {
    if (MG.dead) return;
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    if (st.started) {
      st.t -= dt; st.el += dt; st.speed += 7 * dt; const dx = st.speed * dt; st.dist += dx; st.nextSpawn -= dx;
      if (st.nextSpawn <= 0) spawn();
      st.obs.forEach(o => o.x -= dx); st.items.forEach(p => p.x -= dx);
      if (st.magnet > 0) { st.magnet -= dt; st.items.forEach(p => { if (p.k === "pk" && p.x < PX + 240) { p.x += (PX + PW / 2 - p.x) * 6 * dt; p.y += (st.y - PH / 2 - p.y) * 6 * dt; } }); if (st.magnet <= 0) hud(); }
      st.obs = st.obs.filter(o => o.x + o.w > -20); st.items = st.items.filter(p => p.x > -20 && !p.got);

      st.obs.forEach(o => {
        if (o.hit) return;
        if (o.k === "rock" && PX + PW - 6 > o.x && PX + 6 < o.x + o.w && st.y > GY - o.h + 4) { o.hit = true; penalty("Felsen! −3 s"); }
        if (o.k === "drone" && PX + PW - 6 > o.x && PX + 6 < o.x + o.w && st.y - PH < o.y + 14 && st.y > o.y - 14) { o.hit = true; penalty("Drohne! −3 s"); }
      });
      st.items.forEach(p => {
        if (p.got || Math.abs(p.x - (PX + PW / 2)) > 28 || Math.abs(p.y - (st.y - PH / 2)) > 32) return;

function startMemory() {

    const cards = icons.concat(icons).map(e => ({ e }));
    if (st.board > 1) cards.push({ e:"👁️", eye:true });   // einzelnes Späherauge ohne Partner

    }

    case "hit": setHP(e.u, e.hp, e.sh); if (!quiet) {

        floatAt(e.u, (e.crit ? "Krit! " : "") + fmt(e.v), e.crit ? "crit" : "dmg"); flash(e.u, "hurt"); burst(e.u, e.crit ? "crit" : "");

    case "miss": if (!quiet) { floatAt(e.u, "ausgewichen", "miss"); if (!e.aoe) say(`${nm(e.u)} weicht ${nm(e.a)} aus`); } return e.aoe ? 110 : 260;

      <div class="dm"><span class="rar">${RAR_N[d.r]}</span> · ${ROLES[d.role].n} · ${AB[d.ab].n} · ${unlocked().length} von 8 Begleitern${unlocked().length === 8 ? " · Team komplett!" : ""}</div></div>`; }).join("");
  const nextOpen = R.win && R.s === S.prog;
  const loseMsg = B.res.timeout ? "Nach 30 Runden ist die Zeit abgelaufen. Dein Team macht noch zu wenig Schaden." : "Dein Team ist gefallen.";
  modal(`<div class="result-head ${R.win ? "win" : "lose"}"><h2>${R.win ? "Sieg!" : "Niederlage"}</h2>
      <p>${R.win ? (R.first ? "Neue Etappe geschafft! Dafür gibt es extra Münzen." : `Gewonnen in ${B.res.rounds} ${B.res.rounds === 1 ? "Runde" : "Runden"}.`) : `${loseMsg} Du bekommst trotzdem ein paar EP, und beim nächsten Versuch hat dein Team ${Math.round(boostFor(R.s) * 100)} % Rückenwind.`}${R.daily ? " Tagesbonus: doppelte EP und Münzen!" : ""}</p></div>
    <div class="gains"><span class="x">+${fmt(R.hx)} EP</span>${R.co ? `<span class="coin">+${fmt(R.co)}</span>` : ""}${R.bossPts ? `<span class="sp">+${R.bossPts}</span>` : ""}</div>
    <div>${bar(mx ? 1 : S.xp, mx ? 1 : n)}<div class="xptext" style="text-align:center;margin-top:4px">Held Level ${S.lv} · ${mx ? "Maximum" : `${fmt(S.xp)} / ${fmt(n)} EP bis Level ${S.lv + 1}`}</div></div>
    ${lvUp ? `<div class="lvup"><b>Level ${S.lv} erreicht!</b><span>+${R.hero.pts} Sternenpunkte · Held und alle Begleiter werden stärker</span>
      <span style="font-size:22px;letter-spacing:4px;margin-top:6px">${comps}</span>
      ${R.hero.abs.map(a => `<span>Neu: ${a}</span>`).join("")}${R.hero.forms.length ? "<span>Alle Begleiter haben sich weiterentwickelt!</span>" : ""}</div>` : ""}
    ${newComps}
    ${auto ? `<div class="autoline" id="autoLine">Nächster Kampf startet gleich …</div>` : ""}
    ${lvUp && !auto ? `<button class="btn green wide" data-act="toTree">Sternenpunkte ausgeben</button>` : ""}
    ${nextOpen && !auto ? `<button class="btn big" data-act="again" data-s="${R.s + 1}">Weiter zu ${stageNo(R.s + 1) === 1 ? zoneAt(zoneOf(R.s + 1)).n : "Etappe " + stageNo(R.s + 1)}</button>` : ""}
    <div class="row">
      <button class="btn ghost" data-act="leave">Zum Start</button>
      <button class="btn ${nextOpen && !auto ? "ghost" : ""}" data-act="again" data-s="${R.s}">${auto ? "Sofort weiter" : R.win ? "Nochmal" : "Erneut versuchen"}</button>
    </div>
    ${auto ? `<button class="btn ghost sm" data-act="autoOff">Automatisch wiederholen stoppen</button>` : ""}`);
  if (auto) B.autoT = setTimeout(() => { if (B && B.done && S.auto) { modal(""); startBattle(R.s); } }, 2200);
  if (!R.win && S.auto) { S.auto = false; save(); }
}
function leaveBattle() {
  if (B) { clearTimeout(B.timer); clearTimeout(B.autoT); }
  B = null; modal("");
  $("#battle").hidden = true; $("#battle").innerHTML = "";
  render();
}

/* =========================================================
   EINGABE
   ========================================================= */
function act(el, ev) {
  const a = el.dataset.act, id = el.dataset.id;
  switch (a) {
    case "tab": UI.tab = el.dataset.k; modal(""); render(); $("#main").scrollTop = 0; break;
    case "heroInfo": UI.tab = "hero"; modal(""); render(); break;
    case "eqUp": {
      const k = el.dataset.k, l = S.eq[k], cost = eqCost(l);
      if (S.co < cost) return;
      S.co -= cost; S.eq[k] = l + 1; save();
      const e = EQUIP.find(x => x.k === k), sc = $("#main").scrollTop; render(); $("#main").scrollTop = sc;
      if (eqTier(l + 1) > eqTier(l)) toast(`Neues Aussehen: ${e.tiers[eqTier(l + 1)]}`);
      break;
    }
    case "card": cardModal(id); break;
    case "rankUp": {
      const r = S.rank[id] || 0, cost = rankCost(r);
      if (S.sp < cost) return;
      S.sp -= cost; S.rank[id] = r + 1; save(); render(); cardModal(id);
      toast(`${form(id, S.lv)[0]} ist jetzt Rang ${r + 1}`); break;
    }
    case "close": modal(""); break;
    case "closeBg": if (ev.target === el && !B && !MG && $("#battle").hidden) modal(""); break;
    case "zone": { const z = +el.dataset.z; if (z > 0 && S.prog < z * 10) { toast(`Besiege zuerst den Boss von Zone ${z}.`); return; } S.zone = z; save(); render(); break; }
    case "fight": startBattle(+el.dataset.s); break;
    case "tech": if (B && !B.done && !B.ctl.cmds.includes(el.dataset.k)) { B.ctl.cmds.push(el.dataset.k); techBar(); } break;
    case "focus": {
      if (!B || B.done) return;
      if (B.lv < TK.focus.lv) { toast(`🎯 Fokus lernt der Held auf Level ${TK.focus.lv}.`); return; }
      B.ctl.cmds.push({ k:"focus", uid:+el.dataset.u }); B.ctl.focus = +el.dataset.u; techBar(); break;
    }
    case "autoTech": {
      if (!B || S.auto) return;
      S.autoTech = !S.autoTech; B.ctl.ai = S.autoTech; save();
      el.classList.toggle("on", S.autoTech); el.textContent = `Auto ${S.autoTech ? "an" : "aus"}`; techBar(); break;
    }
    case "mode": modeIntro(el.dataset.k); break;
    case "modeLocked": toast(`${MM[el.dataset.k].n} wird auf Level ${MM[el.dataset.k].lv} freigeschaltet.`); break;
    case "miniGo": modal(""); stopMini(); MINI[el.dataset.k](); break;
    case "miniQuit": modal(`<h2>Spiel beenden?</h2><p>Wenn du jetzt aufhörst, bekommst du für diese Runde nichts.</p>
      <div class="row"><button class="btn ghost" data-act="close">Weiterspielen</button><button class="btn danger" data-act="miniBack">Beenden</button></div>`); break;
    case "miniBack": UI.tab = "home"; closeMini(); break;
    case "noop": toast("Schaffe zuerst die Etappe davor."); break;
    case "auto": S.auto = !S.auto; save(); render(); break;
    case "again": { const s = +el.dataset.s; if (B) clearTimeout(B.autoT); modal(""); S.zone = zoneOf(s); startBattle(s); break; }
    case "autoOff": { S.auto = false; save(); if (B) clearTimeout(B.autoT); const l = $("#autoLine"); if (l) l.textContent = "Automatisch wiederholen ist aus."; el.hidden = true; break; }
    case "leave": UI.tab = "home"; leaveBattle(); break;
    case "toTree": UI.tab = buyable().length || !rankable().length ? "tree" : "team"; UI.treeScroll = null; leaveBattle(); break;
    case "node": nodeModal(id); break;
    case "buyNode": {
      const n = TN[id]; if (!nodeOpen(n) || S.sp < n.cost) return;
      S.sp -= n.cost; S.tree[id] = 1; save(); modal(""); render();
      toast(`${n.icon} ${n.n} freigeschaltet`); break;
    }
    case "jump": {
      const w = $("#treeWrap"), br = TREE_DEF[+el.dataset.i];
      if (w) w.scrollTo({ left:Math.max(0, br.x * UI.zoom - w.clientWidth / 2), top:0, behavior:"smooth" }); break;
    }
    case "zoom": {
      const w = $("#treeWrap"), old = UI.zoom, cx = w ? (w.scrollLeft + w.clientWidth / 2) / old : TREE.W / 2;
      UI.zoom = old < 1 ? 1 : .55; UI.treeScroll = null; render();
      const w2 = $("#treeWrap"); if (w2) w2.scrollLeft = Math.max(0, cx * UI.zoom - w2.clientWidth / 2); break;
    }
    case "treeReset": {
      const p = resetPrice(); if (S.co < p) { toast(`Dafür brauchst du ${p} Münzen.`); return; }
      modal(`<h2>Baum zurücksetzen?</h2><p>Du bekommst alle ausgegebenen Sternenpunkte zurück und kannst sie neu verteilen. Das kostet ${p} Münzen.</p>
        <div class="row"><button class="btn ghost" data-act="close">Abbrechen</button><button class="btn" data-act="treeResetOk">Zurücksetzen</button></div>`); break;
    }
    case "treeResetOk": {
      const p = resetPrice(); if (S.co < p) return;
      S.co -= p; Object.keys(S.tree).forEach(k => { S.sp += TN[k] ? TN[k].cost : 0; }); S.tree = {}; save(); modal(""); render(); break;
    }
    case "help": helpModal(); break;
    case "installHelp": installModal(); break;
    case "saveCode":
      modal(`<h2>Spielstand übertragen</h2>
        <p class="muted">Kopiere diesen Code und füge ihn auf dem anderen Gerät oder in der installierten App hier wieder ein.</p>
        <textarea id="codeOut" class="codebox" readonly rows="4">${saveToCode()}</textarea>
        <button class="btn wide" data-act="codeCopy">Code kopieren</button>
        <textarea id="codeIn" class="codebox" rows="3" placeholder="Code hier einfügen"></textarea>
        <div class="row"><button class="btn ghost" data-act="close">Schließen</button><button class="btn green" data-act="codeLoad">Code laden</button></div>`); break;
    case "codeCopy": {
      const t = $("#codeOut"); t.select();
      (navigator.clipboard?.writeText(t.value) ?? Promise.reject()).then(() => toast("Code kopiert"), () => { document.execCommand("copy"); toast("Code kopiert"); });
      break;
    }
    case "codeLoad": {
      const n = codeToSave($("#codeIn").value || "");
      if (!n) { toast("Der Code passt nicht."); return; }
      S = n; save(); modal(""); render(); toast(`Spielstand geladen: Level ${S.lv}`); break;
    }
    case "resetAsk":
      modal(`<h2>Neu starten?</h2><p>Level, Karten, Baum und Münzen gehen verloren. Das lässt sich nicht rückgängig machen.</p>
        <div class="row"><button class="btn ghost" data-act="close">Abbrechen</button><button class="btn danger" data-act="reset">Alles löschen</button></div>`); break;
    case "reset": S = defSave(); S.seen = true; save(); modal(""); UI.tab = "home"; render(); toast("Neues Spiel gestartet"); break;
  }
}
document.addEventListener("click", ev => { const el = ev.target.closest("[data-act]"); if (el) act(el, ev); });

/* =========================================================
   ALS APP
   ========================================================= */
const IS_APP = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const IS_IOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
function installModal() {
  if (IS_APP) { modal(`<h2>Läuft als App</h2><p>Sternenkarten ist auf deinem Home-Bildschirm installiert und läuft auch ohne Internet.</p><button class="btn" data-act="close">Gut</button>`); return; }
  modal(`<h2>Als App installieren</h2>
    <div class="steps">
      ${IS_IOS ? "" : `<div><i>!</i><p>iPhone und iPad<span>Öffne diese Seite dort in Safari. Auf anderen Geräten nutze im Browser-Menü „App installieren“.</span></p></div>`}
      <div><i>1</i><p>Teilen antippen<span>Das Symbol mit dem Pfeil nach oben, in Safari unten in der Leiste.</span></p></div>
      <div><i>2</i><p>„Zum Home-Bildschirm“<span>Etwas nach unten scrollen, falls du es nicht gleich siehst.</span></p></div>
      <div><i>3</i><p>„Hinzufügen“<span>Danach startest du Sternenkarten über das Icon, im Vollbild und auch offline.</span></p></div>
    </div>
    <p class="muted" style="font-size:14px">Die App hat einen eigenen Spielstand. Nimm deinen bisherigen mit „Spielstand übertragen“ mit.</p>
    <button class="btn" data-act="close">Verstanden</button>`);
}
// Offline-Speicher; schlägt im Artifact-Vorschaurahmen still fehl
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost") && window.top === window) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
  navigator.storage?.persist?.().catch(() => {});
}

/* =========================================================
   START
   ========================================================= */
function start(data) {
  S = (data && data.S && data.S.v === 4) ? data.S : load();
  render();
  if (!S.seen) { S.seen = true; save(); helpModal(); }
  else if (IS_IOS && !IS_APP && window.top === window && !sessionStorageGet("installHint")) { sessionStorageSet("installHint"); installModal(); }
}
function sessionStorageGet(k) { try { return sessionStorage.getItem(k); } catch (e) { return "1"; } }
function sessionStorageSet(k) { try { sessionStorage.setItem(k, "1"); } catch (e) {} }
window.claude?.hot?.snapshot?.(() => ({ S }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
</body>
